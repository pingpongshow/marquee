openapi: 3.0.3
info:
  title: Marquee API
  version: 1.0.0-m1
  description: |
    Marquee media server API. This spec is the single source of truth: the Go server
    interfaces and all client SDKs are generated from it. It is extended milestone by
    milestone (see docs/05-roadmap.md); only implemented endpoints are listed.

    Authentication: `Authorization: Bearer <token>` on every request except those marked
    `security: []`.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: settings
  - name: libraries
  - name: filesystem
  - name: items
  - name: images
  - name: activity
  - name: users
  - name: search
  - name: plex
  - name: playback
  - name: hubs
  - name: playlists
  - name: music
  - name: syncplay
    description: Watch together (SyncPlay) - shared play, pause and seek for a video.
  - name: livetv
    description: Live TV channels and guide from M3U/XMLTV sources and Dispatcharr (LIVE-1..4).
  - name: requests
    description: Seerr search and requests (REQ-1, REQ-2), approved by admins in Marquee.

paths:
  /system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Public server identity and status (used for discovery and connection checks).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  /system/metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: "Prometheus metrics (ADM-7): playback, transcodes, Live TV, recordings, libraries and requests. Open to the home network; from elsewhere, admins only."
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness/readiness probe.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: First-run setup. Creates the admin account. Only allowed while setupRequired is true.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Setup complete; returns a session for the new admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/profiles:
    get:
      tags: [auth]
      operationId: listSignInProfiles
      summary: Profiles for the "Who's watching?" sign-in screen. Empty when PIN sign-in isn't allowed from the caller's network.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }

  /auth/pin:
    post:
      tags: [auth]
      operationId: pinLogin
      summary: Sign in by choosing a profile and entering its 4-digit PIN (managed profiles without a PIN need none).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinLoginRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/quickconnect:
    post:
      tags: [auth]
      operationId: startQuickConnect
      summary: A TV or other device asks to sign in with a code (Quick Connect). It shows the code and polls until someone approves it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200":
          description: Show the code; poll with the secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickConnectStart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/quickconnect/{secret}:
    get:
      tags: [auth]
      operationId: pollQuickConnect
      summary: Whether the code has been approved. Once it has, the response carries the sign-in token (only once).
      security: []
      parameters:
        - name: secret
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickConnectState" }

  /auth/quickconnect/authorize:
    post:
      tags: [auth]
      operationId: authorizeQuickConnect
      summary: Approve a device's Quick Connect code; it signs in as you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [deviceName]
                properties:
                  deviceName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Ask for a password or PIN reset link by email. Always 204, whether or not the account exists or has an email address (no user enumeration). Rate limited per address and per account."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotRequest" }
      responses:
        "204": { description: "If the account has an email address, a link is on its way." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset/info:
    post:
      tags: [auth]
      operationId: resetInfo
      summary: What a reset link is for (a password or a PIN, and whose), so the reset page asks for the right thing. 400 when the link is unknown, used or expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password or PIN with a reset link. The link stops working, the account's other links too, and the account is signed out on every device. Two-factor sign-in stays as it is."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "204": { description: Changed; sign in with the new password or PIN. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /notifications:
    get:
      tags: [system]
      operationId: listNotifications
      summary: Admin alerts for the bell, newest first (admin only). Kept for 30 days.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotificationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications/read-all:
    post:
      tags: [system]
      operationId: markAllNotificationsRead
      summary: Mark every alert read (admin only).
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [system]
      operationId: markNotificationRead
      summary: Mark an alert read (admin only).
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [system]
      operationId: dismissNotification
      summary: Dismiss (delete) an alert (admin only).
      responses:
        "204": { description: Dismissed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/test-email:
    post:
      tags: [system]
      operationId: testEmail
      summary: Send a test email with the saved mail settings now (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: The address to send to. }
      responses:
        "200":
          description: Sent or not.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session token.
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/scrobbling/listenbrainz:
    get:
      tags: [users]
      operationId: listenBrainzStatus
      summary: "Whether the caller's plays go to ListenBrainz (MUSIC-12)."
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrobbleStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [users]
      operationId: connectListenBrainz
      summary: Send the caller's music plays to ListenBrainz with their user token (checked with ListenBrainz first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "From listenbrainz.org/settings. Write-only." }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrobbleStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      tags: [users]
      operationId: disconnectListenBrainz
      summary: Stop sending plays to ListenBrainz.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/scrobbling/lastfm:
    get:
      tags: [users]
      operationId: lastFmStatus
      summary: "Whether the caller's plays go to Last.fm, and whether Last.fm is set up on this server (MUSIC-12)."
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrobbleStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [users]
      operationId: lastFmAuthUrl
      summary: "Start connecting Last.fm: the last.fm page where the person approves Marquee. Last.fm sends them back to callbackUrl with ?token=…"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl: { type: string }
      responses:
        "200":
          description: Where to go.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [users]
      operationId: connectLastFm
      summary: Finish connecting Last.fm with the token last.fm returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrobbleStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [users]
      operationId: disconnectLastFm
      summary: Stop sending plays to Last.fm.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update your own profile, password, PIN or preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: All users (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user or managed profile (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user (admin only). Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user and their devices, watch history and playlists (admin only). The last admin cannot be deleted.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getAvatar
      summary: A user's profile picture (512×512 JPEG). Available without signing in where the sign-in profile picker is shown.
      description: Use the `avatarUrl` from User or Profile; it carries a version so the response can be cached forever.
      security: []
      parameters:
        - name: v
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Image.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [users]
      operationId: setAvatar
      summary: Upload a profile picture (yourself, or any user as an administrator). JPEG, PNG or WebP up to 10 MB; it is center-cropped to a square and stored at 512×512.
      description: Clients crop and position the picture themselves and upload the square result.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteAvatar
      summary: Remove a profile picture (yourself, or any user as an administrator).
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /invites:
    get:
      tags: [users]
      operationId: listInvites
      summary: Invites to share this server with friends (USER-13, admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createInvite
      summary: Make a one-time invite link; whoever opens it picks a username and password and joins with these restrictions (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [users]
      operationId: deleteInvite
      summary: Withdraw an invite (admin only). Someone who already joined keeps their account.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [auth]
      operationId: getInvitation
      summary: What an invite link is for, before accepting it.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Join with an invite link, creating your account and signing in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAccept" }
      responses:
        "200":
          description: Joined and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /profiles:
    get:
      tags: [users]
      operationId: listProfiles
      summary: Profiles that can be switched to from this device.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{userId}/switch:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: switchProfile
      summary: Switch this device to another profile. Requires that profile's PIN (or password if it has no PIN).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchProfileRequest" }
      responses:
        "200":
          description: Switched; use the new token from now on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /devices:
    get:
      tags: [users]
      operationId: listDevices
      summary: Signed-in devices. Admins see every user's devices; others see their own.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices/{deviceId}:
    delete:
      tags: [users]
      operationId: revokeDevice
      summary: Sign a device out.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search titles across the libraries the user can access.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          description: Maximum results per type.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: favorites
          in: query
          description: Only the user's favourites (the heart).
          schema: { type: boolean }
      responses:
        "200":
          description: Results grouped by item type, best matches first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Server settings (admin only). Secret values are never returned, only whether they are set.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Partially update settings (admin only). Omitted sections and fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettingsUpdate" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /libraries:
    get:
      tags: [libraries]
      operationId: listLibraries
      summary: "Libraries visible to the current user. The Live TV recordings libraries (Recorded TV / Recorded Movies) are left out for everyone, admins included: recordings appear only under Live TV → Recordings (GET /livetv/recordings) and are played from there by item id."
      parameters:
        - { name: manage, in: query, schema: { type: boolean }, description: "Admins (Settings → Libraries): include the Live TV recordings libraries too, flagged recordings: true, so they can be rescanned and configured. Ignored for everyone else." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [libraries]
      operationId: createLibrary
      summary: Create a library (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [libraries]
      operationId: getLibrary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [libraries]
      operationId: updateLibrary
      summary: Update a library (admin only). Type cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [libraries]
      operationId: deleteLibrary
      summary: Delete a library and its metadata (admin only). Media files are never touched.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [libraries]
      operationId: scanLibrary
      summary: Queue a scan of one library (admin only). Returns immediately; poll the library for progress.
      responses:
        "202":
          description: Queued (or already queued/running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [libraries]
      operationId: cancelLibraryScan
      summary: Cancel a queued or running scan (admin only).
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /libraries/{libraryId}/remove-missing:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [libraries]
      operationId: removeMissingTitles
      summary: "Remove the library's missing files now (admin only): files a scan found gone, in library folders that can be reached right now (an empty folder counts as unreachable, like an unmounted disk). Titles left without files are removed too, with their watch history."
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, description: How many titles were removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /libraries/scan:
    post:
      tags: [libraries]
      operationId: scanAllLibraries
      summary: Queue a scan of every library (admin only).
      responses:
        "202": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [items]
      operationId: listLibraryItems
      summary: Top-level items of a library (movies, shows, artists or videos), or all items of a given type.
      parameters:
        - name: type
          in: query
          description: Item type to list. Defaults to the library's top-level type.
          schema: { $ref: "#/components/schemas/ItemType" }
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: watch
          in: query
          schema: { type: string, enum: [unwatched, watched, in_progress] }
        - name: genre
          in: query
          schema: { type: string }
        - name: decade
          in: query
          description: First year of a decade, e.g. 1990.
          schema: { type: integer }
        - name: contentRating
          in: query
          schema: { type: string }
        - name: resolution
          in: query
          schema: { type: string, enum: ["4k", "1080", "720", sd] }
        - name: hdr
          in: query
          schema: { type: boolean }
        - name: letter
          in: query
          description: Only titles starting with this letter ("#" for anything else).
          schema: { type: string }
        - name: minMyRating
          in: query
          description: "Only what the person rated at least this (0–10, e.g. 8 = 4 stars: favourites)."
          schema: { type: integer, minimum: 1, maximum: 10 }
        - name: favorites
          in: query
          description: "Only the person's favourites (the heart). Combines with the other filters and sorts; sort -favorited lists the newest favourites first."
          schema: { type: boolean }
        - name: seed
          in: query
          description: "With sort=random: the same seed gives the same shuffle on every page (send one per shuffle). Without it each page is shuffled on its own."
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: getItem
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Delete a title from its page (ADM-11, admin only, when allowMediaDeletion is on).
      description: "Every media file of the item and of everything under it (a show's or season's episodes, an artist's or album's tracks, a title's extras), with the subtitles and artwork beside each that belong only to it, moves to a .marquee-trash folder in its library folder and is removed for good when the daily Empty media trash task runs. The item leaves the library with its watch history, and so does a season or show (or album or artist) left empty. Nothing moves unless everything can: a file that isn't on disk or can't be moved stops the delete (409) and every file stays where it was. Collections are deleted with DELETE /collections/{collectionId}, which leaves their titles alone."
      responses:
        "200":
          description: Moved to the trash.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, description: How many media files moved to the trash. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{itemId}/metadata:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      tags: [items]
      operationId: editItem
      summary: Edit metadata fields (admin only). Edited fields are locked so agents won't overwrite them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemEdit" }
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/match:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: searchMatches
      summary: Candidate matches for Fix Match (admin only, movies and shows).
      parameters:
        - name: title
          in: query
          description: "Defaults to the item's title. A TMDB link (themoviedb.org/movie/603, /tv/1399), tmdb:603, an IMDb id (tt0133093) or an IMDb link is looked up directly and returns that one entry (none when TMDB doesn't have it; 400 when it is a show for a movie or a movie for a show). Plain numbers are titles (1917)."
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [items]
      operationId: applyMatch
      summary: Match the item to a specific provider entry and refresh its metadata (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: Matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/music-match:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: searchMusicMatches
      summary: MusicBrainz candidates for Fix match of a music artist or album (admin only; 400 for anything else).
      parameters:
        - name: q
          in: query
          description: "Artist name or album title; defaults to the item's. A MusicBrainz id or musicbrainz.org link (artist, release group or release) is looked up directly."
          schema: { type: string }
        - name: artist
          in: query
          description: Albums only; defaults to the album's artist.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicMatchCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [items]
      operationId: applyMusicMatch
      summary: "Match a music artist or album to a MusicBrainz artist or release group and look its details up again (admin only). The choice outlasts rescans and wins over MBIDs in tags; locked fields are kept."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicMatchRequest" }
      responses:
        "200":
          description: Matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/music-placement:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: setTrackPlacement
      summary: "Move a track to another album without editing its file (admin only, tracks only). Kept through rescans; albums and artists left empty are removed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackPlacementRequest" }
      responses:
        "200":
          description: Moved; the track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      operationId: clearTrackPlacement
      summary: Put a moved track back where its file's tags say it belongs (admin only, tracks only).
      responses:
        "200":
          description: Back as tagged; the track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/refresh:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: refreshItem
      summary: Re-download metadata for a matched movie or show, keeping locked fields (admin only).
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/commercials:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: getItemCommercials
      summary: "Commercials in a Live TV recording: found, cut or not (admin only). 404 for items that aren't recordings."
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialScan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/commercials/remove:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: removeItemCommercials
      summary: "Find and cut the commercials out of a Live TV recording now, whatever the setting (admin only). Queued and done in the background, one at a time; a recording being watched waits."
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialScan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /items/{itemId}/commercials/restore:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: restoreItemCommercials
      summary: "Put back the original of a recording whose commercials were cut, while it's still in the media trash (admin only). The cut file goes to the trash instead."
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialScan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{itemId}/children:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: listItemChildren
      summary: Seasons of a show, episodes of a season, albums of an artist, tracks of an album.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: favorites
          in: query
          description: "Only the user's favourites, and children holding one (a show's seasons with a favourite episode, an artist's albums with a favourite song)."
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/popular:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: listPopularTracks
      summary: "An artist's most-listened tracks that are in the library, most popular first (ListenBrainz, MUSIC-15). Empty until MusicBrainz enrichment has looked the artist up."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{artworkId}:
    get:
      tags: [images]
      operationId: getImage
      summary: Artwork resized to a cached width. Responses are immutable (a changed image gets a new id).
      description: Usable directly in <img> tags; authenticate with the `token` query parameter.
      parameters:
        - name: artworkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/ImageWidth"
      responses:
        "200":
          description: Image.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /people/{personId}/photo:
    get:
      tags: [images]
      operationId: getPersonPhoto
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/ImageWidth"
      responses:
        "200":
          description: Image.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /activity:
    get:
      tags: [activity]
      operationId: getActivity
      summary: What the server is doing right now (for the header activity indicator).
      description: Administrators see background tasks. Playback sessions are added in M3.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /logs:
    get:
      tags: [activity]
      operationId: getLogs
      summary: Recent server log lines, newest last (admin only).
      parameters:
        - name: level
          in: query
          description: Minimum level.
          schema: { type: string, enum: [debug, info, warn, error], default: info }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plex-import:
    get:
      tags: [plex]
      operationId: getPlexImport
      summary: Whether a Plex database is available, import progress and the last report (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexImportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [plex]
      operationId: startPlexImport
      summary: Start an import in the background (admin only). Safe to run again; nothing is duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlexImportRequest" }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexImportStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /plex-import/preview:
    post:
      tags: [plex]
      operationId: previewPlexImport
      summary: Read a snapshot of the Plex database and show what an import would do (admin only).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pathMappings:
                  type: array
                  description: Leave out to use the suggested mappings.
                  items: { $ref: "#/components/schemas/PlexPathMapping" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plex-sync:
    get:
      tags: [plex]
      operationId: getPlexSync
      summary: Two-way Plex sync settings, status, Plex accounts and the last run (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSyncStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [plex]
      operationId: updatePlexSync
      summary: Change two-way Plex sync settings (admin only). Fields left out stay as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlexSyncSettingsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSyncStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /plex-sync/run:
    post:
      tags: [plex]
      operationId: runPlexSync
      summary: "Sync with Plex now, in the background (admin only). Works whether automatic sync is on or off."
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSyncStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /plex-sync/preview:
    post:
      tags: [plex]
      operationId: previewPlexSync
      summary: "Work out what a sync would change each way, without changing anything in Marquee or Plex (admin only). Can take a while on a large library."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSyncReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /plex-sync/users/{plexAccountId}:
    parameters:
      - { name: plexAccountId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [plex]
      operationId: setPlexSyncUser
      summary: Choose the Marquee user a Plex account syncs with (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: integer, format: int64, description: "Marquee user; leave out to stop syncing this account." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSyncStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plex-sync/pin:
    post:
      tags: [plex]
      operationId: startPlexSignIn
      summary: "Start Sign in with Plex: open authUrl (or enter the code at plex.tv/link), then poll the PIN (admin only)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlexSignIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /plex-sync/pin/{pinId}:
    parameters:
      - { name: pinId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [plex]
      operationId: checkPlexSignIn
      summary: "Whether Sign in with Plex finished; once it has, the token is saved for sync (admin only)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [signedIn]
                properties:
                  signedIn: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /playback/sessions:
    get:
      tags: [playback]
      operationId: listPlaybackSessions
      summary: Active playback sessions. Administrators see everyone's; others see their own.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaybackSessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [playback]
      operationId: startPlayback
      summary: Start playing an item. The server decides between direct play, direct stream and transcode for this device and network.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackRequest" }
      responses:
        "200":
          description: Ready to play.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: The server is at its transcode limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playback/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [playback]
      operationId: reportPlayback
      summary: Report position and state (every ~10 seconds, and on pause/seek). Updates resume points and watched status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackProgress" }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [playback]
      operationId: stopPlayback
      summary: Stop playback. Administrators can stop anyone's session.
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/bandwidth-test:
    get:
      tags: [playback]
      operationId: bandwidthTest
      summary: Random bytes for the client to time its download speed (used for automatic remote quality).
      parameters:
        - name: kb
          in: query
          schema: { type: integer, minimum: 16, maximum: 8192, default: 1024 }
      responses:
        "200":
          description: Random data.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items/{itemId}/watched:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: markWatched
      summary: Mark watched (shows, seasons, artists and albums mark everything inside).
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      operationId: markUnwatched
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Marked unwatched. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/subtitles/search:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [playback]
      operationId: searchSubtitles
      summary: Search OpenSubtitles for a movie's or episode's subtitles (PLAY-7). Results made for this exact file come first.
      parameters:
        - name: languages
          in: query
          description: Comma-separated ISO 639-1 codes, e.g. "en,es".
          schema: { type: string, default: en }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /items/{itemId}/subtitles:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [playback]
      operationId: downloadSubtitle
      summary: Download a subtitle from OpenSubtitles and add it to the item's subtitle choices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, language]
              properties:
                fileId: { type: integer, format: int64, description: The result's OpenSubtitles file id. }
                language: { type: string }
                release: { type: string }
                hearingImpaired: { type: boolean }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [streamId]
                properties:
                  streamId: { type: integer, format: int64 }
                  remaining: { type: integer, description: Downloads OpenSubtitles allows today. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /items/{itemId}/subtitles/{streamId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: streamId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [playback]
      operationId: removeSubtitle
      summary: Remove a downloaded subtitle (admin only).
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /items/{itemId}/subtitles/bazarr:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: bazarrStatus
      summary: "Bazarr's view of a movie or episode's subtitles (META-12): what exists and what its language profile still wants."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BazarrStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [items]
      operationId: bazarrDownload
      summary: "Ask Bazarr to find and download the best subtitle in a language. Runs in the background; the new subtitle appears on the item when Bazarr has saved it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BazarrDownloadRequest" }
      responses:
        "202": { description: Started. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /items/{itemId}/subtitles/bazarr/search:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: bazarrSearch
      summary: Search Bazarr's providers for this movie or episode (can take up to a minute).
      responses:
        "200":
          description: Best first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BazarrCandidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    post:
      tags: [items]
      operationId: bazarrPick
      summary: Download one of the search results through Bazarr.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BazarrPick" }
      responses:
        "202": { description: Started. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /items/{itemId}/watchlist:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: addToWatchlist
      summary: Save to your watchlist (USER-8). Movies and episodes leave it once watched.
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Added. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      operationId: removeFromWatchlist
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/favorite:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: addFavorite
      summary: "Make a movie, show, episode, song, album or artist one of your favourites (the heart). Favourites are yours alone (a managed profile has its own); recommendations, Muse, radios and mixes weight them above star ratings."
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Added. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      operationId: removeFavorite
      summary: No longer one of your favourites.
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /watchlist:
    get:
      tags: [items]
      operationId: getWatchlist
      summary: Your watchlist, most recently added first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /libraries/{libraryId}/collections:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [items]
      operationId: createCollection
      summary: Create a manual collection (META-7, admin only). List collections with the library's items endpoint and type=collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                itemIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{libraryId}/smart-collections:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [items]
      operationId: createSmartCollection
      summary: Create a smart collection from library filters (META-7, admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmartCollectionSave" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collectionId}/rules:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [items]
      operationId: updateSmartCollection
      summary: Change a smart collection's rules (and optionally its name), or turn a manual collection's listing over to rules (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmartCollectionSave" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collectionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [items]
      operationId: deleteCollection
      summary: Delete a collection; its items stay in the library (admin only).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collectionId}/items:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [items]
      operationId: addToCollection
      summary: Add items from the same library to a collection (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Added. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collectionId}/items/{itemId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - $ref: "#/components/parameters/ItemId"
    delete:
      tags: [items]
      operationId: removeFromCollection
      summary: Take an item out of a collection (admin only).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/next:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: nextItem
      summary: The episode after this one (Up Next), if any.
      responses:
        "200":
          description: Next episode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemSummary" }
        "204": { description: Nothing follows. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /remote/inbox:
    post:
      tags: [playback]
      operationId: remoteInbox
      summary: "For an app that can be controlled (USER-14): waits up to 25 s for commands for this device. Calling it is what lists the device as a player; call again at once with the returned cursor. Send the current state along."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteInboxRequest" }
      responses:
        "200":
          description: Commands (possibly none).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteInbox" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /remote/state:
    put:
      tags: [playback]
      operationId: reportRemoteState
      summary: A controllable app reports what it's playing (on every change, and every 10 s while playing).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemotePlayerState" }
      responses:
        "204": { description: Noted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /remote/players:
    get:
      tags: [playback]
      operationId: listRemotePlayers
      summary: "Devices you can control: your own signed-in apps that are open (admins: everyone's), except the one asking."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RemotePlayer" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /remote/players/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [playback]
      operationId: getRemotePlayer
      summary: A player's state; with ?since=<version>, waits up to 25 s for it to change.
      parameters:
        - name: since
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemotePlayer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /remote/players/{deviceId}/commands:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [playback]
      operationId: sendRemoteCommand
      summary: Tell a player what to do.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteCommand" }
      responses:
        "204": { description: Delivered to the device's inbox. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/time-limit:
    get:
      tags: [users]
      operationId: myTimeLimit
      summary: "The caller's time limit today (kids' profiles): whether video may play now and how much is left. Starting playback past the limit or outside the viewing hours is refused with 403 and error code time_limit, and a session running when the time runs out ends (its progress reports answer 403 time_limit)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeLimitStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/recap:
    get:
      tags: [music]
      operationId: listeningRecap
      summary: Your year in music (MUSIC-22).
      parameters:
        - name: year
          in: query
          description: Default this year.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListeningRecap" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/recap/years:
    get:
      tags: [music]
      operationId: recapYears
      summary: Years with music in your history, newest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/recap/playlist:
    post:
      tags: [music]
      operationId: recapPlaylist
      summary: "Make a playlist of your top 50 songs of a year (\"Your Top Songs 2026\"), or refresh it if it exists."
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "201":
          description: The playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /muse/video:
    post:
      tags: [items]
      operationId: museVideo
      summary: "Muse for movies and shows (USER-15): describe what you'd like to watch and get matches from your libraries."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MuseVideoRequest" }
      responses:
        "200":
          description: Best matches first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MuseVideoResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /library-health:
    get:
      tags: [libraries]
      operationId: libraryHealth
      summary: Library health checks with how many items each found (ADM-11, admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HealthCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /library-health/{checkId}:
    parameters:
      - name: checkId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [libraries]
      operationId: libraryHealthIssues
      summary: What one check found (admin only). Ignored items are left out.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthIssuePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /library-health/{checkId}/ignored/{itemId}:
    parameters:
      - name: checkId
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [libraries]
      operationId: ignoreHealthIssue
      summary: Stop reporting this item for this check (admin only).
      responses:
        "204": { description: Ignored. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [libraries]
      operationId: unignoreHealthIssue
      summary: Report it again (admin only).
      responses:
        "204": { description: Reported again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Library optimizer (Library Health → Large files, admins only) ----------
  /optimize/files:
    get:
      tags: [libraries]
      operationId: listLargeFiles
      summary: "Movie and episode files matching the Large files filters, biggest first, with the size each would be after a preset and totals for all that match (admin only). Read from what the library knows; nothing is probed."
      parameters:
        - { name: libraryId, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, schema: { type: string, enum: [movie, episode] } }
        - { name: minSizeGb, in: query, description: "At least this many GB (10^9 bytes).", schema: { type: number, minimum: 0 } }
        - { name: minBitrateMbps, in: query, description: "At least this overall bitrate.", schema: { type: number, minimum: 0 } }
        - { name: resolution, in: query, description: "Only this resolution class (by width or height, so letterboxed films count): 2160 = 4K, 480 = SD.", schema: { type: integer, enum: [2160, 1080, 720, 480] } }
        - { name: codecs, in: query, description: "Only these video codecs, comma-separated FFprobe names (h264, hevc, mpeg2video, vc1, mpeg4, av1, vp9).", schema: { type: string } }
        - { name: hdr, in: query, description: "Only HDR (yes) or only SDR (no) files.", schema: { type: string, enum: ["yes", "no"] } }
        - { name: optimized, in: query, description: "Only files the optimizer has already replaced (yes, to optimize them again) or only ones still to do (no): not optimized and not already queued or being converted.", schema: { type: string, enum: ["yes", "no"] } }
        - { name: presetId, in: query, description: "The preset the estimates are for (default: the default preset).", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [size, bitrate, title, savings], default: size } }
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LargeFilePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /optimize/jobs:
    get:
      tags: [libraries]
      operationId: listOptimizeJobs
      summary: "The optimizer queue (running and queued jobs first, then finished ones not cleared) or its history (optimized and restored files, newest first), with the space saved so far (admin only)."
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [queue, history], default: queue } }
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizeJobPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [libraries]
      operationId: queueOptimizeJobs
      summary: "Queue files to be optimized with a preset: the files listed, or every file matching a filter (admin only). Files already queued, and ones that aren't available movies or episodes, are skipped. Files optimized before can be queued again (re-optimized)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimizeQueueRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizeQueueResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /optimize/jobs/clear:
    post:
      tags: [libraries]
      operationId: clearOptimizeJobs
      summary: "Remove finished jobs from the queue view; optimized files stay in the history (admin only)."
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /optimize/jobs/{jobId}/{action}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: integer, format: int64 } }
      - name: action
        in: path
        required: true
        description: "cancel = stop a queued or running job (the original stays as it is); retry = queue a failed, cancelled or skipped job again; restore = put an optimized file's original back from the media trash (the optimized file goes there instead; only when the original was kept)."
        schema: { type: string, enum: [cancel, retry, restore] }
    post:
      tags: [libraries]
      operationId: optimizeJobAction
      summary: Cancel, retry or restore an optimizer job (admin only).
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /optimize/originals/delete:
    post:
      tags: [libraries]
      operationId: deleteKeptOriginals
      summary: "Delete the originals of optimized files kept in the media trash, so they can no longer be restored (admin only). Only optimizer originals: nothing else in the media trash is touched. With keepOriginals off this also happens by itself at start-up and when the setting is saved."
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, freedBytes]
                properties:
                  deleted: { type: integer }
                  freedBytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /optimize/settings:
    get:
      tags: [libraries]
      operationId: getOptimizeSettings
      summary: "The optimizer's settings and every preset, built-in and custom (admin only)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizeConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [libraries]
      operationId: updateOptimizeSettings
      summary: "Change the optimizer's settings and custom presets (admin only). Built-in presets in the list are ignored."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimizeSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizeConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---------- end library optimizer ----------

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [libraries]
      operationId: deleteMediaFile
      summary: Delete a media file from Library Health (ADM-11, admin only, when allowMediaDeletion is on).
      description: "The file, and the subtitles and artwork beside it that belong only to it, move to a .marquee-trash folder in its library folder and are removed for good when the daily Empty media trash task runs. When it was the item's last file the item goes too, along with a season or show left empty."
      responses:
        "204": { description: Moved to the trash. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/home-layout:
    get:
      tags: [hubs]
      operationId: getHomeLayout
      summary: The person's Home rows, every available row included, in order (USER-12).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [hubs]
      operationId: setHomeLayout
      summary: Reorder, hide, pin (add collection-<id> / playlist-<id>) or unpin Home rows. An empty list resets to the default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeLayout" }
      responses:
        "200":
          description: The saved layout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeLayout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items/{itemId}/prerolls:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [playback]
      operationId: listPrerolls
      summary: "What to play before a movie (PLAY-18): trailers of other movies, then the pre-roll video. Empty when off, for non-movies, or when the person opted out. Call it only when starting from the beginning."
      responses:
        "200":
          description: In play order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/trailer:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: getItemTrailer
      summary: "The trailer for a movie or show (PLAY-22): a local trailer file when there is one, else the official trailer TMDB lists on YouTube."
      responses:
        "200":
          description: The trailer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTrailer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hubs/continue-watching:
    get:
      tags: [hubs]
      operationId: continueWatching
      summary: "All of the caller's Continue Watching, newest first, a page at a time: in-progress library movies, episodes and videos, the next episode of every show they've watched (no time limit), and films and episodes on demand stopped part-way through (when on demand is on and theirs to watch). Home's row is the first 20."
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinueWatchingPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /hubs/continue-watching/vod/{kind}/{vodId}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, episode] } }
      - { name: vodId, in: path, required: true, description: The film's or episode's id., schema: { type: integer, format: int64 } }
    delete:
      tags: [hubs]
      operationId: removeVodFromContinueWatching
      summary: "Removes a film on demand, or an episode's series, from your Continue Watching. The resume point is kept; it comes back once you play it (or, for a series, any of its episodes) again."
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hubs/continue-watching/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    delete:
      tags: [hubs]
      operationId: removeFromContinueWatching
      summary: "Removes a movie, episode or show from your Continue Watching (USER-6). The resume position is kept; it comes back once you play it (or, for a show, any of its episodes) again."
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hubs/home:
    get:
      tags: [hubs]
      operationId: homeHubs
      summary: Rows for the Home screen (Continue Watching, Recently Added…).
      parameters:
        - name: vod
          in: query
          description: "Include the Watch on VOD row (id vod-suggestions; films and series on demand picked for the caller, in vodEntries, with items empty). Only apps that show vodEntries should ask for it; without it the row is left out."
          schema: { type: boolean, default: false }
        - name: mixed
          in: query
          description: "Mix films and series on demand into the suggestion rows (Recommended for You, the holiday rows, Top Rated, Trending Now, the genre rows and the other category rows), in mixedEntries, and leave out the separate Watch on VOD row. Only apps that show mixedEntries should ask for it; without it those rows hold library items only (and rows with nothing from the library are left out)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hub" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /hubs/home/{hubId}:
    get:
      tags: [hubs]
      operationId: homeHub
      summary: "One Home row in full, for See all (USER-12): the hub ids GET /hubs/home returns (e.g. recommended, because-12, holiday-christmas, genre-comedy, top-rated, watchlist, favorites). Continue Watching, Recently Added, pinned collections and playlists have pages of their own; asking for them here gives the row as Home has it, longer."
      parameters:
        - name: hubId
          in: path
          required: true
          schema: { type: string }
        - name: mixed
          in: query
          description: As for GET /hubs/home.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: How many library titles (and as many on demand again, when mixed).
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hub" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /activity/history:
    get:
      tags: [activity]
      operationId: playHistory
      summary: Recent plays, newest first (admin only).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /downloads:
    get:
      tags: [downloads]
      operationId: listDownloads
      summary: Your conversions for offline viewing, newest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [downloads]
      operationId: createDownload
      summary: Prepare an item to download for offline playback. "original" is ready at once; other qualities are converted on the server (one at a time) and become ready later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, quality]
              properties:
                itemId: { type: integer, format: int64 }
                fileId: { type: integer, format: int64, description: A specific version; default is the best. }
                quality: { type: string, enum: [original, high, medium, low], description: "high 1080p, medium 720p, low 480p (HEVC MP4)." }
      responses:
        "200":
          description: Ready or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /downloads/{downloadId}:
    parameters:
      - name: downloadId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [downloads]
      operationId: getDownload
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [downloads]
      operationId: deleteDownload
      summary: Remove a conversion from the server (apps do this once they have the file).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/progress:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [playback]
      operationId: syncProgress
      summary: Record progress made while offline (a downloaded item played without a session).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionMs]
              properties:
                positionMs: { type: integer, format: int64 }
                watched: { type: boolean, description: Played to the end (counts a play). }
                playedAt: { type: string, format: date-time }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/test:
    post:
      tags: [system]
      operationId: testWebhook
      summary: Send a test event to a webhook URL now (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                secret: { type: string }
      responses:
        "200":
          description: Delivered or not.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  status: { type: integer, description: The receiver's HTTP status. }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/totp:
    get:
      tags: [auth]
      operationId: totpStatus
      summary: Whether the caller's account has two-factor sign-in.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  recoveryCodesLeft: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/totp/setup:
    post:
      tags: [auth]
      operationId: setupTotp
      summary: Start turning on two-factor sign-in - a new secret for the authenticator app.
      responses:
        "200":
          description: The secret, also as an otpauth:// URL for a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/totp/enable:
    post:
      tags: [auth]
      operationId: enableTotp
      summary: Finish turning on two-factor sign-in with a code from the app; returns one-time recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: On, with recovery codes (shown once).
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: Turn off two-factor sign-in (needs a current code or a recovery code). Admins can turn it off for another user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                userId: { type: integer, format: int64, description: "Admins only: another user's (no code needed)." }
      responses:
        "204": { description: Off. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /syncplay/groups:
    get:
      tags: [syncplay]
      operationId: listWatchGroups
      summary: Watch-together groups the caller can join (members can see any group on the server).
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [syncplay]
      operationId: createWatchGroup
      summary: Start watching something together; the caller is the first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: integer, format: int64 }
                positionMs: { type: integer, format: int64, minimum: 0 }
      responses:
        "201":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /syncplay/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [syncplay]
      operationId: getWatchGroup
      summary: The group's state. With since, waits (up to 25 s) for a newer version - long polling.
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /syncplay/groups/{groupId}/join:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [syncplay]
      operationId: joinWatchGroup
      summary: Join a group.
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /syncplay/groups/{groupId}/leave:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [syncplay]
      operationId: leaveWatchGroup
      summary: Leave a group; the last one out ends it.
      responses:
        "204": { description: Left. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /syncplay/groups/{groupId}/command:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [syncplay]
      operationId: watchGroupCommand
      summary: Play, pause or seek for everyone in the group (members only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, positionMs]
              properties:
                action: { type: string, enum: [play, pause, seek, buffering, ready] }
                positionMs: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/status:
    get:
      tags: [livetv]
      operationId: liveTvStatus
      summary: Whether Live TV is set up, and how many channels there are.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveTvStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/recordings:
    get:
      tags: [livetv]
      operationId: listRecordings
      summary: "DVR (LIVE-5): recordings in progress, upcoming (soonest first) and finished (newest first). Everyone's recordings are listed to every profile that may view DVR recordings, within the profile's content rating limit (the library item's rating once filed, else the guide's; unrated ones are hidden from rating-limited profiles). 403 when the caller may not view recordings. Recordings appear only here, never in the libraries, Home, search or browse; finished ones carry the caller's resume position (viewOffsetMs, durationMs, watched)."
      parameters:
        - $ref: "#/components/parameters/RecordingOwner"
      responses:
        "200":
          description: Recordings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recording" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [livetv]
      operationId: scheduleRecording
      summary: Record a programme from the guide, or every airing of its title (a series).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, start]
              properties:
                channelId: { type: integer, format: int64 }
                start: { type: string, format: date-time, description: The programme's start time as the guide gives it. }
                series: { type: boolean, description: Record every airing of this title. }
                anyChannel: { type: boolean, description: "With series: on any channel, not only this one." }
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recording: { $ref: "#/components/schemas/Recording" }
                  rule: { $ref: "#/components/schemas/RecordingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "quota_exceeded: the caller is at or over their DVR quota."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/recordings/usage:
    get:
      tags: [livetv]
      operationId: getRecordingUsage
      summary: "How much space the caller's recordings take (finished and in progress, actual sizes) and their DVR quota (LIVE-5)."
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DvrUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/dvr/usage:
    get:
      tags: [livetv]
      operationId: listRecordingUsage
      summary: "Admins: every user's DVR usage and quota (LIVE-5), including users with no recordings."
      responses:
        "200":
          description: Usage per user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DvrUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/recordings/{recordingId}:
    parameters:
      - { name: recordingId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [livetv]
      operationId: cancelRecording
      summary: Cancel an upcoming recording, stop one in progress (keeping what was recorded), or remove a finished one from the list. Only whoever scheduled it, or an admin.
      parameters:
        - { name: deleteFile, in: query, schema: { type: boolean }, description: "Finished recordings: delete the file too." }
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/recordings/{recordingId}/stop:
    parameters:
      - { name: recordingId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: stopRecording
      summary: "Stop a recording in progress now. keep true (the default): what was recorded is finalised as a playable file, filed like a finished recording and marked stoppedEarly. keep false: the partial recording is deleted and it leaves the list. Only whoever scheduled it, or an admin (canDelete). Returns once it has stopped."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: boolean, default: true, description: "Keep what was recorded (true) or delete it (false)." }
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "not_recording: it isn't recording now."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /livetv/recording-rules:
    get:
      tags: [livetv]
      operationId: listRecordingRules
      summary: Series being recorded.
      parameters:
        - $ref: "#/components/parameters/RecordingOwner"
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecordingRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/recording-rules/{ruleId}:
    parameters:
      - { name: ruleId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [livetv]
      operationId: deleteRecordingRule
      summary: Stop recording a series. Its upcoming airings are dropped; recordings already made stay. Only whoever made it, or an admin.
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/channels:
    get:
      tags: [livetv]
      operationId: listLiveChannels
      summary: Channels in number order, with what's on now and next.
      parameters:
        - { name: group, in: query, schema: { type: string }, description: Only this group (category). }
        - { name: favorites, in: query, schema: { type: boolean }, description: Only the caller's favourites. }
        - { name: recent, in: query, schema: { type: boolean }, description: "The channels the caller watched last, newest first (LIVE-4)." }
        - { name: hidden, in: query, schema: { type: boolean }, description: Only the channels the caller hid (otherwise they're left out). }
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LiveChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/groups:
    get:
      tags: [livetv]
      operationId: listLiveGroups
      summary: Channel groups (categories) with their channel counts.
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, channels]
                  properties:
                    name: { type: string }
                    channels: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/guide:
    get:
      tags: [livetv]
      operationId: liveGuide
      summary: The guide grid - programmes per channel between two times (at most 24 hours).
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: group, in: query, schema: { type: string } }
        - { name: favorites, in: query, schema: { type: boolean } }
        - { name: recent, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Rows, one per channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [channelId, programmes]
                  properties:
                    channelId: { type: integer, format: int64 }
                    programmes:
                      type: array
                      items: { $ref: "#/components/schemas/LiveProgramme" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/channels/{channelId}/hidden:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: hideLiveChannel
      summary: Hide a channel from the caller's guide (LIVE-4).
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: unhideLiveChannel
      summary: Show a hidden channel again.
      responses:
        "204": { description: Shown. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/channels/{channelId}/favorite:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: favoriteLiveChannel
      summary: Add a channel to the caller's favourites.
      responses:
        "204": { description: Added. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: unfavoriteLiveChannel
      summary: Remove a channel from the caller's favourites.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/channels/{channelId}/logo:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [livetv]
      operationId: liveChannelLogo
      summary: The channel's logo, fetched from its source and cached (no sign-in needed, like artwork).
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/channels/{channelId}/play:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: playLiveChannel
      summary: Start watching a channel. Returns a live HLS session (copied or transcoded for the device).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: "#/components/schemas/DeviceProfile" }
                maxBitrateKbps: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "no_tuner: every connection the channel's source allows (maxStreams) is in use by recordings or other viewers; message says by what, e.g. \"All connections are in use: recording Gold Rush\". A channel being recorded, or already watched, stays watchable: it shares that connection."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [livetv]
      operationId: stopLiveSession
      summary: Stop watching (the stream also stops by itself when nothing fetches it for a minute).
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/refresh:
    post:
      tags: [livetv]
      operationId: refreshLiveTv
      summary: Reload channels and the guide from every source now (admin only).
      responses:
        "200":
          description: What each source returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveTvStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/status:
    get:
      tags: [livetv]
      operationId: vodStatus
      summary: "Movies on demand (LIVE-6): whether they're turned on and usable by the caller, and how each source loaded."
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/vod/categories:
    get:
      tags: [livetv]
      operationId: listVodCategories
      summary: The sources' categories (e.g. "'80s Movies") with how many films the caller may see in each.
      responses:
        "200":
          description: Categories by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/movies:
    get:
      tags: [livetv]
      operationId: listVodMovies
      summary: Films on demand, a page at a time.
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, description: Part of the title., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year, rating], default: title } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: genre, in: query, description: "One genre (TMDB's once matched, else the source's); see the genres endpoint.", schema: { type: string } }
        - { name: yearFrom, in: query, description: "Released in or after this year (items without a year are left out).", schema: { type: integer } }
        - { name: yearTo, in: query, description: "Released in or before this year (a decade: yearFrom=1980&yearTo=1989).", schema: { type: integer } }
        - { name: minRating, in: query, description: "Average vote out of 10 at least this (unrated items are left out).", schema: { type: number, minimum: 0, maximum: 10 } }
        - { name: watched, in: query, description: "The caller's state: unwatched (never started), inProgress (started, not finished) or watched.", schema: { type: string, enum: [unwatched, inProgress, watched] } }
        - { name: sourceId, in: query, description: "Only this source's (VodStatus.sources[].id).", schema: { type: string } }
        - { name: inLibrary, in: query, description: "true = only titles the library already has (in a library the caller can see); false = only those it doesn't. Omitted = any.", schema: { type: boolean } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of films.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodMoviePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/suggestions:
    get:
      tags: [livetv]
      operationId: vodSuggestions
      summary: "Recommended for you: films and series on demand picked for the caller from their taste (favourites, ratings and what they watched), best first, leaving out titles their libraries have, ones they've started or watched and ones they said they're not interested in."
      parameters:
        - { name: kind, in: query, description: Only films or only series (omitted = both)., schema: { type: string, enum: [movie, series] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/recommendations:
    get:
      tags: [livetv]
      operationId: vodRecommendations
      summary: "The recommendations page: rows of films or series on demand for the caller, each with its own angle (top picks, Because you love …, more of a favourite genre, critically acclaimed, popular on VOD), all from the caller's own taste: other people's viewing is never used. A title shows in one row only; rows that can't be filled aren't sent. The same exclusions as suggestions apply."
      parameters:
        - { name: kind, in: query, description: Only films or only series (omitted = both)., schema: { type: string, enum: [movie, series] } }
        - { name: perRow, in: query, description: Titles per row at most., schema: { type: integer, minimum: 4, maximum: 60, default: 30 } }
      responses:
        "200":
          description: Rows (empty when suggestions aren't set up).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodRecommendationRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/suggestions/{kind}/{vodId}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, series] } }
      - { name: vodId, in: path, required: true, description: The film's or series' id., schema: { type: integer, format: int64 } }
    delete:
      tags: [livetv]
      operationId: hideVodSuggestion
      summary: "Not interested: stops suggesting this film or series to the caller (anywhere suggestions show)."
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/continue:
    get:
      tags: [livetv]
      operationId: vodContinueWatching
      summary: Films the caller stopped part-way through, most recent first.
      responses:
        "200":
          description: Films.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodMovie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/movies/{movieId}:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [livetv]
      operationId: getVodMovie
      summary: A film's details (TMDB's once matched, else the source's).
      responses:
        "200":
          description: The film.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodMovieDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/movies/{movieId}/image:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: kind, in: query, schema: { type: string, enum: [poster, backdrop], default: poster } }
    get:
      tags: [livetv]
      operationId: vodMovieImage
      summary: A film's poster or backdrop, fetched once and cached (no sign-in needed, like artwork).
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/movies/{movieId}/watched:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: markVodWatched
      summary: Mark a film watched (clears its resume point).
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: markVodUnwatched
      summary: Mark a film unwatched (clears its resume point).
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/movies/{movieId}/watchlist:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: addVodMovieToWatchlist
      summary: "Put a film on demand on your watchlist (USER-8). It's in the Your Watchlist Home row's mixedEntries (and its See all) with the library's titles, most recently added first. Like a library movie, it leaves the row once watched."
      responses:
        "204": { description: Added (or already there). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: removeVodMovieFromWatchlist
      summary: Take a film on demand off your watchlist.
      responses:
        "204": { description: Removed (or wasn't there). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/movies/{movieId}/play:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: playVodMovie
      summary: "Start watching a film. Returns a seekable HLS session: an M3U source's own HLS passed through, or (Xtream Codes sources, whose films are files) the file made into HLS by the server, video copied when the device plays it and audio converted when needed."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  allOf:
                    - $ref: "#/components/schemas/DeviceProfile"
                  description: "What the device plays (Xtream Codes films). Without it, H.264 video and AAC/MP3 audio are copied and anything else is converted to them."
                maxBitrateKbps: { type: integer, minimum: 0, description: "The app's quality setting; 0/omitted = original (home) or automatic (remote)." }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [livetv]
      operationId: reportVodPlayback
      summary: Report the position, so the film resumes there (and counts as watched near the end).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionMs]
              properties:
                positionMs: { type: integer, format: int64, minimum: 0 }
                durationMs: { type: integer, format: int64, minimum: 0, description: The film's length as the player sees it. }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: stopVodSession
      summary: Stop watching (idle sessions also end by themselves).
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /livetv/vod/series:
    get:
      tags: [livetv]
      operationId: listVodSeries
      summary: TV series on demand (Xtream Codes sources), a page at a time.
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, description: Part of the title., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year, rating], default: title } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: genre, in: query, description: "One genre (TMDB's once matched, else the source's); see the genres endpoint.", schema: { type: string } }
        - { name: yearFrom, in: query, description: "Released in or after this year (items without a year are left out).", schema: { type: integer } }
        - { name: yearTo, in: query, description: "Released in or before this year (a decade: yearFrom=1980&yearTo=1989).", schema: { type: integer } }
        - { name: minRating, in: query, description: "Average vote out of 10 at least this (unrated items are left out).", schema: { type: number, minimum: 0, maximum: 10 } }
        - { name: watched, in: query, description: "The caller's state: unwatched (has episodes not yet watched, including never-opened series), inProgress (started but not every episode watched) or watched (every episode watched).", schema: { type: string, enum: [unwatched, inProgress, watched] } }
        - { name: sourceId, in: query, description: "Only this source's (VodStatus.sources[].id).", schema: { type: string } }
        - { name: inLibrary, in: query, description: "true = only titles the library already has (in a library the caller can see); false = only those it doesn't. Omitted = any.", schema: { type: boolean } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSeriesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/series/categories:
    get:
      tags: [livetv]
      operationId: listVodSeriesCategories
      summary: The sources' series categories with how many series the caller may see in each.
      responses:
        "200":
          description: Categories by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/genres:
    get:
      tags: [livetv]
      operationId: listVodGenres
      summary: The films' genres with how many films the caller may see in each (for the genre filter).
      responses:
        "200":
          description: Genres by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/series/genres:
    get:
      tags: [livetv]
      operationId: listVodSeriesGenres
      summary: The series' genres with how many series the caller may see in each (for the genre filter).
      responses:
        "200":
          description: Genres by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/series/continue:
    get:
      tags: [livetv]
      operationId: vodSeriesContinueWatching
      summary: "Series the caller is watching, most recent first, each with nextEpisode set: the episode they're part-way through, else the next unwatched one. Finished series are left out."
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/follows:
    get:
      tags: [livetv]
      operationId: listVodFollows
      summary: "Followed series on demand: new episodes are saved to the library automatically. The caller's own follows; admins see everyone's (all=true)."
      parameters:
        - { name: all, in: query, description: "Admins: everyone's follows.", schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VodFollow" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/series/{seriesId}/follow:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: followVodSeries
      summary: "Follow a series on demand (or change a follow): its new episodes are saved to the library through the download queue as they appear, within the follow's size limit and the caller's DVR quota (saved episodes count towards it like recordings). Needs following turned on (VodSaveSettings.followEnabled), a shows folder, on-demand access and the may-record permission (admins always may). 409 when following is off."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VodFollowRequest" }
      responses:
        "200":
          description: Following.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodFollow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [livetv]
      operationId: unfollowVodSeries
      summary: "Stop following (episodes already saved stay in the library). Admins may remove anyone's follow with userId."
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Not followed any more. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/series/{seriesId}:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: refresh, in: query, description: "Fetch the episodes from the source now, even if they were fetched recently.", schema: { type: boolean, default: false } }
    get:
      tags: [livetv]
      operationId: getVodSeries
      summary: "A series with its seasons and episodes (and the caller's progress in each). Episodes are fetched from the source the first time a series is opened and again once 12 hours old, so this can take a few seconds."
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/series/{seriesId}/image:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: kind, in: query, schema: { type: string, enum: [poster, backdrop], default: poster } }
      - { name: season, in: query, description: "A season's poster instead of the series' (kind is ignored).", schema: { type: integer } }
    get:
      tags: [livetv]
      operationId: vodSeriesImage
      summary: A series' (or season's) poster or backdrop, fetched once and cached (no sign-in needed, like artwork).
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/series/{seriesId}/watchlist:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: addVodSeriesToWatchlist
      summary: "Put a series on demand on your watchlist (USER-8). It's in the Your Watchlist Home row's mixedEntries (and its See all) with the library's titles, most recently added first."
      responses:
        "204": { description: Added (or already there). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: removeVodSeriesFromWatchlist
      summary: Take a series on demand off your watchlist.
      responses:
        "204": { description: Removed (or wasn't there). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/series/{seriesId}/watched:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: season, in: query, description: Only this season's episodes., schema: { type: integer } }
    put:
      tags: [livetv]
      operationId: markVodSeriesWatched
      summary: Mark every episode of a series (or of one season) watched.
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: markVodSeriesUnwatched
      summary: Mark every episode of a series (or of one season) unwatched, forgetting resume points.
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/episodes/{episodeId}/image:
    parameters:
      - { name: episodeId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [livetv]
      operationId: vodEpisodeImage
      summary: An episode's still, fetched once and cached (no sign-in needed, like artwork).
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/episodes/{episodeId}/watched:
    parameters:
      - { name: episodeId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [livetv]
      operationId: markVodEpisodeWatched
      summary: Mark an episode watched (clears its resume point).
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [livetv]
      operationId: markVodEpisodeUnwatched
      summary: Mark an episode unwatched (forgets its resume point).
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/episodes/{episodeId}/next:
    parameters:
      - { name: episodeId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [livetv]
      operationId: vodNextEpisode
      summary: "The episode after this one in viewing order (seasons in turn, specials last), for autoplay at the end of an episode; no episode when this is the last."
      responses:
        "200":
          description: The next episode, if any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodUpNext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /livetv/vod/episodes/{episodeId}/play:
    parameters:
      - { name: episodeId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: playVodEpisode
      summary: "Start watching an episode: the file made into seekable HLS by the server, as for Xtream Codes films. The session's movieId is 0 and episodeId is set; report progress and stop with the film session endpoints (/livetv/vod/sessions/{sessionId})."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  allOf:
                    - $ref: "#/components/schemas/DeviceProfile"
                  description: "What the device plays. Without it, H.264 video and AAC/MP3 audio are copied and anything else is converted to them."
                maxBitrateKbps: { type: integer, minimum: 0, description: "The app's quality setting; 0/omitted = original (home) or automatic (remote)." }
                startMs: { type: integer, format: int64, minimum: 0, description: "Where to start; omitted = the caller's resume point (0 = from the beginning)." }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/sources/test:
    post:
      tags: [livetv]
      operationId: testVodSource
      summary: "Check a movie source before saving it (admin only): an M3U playlist's film count, or an Xtream Codes account's status and film count. Without a password, a saved source's (same id) is used."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VodSource" }
      responses:
        "200":
          description: Reachable or not.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  movies: { type: integer, description: Films the source lists. }
                  categories: { type: integer, description: Categories (Xtream Codes). }
                  series: { type: integer, description: "Series the server lists (Xtream Codes; absent when it didn't list them)." }
                  account: { type: string, description: "The account's status as the server reports it, e.g. Active (Xtream Codes)." }
                  expiresAt: { type: string, format: date-time, description: "When the account expires, if it does (Xtream Codes)." }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/refresh:
    post:
      tags: [livetv]
      operationId: refreshVod
      summary: Reload every movie source now and retry TMDB matching for films that didn't match (admin only). Matching continues in the background.
      responses:
        "200":
          description: What each source returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /livetv/vod/movies/{movieId}/save:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: saveVodMovie
      summary: "Save a film into the library (admin only; Xtream Codes sources). Queued, downloaded, converted per Settings → vodSave, verified, moved into vodSave.moviesFolder and scanned. A film already queued or saved isn't queued again. One the library already has (VodMovieDetail.library) is refused with 409: in_library when the library's copy is as good or better, upgrade_available when this copy is better and upgrade wasn't set. With upgrade, a better copy replaces the library's: saved into the same folder, the old file(s) moved to the media trash, the item (and its watch history) kept."
      parameters:
        - { name: upgrade, in: query, description: "Replace the library's copy when this one is better (VodLibraryMatch.verdict better).", schema: { type: boolean, default: false } }
        - { name: destination, in: query, description: "A save folder from vodSave.destinations (its id); omitted = the default movies folder. Films use destinations of kind movies or both. A wrong kind or an unknown id is 400. An upgrade always replaces the library's copy in its current folder, whatever the destination.", schema: { type: string } }
      responses:
        "200":
          description: What was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/episodes/{episodeId}/save:
    parameters:
      - { name: episodeId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: saveVodEpisode
      summary: "Save one episode into the library (admin only), into vodSave.showsFolder: {Show (Year)}/Season N/{Show} - SxxEyy - {Title} WEBDL-1080p.ext. Like a film: 409 in_library or upgrade_available when the library has it; upgrade replaces the library's copy when this one is better."
      parameters:
        - { name: upgrade, in: query, description: "Replace the library's copy when this one is better.", schema: { type: boolean, default: false } }
        - { name: destination, in: query, description: "A save folder from vodSave.destinations (its id); omitted = the default shows folder. Episodes use destinations of kind shows or both. A wrong kind or an unknown id is 400. An upgrade always replaces the library's copy in its current folder, whatever the destination.", schema: { type: string } }
      responses:
        "200":
          description: What was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/series/{seriesId}/save:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: season, in: query, description: Only this season's episodes., schema: { type: integer } }
    post:
      tags: [livetv]
      operationId: saveVodSeries
      summary: "Save a whole series, or one season, into the library (admin only). The episodes are fetched from the source first when they haven't been; ones already queued or saved are left out. Only episodes the library doesn't have are queued, plus (includeUpgrades) those better than the library's copies, which they replace; the rest count as skipped."
      parameters:
        - { name: includeUpgrades, in: query, description: "Also queue episodes better than the library's copies, replacing them.", schema: { type: boolean, default: false } }
        - { name: destination, in: query, description: "A save folder from vodSave.destinations (its id); omitted = the default shows folder. Seasons and shows use destinations of kind shows or both. A wrong kind or an unknown id is 400. An upgrade always replaces the library's copy in its current folder, whatever the destination.", schema: { type: string } }
      responses:
        "200":
          description: What was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves:
    get:
      tags: [livetv]
      operationId: listVodSaves
      summary: "The save queue (admin only): unfinished saves in the order they run, then finished ones, newest first, with live progress, speed and ETA. Poll while active is true."
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VodSaveQueue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/clear:
    post:
      tags: [livetv]
      operationId: clearVodSaves
      summary: "Remove finished saves (done, cancelled, skipped) from the list, or with failed=true the failed ones (their partial files are deleted). Admin only. Failed saves are never removed automatically."
      parameters:
        - name: failed
          in: query
          description: "Clear the failed saves instead of the finished ones."
          schema: { type: boolean }
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/pause:
    post:
      tags: [livetv]
      operationId: pauseVodSaves
      summary: "Pause the whole queue (admin only). Running saves stop and keep their partial files; resuming continues them with Range requests."
      responses:
        "204": { description: Paused. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/resume:
    post:
      tags: [livetv]
      operationId: resumeVodSaves
      summary: Resume the whole queue (admin only).
      responses:
        "204": { description: Resumed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/{saveId}:
    parameters:
      - { name: saveId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [livetv]
      operationId: cancelVodSave
      summary: Cancel a save (admin only); its partial files are deleted.
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/{saveId}/retry:
    parameters:
      - { name: saveId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: retryVodSave
      summary: "Queue a failed or cancelled save again (admin only); a failed one continues from what it downloaded."
      responses:
        "204": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/{saveId}/top:
    parameters:
      - { name: saveId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: moveVodSaveToTop
      summary: Make a waiting save the next to run (admin only).
      responses:
        "204": { description: Moved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/{saveId}/pause:
    parameters:
      - { name: saveId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: pauseVodSave
      summary: Pause one save (admin only); it keeps what it downloaded.
      responses:
        "204": { description: Paused. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /livetv/vod/saves/{saveId}/resume:
    parameters:
      - { name: saveId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [livetv]
      operationId: resumeVodSave
      summary: Resume a paused save (admin only); it continues from where it stopped.
      responses:
        "204": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/status:
    get:
      tags: [requests]
      operationId: requestsStatus
      summary: Whether requests are set up and whether the caller may make them.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /requests/search:
    get:
      tags: [requests]
      operationId: searchRequestable
      summary: Search movies and shows on Seerr, marked with what's in the library or already requested.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/discover:
    get:
      tags: [requests]
      operationId: discoverRequestable
      summary: "Trending, popular and upcoming titles from Seerr (REQ-2), optionally by network, studio or genre, in an order. A network means shows; a studio means films."
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [trending, movies, tv, upcoming, upcoming_tv], default: trending }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: network, in: query, schema: { type: integer, format: int64 }, description: "A TV network (from /requests/discover/filters)." }
        - { name: studio, in: query, schema: { type: integer, format: int64 }, description: A film studio. }
        - { name: genre, in: query, schema: { type: integer, format: int64 }, description: A movie or TV genre (matching the category). }
        - { name: sort, in: query, schema: { type: string, enum: [popular, rating, newest, title], default: popular }, description: For movies and tv. }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/discover/filters:
    get:
      tags: [requests]
      operationId: discoverFilters
      summary: "Discover's filters: TV networks, film studios and movie and TV genres."
      responses:
        "200":
          description: Filters.
          content:
            application/json:
              schema:
                type: object
                required: [networks, studios, movieGenres, tvGenres]
                properties:
                  networks: { type: array, items: { $ref: "#/components/schemas/NamedId" } }
                  studios: { type: array, items: { $ref: "#/components/schemas/NamedId" } }
                  movieGenres: { type: array, items: { $ref: "#/components/schemas/NamedId" } }
                  tvGenres: { type: array, items: { $ref: "#/components/schemas/NamedId" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/tv/{tmdbId}:
    parameters:
      - { name: tmdbId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [requests]
      operationId: requestableShow
      summary: A show's seasons and which are available or requested, for choosing what to request.
      responses:
        "200":
          description: The show.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestableShow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/ratings/{mediaType}/{tmdbId}:
    parameters:
      - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
      - { name: tmdbId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [requests]
      operationId: titleRatings
      summary: "A title's Rotten Tomatoes and IMDb ratings, for Discover's details (REQ-2). Empty when there are none."
      responses:
        "200":
          description: Ratings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleRatings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Requests, newest first. Users see their own; admins can ask for everyone's.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, all], default: mine }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RequestState" }
      responses:
        "200":
          description: Requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [requests]
      operationId: createRequest
      summary: Ask for a movie or show. It waits for an admin's approval, then goes to Seerr.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaRequestCreate" }
      responses:
        "201":
          description: Requested (pending approval).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [requests]
      operationId: cancelRequest
      summary: Withdraw a pending request (its owner or an admin).
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/approve:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [requests]
      operationId: approveRequest
      summary: Approve a pending request and send it to Seerr (admin only).
      responses:
        "200":
          description: Approved and sent, or failed (status says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/decline:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [requests]
      operationId: declineRequest
      summary: Decline a pending request (admin only).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/seerr/users:
    get:
      tags: [requests]
      operationId: listSeerrUsers
      summary: Seerr's users, for linking Marquee users to them (admin only).
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, displayName]
                  properties:
                    id: { type: integer, format: int64 }
                    displayName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /requests/seerr/test:
    post:
      tags: [requests]
      operationId: testSeerr
      summary: Check a Seerr URL and API key (admin only). Without an apiKey, the saved key is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                apiKey: { type: string }
      responses:
        "200":
          description: Reachable or not.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stats:
    get:
      tags: [activity]
      operationId: getStats
      summary: Playback statistics (ADM-4). Administrators can see everyone or one user; others see their own (their "year in music").
      parameters:
        - name: days
          in: query
          description: The last N days; 0 means all time.
          schema: { type: integer, minimum: 0, maximum: 3650, default: 30 }
        - name: userId
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          description: Entries per top list.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/speedtest:
    post:
      tags: [system]
      operationId: runSpeedTest
      summary: "Measure the server's internet download and upload speed against Cloudflare's public speed test (admin only; takes about 20 s). Use the upload result for Remote access's upload speed."
      responses:
        "200":
          description: Measured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeedTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /system/storage:
    get:
      tags: [system]
      operationId: storageReport
      summary: "Storage overview (admin only): space used per library, the biggest titles, how each library grew (one sample a day, up to a year) and the free space on the volumes Marquee uses."
      parameters:
        - { name: days, in: query, description: "How far back the growth history goes.", schema: { type: integer, minimum: 7, maximum: 365, default: 90 } }
        - { name: top, in: query, description: "How many of the biggest titles.", schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/status:
    get:
      tags: [system]
      operationId: systemStatus
      summary: Server health for the dashboard (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /libraries/{libraryId}/filters:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [items]
      operationId: libraryFilters
      summary: Values for the library filter bar, and where each letter starts for the A–Z jump bar (title sort).
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ItemType" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFilters" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /people/{personId}:
    get:
      tags: [items]
      operationId: getPerson
      summary: A person and the items in your libraries they appear in.
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/related:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: relatedItems
      summary: Similar items from the same library ("More like this"), by what they're about (Muse's index, USER-16) when it's ready, else shared genres and people.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/vod-similar:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: itemVodSimilar
      summary: "Also on VOD: films (for a movie) or series (for a show) on demand like this one that the caller's libraries don't have, best first by TMDB's recommendations and the caller's taste. Empty for other types, or when on demand is off or not the caller's to watch."
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VodSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/leaves:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: itemLeaves
      summary: Playable items under a show, season, artist, album or collection, in play order (for Play all / Shuffle). At most 2,000.
      parameters:
        - name: shuffle
          in: query
          schema: { type: boolean }
        - name: unwatched
          in: query
          description: Start from the first unwatched episode (shows and seasons).
          schema: { type: boolean }
        - name: favorites
          in: query
          description: "Only the user's favourite episodes or songs (e.g. a show's favourite episodes, an artist's favourite songs)."
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: Your playlists.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PlaylistKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [playlists]
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /playlists/{playlistId}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [playlists]
      operationId: getPlaylist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                rules: { $ref: "#/components/schemas/SmartRules" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playlists/{playlistId}/items:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [playlists]
      operationId: listPlaylistItems
      parameters:
        - $ref: "#/components/parameters/Offset"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [playlists]
      operationId: addPlaylistItems
      summary: Append items. Shows, seasons, artists and albums add their episodes or tracks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playlists/{playlistId}/items/{entryId}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
      - name: entryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [playlists]
      operationId: movePlaylistItem
      summary: Move an entry to just after another one (or to the top when afterEntryId is absent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                afterEntryId: { type: integer, format: int64 }
      responses:
        "204": { description: Moved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      tags: [system]
      operationId: listTasks
      summary: Scheduled maintenance tasks and their last run (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks/{taskId}:
    patch:
      tags: [system]
      operationId: updateTask
      summary: "Turn a task on or off (admin only). Off: it never runs on its schedule or automatically; Run now still works."
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/run:
    post:
      tags: [system]
      operationId: runTask
      summary: Run a task now (admin only).
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202": { description: Started. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups:
    get:
      tags: [system]
      operationId: listBackups
      summary: Database backups, newest first (admin only).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [system]
      operationId: createBackup
      summary: Back up the database now (admin only).
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backups/{name}:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    get:
      tags: [system]
      operationId: downloadBackup
      summary: Download a backup file (admin only).
      responses:
        "200":
          description: SQLite database file.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [system]
      operationId: deleteBackup
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/{name}/restore:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    post:
      tags: [system]
      operationId: restoreBackup
      summary: Restore a backup (admin only). The server restarts to apply it; the current database is kept as a "pre-restore" backup.
      responses:
        "202": { description: Restoring; the server is restarting. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /system/restart:
    post:
      tags: [system]
      operationId: restartServer
      summary: Restart the server (admin only). Docker brings it back up.
      responses:
        "202": { description: Restarting. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /music/status:
    get:
      tags: [music]
      operationId: musicStatus
      summary: Soundprint analysis progress and whether the analysis service is running.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/status:
    get:
      tags: [settings]
      operationId: aiStatus
      summary: "AI (Ollama) status (admin only): reachable, installed and loaded models, the last error and indexing progress."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ai/test:
    post:
      tags: [settings]
      operationId: testAi
      summary: Check an Ollama address and models before saving (admin only). Omitted fields use the saved settings. Loads no model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                chatModel: { type: string }
                embedModel: { type: string }
      responses:
        "200":
          description: Reachable or not (see error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ai/lyrics/rebuild:
    post:
      tags: [settings]
      operationId: rebuildLyricIndex
      summary: Forget the lyric theme index and build it again in the background (admin only).
      responses:
        "202": { description: Started. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recommendations/reasons:
    post:
      tags: [items]
      operationId: recommendationReasons
      summary: "One-line \"why this\" for up to 5 recommended movies or shows (AI, cached per person and item). Empty when AI is off or unavailable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, maxItems: 5, items: { type: integer, format: int64 } }
      responses:
        "200":
          description: Reasons for the items that have one.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecommendationReason" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items/{itemId}/sounds-like:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [music]
      operationId: soundsLike
      summary: Sounds like this (MUSIC-2) — tracks, albums or artists (matching the item's type) that sound like it.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /music/radio:
    post:
      tags: [music]
      operationId: musicRadio
      summary: A station (MUSIC-3) from a track, album or artist, a genre, a decade, a mood, your favourites or the whole library. Ask again with exclude to continue it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /music/muse:
    post:
      tags: [music]
      operationId: musicMuse
      summary: A playlist from a description, e.g. "rainy Sunday jazz with a late-night feel" (MUSIC-5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 2, maxLength: 300 }
                limit: { type: integer, minimum: 5, maximum: 100, default: 30 }
                libraryId: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /music/journey:
    post:
      tags: [music]
      operationId: musicJourney
      summary: Sound Journey (MUSIC-4) — a path from one track to another through tracks that sound in between.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromId, toId]
              properties:
                fromId: { type: integer, format: int64 }
                toId: { type: integer, format: int64 }
                length: { type: integer, minimum: 3, maximum: 60, default: 15 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /music/dj:
    post:
      tags: [music]
      operationId: musicDJ
      summary: DJ (MUSIC-6) — one track to weave in after the one playing.
      description: "wander: sounds like it, by another artist. superfan: the artist's other albums. deep_cuts: the artist's least-played tracks. same_era: a similar sound from the same years."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, mode]
              properties:
                trackId: { type: integer, format: int64 }
                mode: { type: string, enum: [wander, superfan, deep_cuts, same_era] }
                exclude:
                  type: array
                  description: Tracks already queued.
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /music/mixes:
    get:
      tags: [music]
      operationId: musicMixes
      summary: Your daily mixes (MUSIC-7), built from your listening; they change once a day.
      description: "Also a Favourites mix (id favorites): your favourite songs (the heart) shuffled, first in the list when you have at least three. It needs no Soundprint analysis, so it's there even when the daily mixes aren't."
      parameters:
        - name: libraryId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items/{itemId}/rating:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: rateItem
      summary: Your rating (MUSIC-11), 0–10 (half stars; 10 = loved), or null to clear it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: number, minimum: 0, maximum: 10, nullable: true }
                at: { type: string, format: date-time, description: "When the change was made (apps send changes made offline later); an older change than the last one is ignored." }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/reviews:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: itemReviews
      summary: "The community rating and everyone's ratings and comments for an item (USER-17)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemReviews" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [items]
      operationId: setReview
      summary: "Your comment on an item, shown with your rating to everyone who can see it. An empty comment removes it (your rating stays; set that with PUT /items/{itemId}/rating)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 2000 }
                at: { type: string, format: date-time, description: "When the change was made; an older change than the last one is ignored." }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/reviews/{userId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [items]
      operationId: deleteReview
      summary: Remove a comment (your own, or anyone's for admins). Ratings aren't touched.
      parameters:
        - $ref: "#/components/parameters/ChangedAt"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/trickplay:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [playback]
      operationId: getTrickplay
      summary: Seek-bar preview thumbnails for a video (PLAY-13), as sprite sheets of columns × rows tiles.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trickplay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/trickplay/{sheet}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: sheet
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
    get:
      tags: [playback]
      operationId: getTrickplaySheet
      summary: One sprite sheet; thumbnail n is on sheet n / (columns × rows).
      responses:
        "200":
          description: Image.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [music]
      operationId: getLyrics
      summary: A track's lyrics (MUSIC-10), timed when available, from the file, a .lrc sidecar or LRCLIB.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lyrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /filesystem/browse:
    get:
      tags: [filesystem]
      operationId: browseFilesystem
      summary: List directories under the configured browse roots, for the library folder picker (admin only).
      parameters:
        - name: path
          in: query
          required: false
          description: Directory to list. Omit to list the browse roots.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    RecordingOwner:
      name: owner
      in: query
      description: "all (default) = every recording or series the caller may see; me = only the ones the caller scheduled."
      schema: { type: string, enum: [me, all], default: all }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChangedAt:
      name: at
      in: query
      description: "When the change was made (USER-18). Apps send changes made offline when they reconnect; a change older than the last one for this item is ignored."
      schema: { type: string, format: date-time }
    ImageWidth:
      name: w
      in: query
      description: Desired width in pixels; rounded up to 120, 240, 360, 480, 720, 960, 1280 or 1920.
      schema: { type: integer, minimum: 1, maximum: 3840 }
    Sort:
      name: sort
      in: query
      description: Sort order. Prefix with "-" for descending.
      schema:
        type: string
        enum: [title, -title, added, -added, year, -year, released, -released, rating, -rating, duration, -duration, -viewed, random, myRating, -myRating, favorited, -favorited]
        default: title
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BackupName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]+\\.db$" }
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed for this user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A helper service isn't running.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: An outside service (e.g. OpenSubtitles) failed or refused the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }

    NetworkClass:
      type: string
      description: How the server classified the caller's connection. Remote includes Tailscale.
      enum: [local, remote]

    SystemInfo:
      type: object
      required: [serverId, serverName, version, apiVersion, setupRequired, networkClass]
      properties:
        serverId: { type: string, description: Stable unique server identifier. }
        serverName: { type: string }
        version: { type: string }
        apiVersion: { type: string, example: "1" }
        setupRequired: { type: boolean }
        networkClass: { $ref: "#/components/schemas/NetworkClass" }
        pinSignIn: { type: boolean, description: The sign-in screen should offer the profile picker with PINs from this network. }
        lanUrl: { type: string, description: "The server's home-network address (Settings → Network), so apps reached over Tailscale learn it." }
        remoteUrl: { type: string, description: "The Tailscale address (Settings → Remote Access), so apps on the LAN learn where to go when away." }
        ratingPrompt: { type: boolean, description: "The admin turned on rating requests when a movie or episode ends (USER-19); apps still honour the person's ratingPrompt preference." }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded, error] }
        checks:
          type: object
          additionalProperties: { type: string }

    DeviceInfo:
      type: object
      required: [clientId, name, platform]
      properties:
        clientId: { type: string, description: Stable per-install identifier generated by the client. }
        name: { type: string, example: Living Room Apple TV }
        platform: { type: string, enum: [web, ios, ipados, tvos, android, androidtv, other] }
        product: { type: string, example: Marquee for tvOS }
        version: { type: string }

    SetupRequest:
      type: object
      required: [serverName, username, password, device]
      properties:
        serverName: { type: string, minLength: 1, maxLength: 64 }
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string }
        totpCode: { type: string, description: "The authenticator code (or a recovery code) when the account has two-factor sign-in." }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, username, displayName, isAdmin, isManaged, createdAt, restrictions, preferences]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, description: "For password and PIN reset links and, for administrators, alerts. Only in /me and the admin's user list; absent when none." }
        isAdmin: { type: boolean }
        isManaged: { type: boolean, description: Managed profiles (e.g. children) sign in only by switching profile with a PIN. }
        hasPin: { type: boolean }
        hasPassword: { type: boolean }
        hasTwoFactor: { type: boolean, description: Two-factor sign-in (an authenticator code) is on. }
        imageKey: { type: string, description: "Only from /me: use as ?key= on image, person photo and avatar URLs instead of the sign-in token (D85). It grants those images and nothing else." }
        avatarUrl: { type: string, description: Profile picture URL; absent when the user has none. }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        restrictions: { $ref: "#/components/schemas/UserRestrictions" }
        preferences: { $ref: "#/components/schemas/UserPreferences" }

    UserRestrictions:
      type: object
      properties:
        libraryIds:
          type: array
          nullable: true
          description: Libraries this user can see. Null or absent = all libraries.
          items: { type: integer, format: int64 }
        maxContentRating:
          type: string
          nullable: true
          description: Highest allowed rating, e.g. PG-13 or TV-14. Unrated items are hidden when set.
          enum: [G, PG, PG-13, R, NC-17, TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA, null]
        allowRemote: { type: boolean, description: May stream from outside the home network. Default true. }
        remoteQualityKbps: { type: integer, minimum: 0, description: Cap for remote streams. 0 = server default. }
        canRequest: { type: boolean, description: "May request titles through Seerr (REQ-1). Default false; admins always may." }
        canRecord: { type: boolean, description: "Deprecated: the same as canRecordDVR (kept for older clients). Read only when canRecordDVR isn't sent." }
        canRecordDVR: { type: boolean, description: "May schedule Live TV recordings (LIVE-5). Default true; admins always may. A user who may not has their series paused." }
        canViewDVR: { type: boolean, description: "May see and play the household's Live TV recordings (the DVR list and the recordings libraries). Default true; admins always may." }
        dvrQuotaGb: { type: integer, minimum: 0, nullable: true, description: "This user's DVR quota in GB (10^9 bytes). Null or absent = the server default (integrations.dvrDefaultQuotaGb) for everyone but admins, who then have no limit; 0 = unlimited. An admin's own quota applies to them like anyone's. Admins may set it for anyone, admins and themselves included." }
        liveTv: { type: boolean, description: "May watch Live TV (LIVE-4). Default true." }
        liveTvGroups:
          type: array
          nullable: true
          deprecated: true
          description: "Deprecated and ignored: channel groups no longer limit anyone (everyone who may watch Live TV sees every group). The server ignores it when written and never returns it."
          items: { type: string }
        seerrUserId: { type: integer, format: int64, nullable: true, description: The Seerr user requests are made as. Null = Seerr's API key owner. }
        friend: { type: boolean, description: "Joined through an invite (USER-13): signs in with their own password, and isn't listed on this server's profile picker." }
        dailyLimitMinutes: { type: integer, minimum: 0, maximum: 1440, nullable: true, description: "Time limit: minutes of video (movies, episodes, on demand, Live TV; not music) a day, counted on the server's clock and reset at midnight. Null or 0 = no limit. Not for admins." }
        weekendLimitMinutes: { type: integer, minimum: 0, maximum: 1440, nullable: true, description: "Time limit on Saturdays and Sundays instead of dailyLimitMinutes. Null = the same as dailyLimitMinutes; 0 = no limit at weekends." }
        allowedFrom: { type: string, nullable: true, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Viewing hours: video may only play from this time (HH:MM, server time) until allowedUntil; a window may cross midnight. Both null = any time." }
        allowedUntil: { type: string, nullable: true, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "End of the viewing hours (HH:MM)." }

    UserPreferences:
      type: object
      properties:
        audioLanguage: { type: string, description: "ISO 639-2, e.g. eng, jpn" }
        subtitleLanguage: { type: string }
        subtitleMode: { type: string, enum: [off, forced, foreign, always] }
        localQualityKbps: { type: integer, minimum: 0, description: 0 = original }
        remoteQualityKbps: { type: integer, minimum: 0, description: 0 = automatic }
        cinemaTrailers: { type: boolean, description: "Play trailers before movies when the server has cinema trailers on (PLAY-18). Default true." }
        ratingPrompt: { type: boolean, description: "Ask me to rate a movie or episode when I finish it, if the server has it on (USER-19). Default true." }
        subtitleStyle: { $ref: "#/components/schemas/SubtitleStyle" }
        nightMode: { type: boolean, description: "Night mode (dialogue boost) on by default for this person's video playback; each player can switch it per session. Default false." }

    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
        pin: { type: string, pattern: "^[0-9]{4}$" }
        email: { type: string, maxLength: 254 }
        isAdmin: { type: boolean }
        isManaged: { type: boolean }
        restrictions: { $ref: "#/components/schemas/UserRestrictions" }

    UserUpdate:
      description: Restrictions, when sent, replace the user's restrictions entirely.
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
        pin: { type: string, pattern: "^([0-9]{4})?$", description: Empty string removes the PIN. }
        email: { type: string, maxLength: 254, description: Empty string removes the email address. }
        isAdmin: { type: boolean }
        restrictions: { $ref: "#/components/schemas/UserRestrictions" }

    MeUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 64 }
        currentPassword: { type: string, description: Required to change the password. }
        newPassword: { type: string, minLength: 8, maxLength: 256 }
        pin: { type: string, pattern: "^([0-9]{4})?$" }
        email: { type: string, maxLength: 254, description: "Your email address, for reset links. Empty string removes it." }
        preferences: { $ref: "#/components/schemas/UserPreferences" }

    Profile:
      type: object
      required: [id, displayName, isManaged, requires]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        isManaged: { type: boolean }
        requires: { type: string, enum: [none, pin, password], description: What switching to this profile asks for. }
        avatarUrl: { type: string, description: Profile picture URL; absent when the user has none. }

    PinLoginRequest:
      type: object
      required: [userId, device]
      properties:
        userId: { type: integer, format: int64 }
        pin: { type: string }
        password: { type: string, description: For profiles that have a password but no PIN. }
        totpCode: { type: string, description: "With a password, when the account has two-factor sign-in." }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    SwitchProfileRequest:
      type: object
      required: [device]
      properties:
        pin: { type: string }
        password: { type: string }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    Device:
      type: object
      required: [id, userId, userName, name, platform, lastSeenAt, createdAt, current]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        name: { type: string }
        platform: { type: string }
        product: { type: string }
        version: { type: string }
        lastIp: { type: string }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        current: { type: boolean, description: This is the device making the request. }

    SearchResults:
      type: object
      required: [query, groups]
      properties:
        query: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SearchGroup" }

    SearchGroup:
      type: object
      required: [type, items]
      properties:
        type: { $ref: "#/components/schemas/ItemType" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemSummary" }

    # ---------- Settings ----------
    ServerSettings:
      type: object
      required: [general, network, remoteAccess, transcoder, library, metadata, tasks, security]
      properties:
        security: { $ref: "#/components/schemas/SecuritySettings" }
        general: { $ref: "#/components/schemas/GeneralSettings" }
        network: { $ref: "#/components/schemas/NetworkSettings" }
        remoteAccess: { $ref: "#/components/schemas/RemoteAccessSettings" }
        transcoder: { $ref: "#/components/schemas/TranscoderSettings" }
        library: { $ref: "#/components/schemas/LibraryGlobalSettings" }
        metadata: { $ref: "#/components/schemas/MetadataSettings" }
        tasks: { $ref: "#/components/schemas/TaskSettings" }
        music: { $ref: "#/components/schemas/MusicSettings" }
        integrations: { $ref: "#/components/schemas/IntegrationSettings" }
        cinema: { $ref: "#/components/schemas/CinemaSettings" }
        ai: { $ref: "#/components/schemas/AiSettings" }
        notifications: { $ref: "#/components/schemas/NotificationSettings" }
        vodSave: { $ref: "#/components/schemas/VodSaveSettings" }
        webhooks:
          type: array
          description: Replaces the whole list when sent.
          items: { $ref: "#/components/schemas/Webhook" }

    ServerSettingsUpdate:
      type: object
      properties:
        security: { $ref: "#/components/schemas/SecuritySettings" }
        general: { $ref: "#/components/schemas/GeneralSettings" }
        network: { $ref: "#/components/schemas/NetworkSettings" }
        remoteAccess: { $ref: "#/components/schemas/RemoteAccessSettings" }
        transcoder: { $ref: "#/components/schemas/TranscoderSettings" }
        library: { $ref: "#/components/schemas/LibraryGlobalSettings" }
        metadata: { $ref: "#/components/schemas/MetadataSettingsUpdate" }
        tasks: { $ref: "#/components/schemas/TaskSettings" }
        music: { $ref: "#/components/schemas/MusicSettings" }
        integrations: { $ref: "#/components/schemas/IntegrationSettingsUpdate" }
        cinema: { $ref: "#/components/schemas/CinemaSettings" }
        ai: { $ref: "#/components/schemas/AiSettings" }
        notifications: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
        vodSave: { $ref: "#/components/schemas/VodSaveSettings" }
        webhooks:
          type: array
          description: Replaces the whole list when sent.
          items: { $ref: "#/components/schemas/Webhook" }

    AlertType:
      type: string
      description: |
        task_failed: a scheduled task (including the nightly backup) failed.
        disk_low: the config, transcode, recordings or a library folder's volume is low on space.
        recording_failed: a DVR recording failed.
        source_failed: a Live TV or movies-on-demand source couldn't be loaded.
        integration_down: Seerr, Bazarr, Ollama or the Soundprint sidecar isn't answering (only those that are set up).
        failed_signins: repeated wrong passwords for one account.
        new_admin_device: an administrator signed in from a device never used before.
        playback_failed: the transcoder couldn't produce video for a stream.
        vod_save_failed: saving a film or episode on demand into the library failed.
        vod_save_done: the save queue finished (one summary, not one per episode).
      enum: [task_failed, disk_low, recording_failed, source_failed, integration_down, failed_signins, new_admin_device, playback_failed, vod_save_failed, vod_save_done]

    NotificationSettings:
      type: object
      description: Outgoing email (SMTP) and admin alerts.
      properties:
        smtpHost: { type: string, description: "The mail server, e.g. smtp.example.com. Empty turns email off." }
        smtpPort: { type: integer, minimum: 0, maximum: 65535 }
        smtpSecurity: { type: string, enum: [none, starttls, tls] }
        smtpUsername: { type: string }
        smtpPasswordSet: { type: boolean, readOnly: true }
        fromAddress: { type: string }
        fromName: { type: string }
        mailConfigured: { type: boolean, readOnly: true, description: "Host, port and from address are set." }
        linkUrl: { type: string, description: "Address links in mail start with (e.g. reset links). Empty = the Remote Access URL." }
        alerts:
          type: array
          description: "Alert types that are emailed. Every alert appears in the bell (GET /notifications) whatever is chosen here; only vod_save_failed is emailed by default among these."
          items: { $ref: "#/components/schemas/AlertType" }
        dvrQuotaAlert: { type: boolean, description: "The dvr_quota alert is emailed: a recording wasn't made, or watched recordings went to the media trash, because its owner is over their DVR quota. Not emailed by default. (Not in AlertType, which shipped apps decode strictly; notifications carry type dvr_quota.)" }
        plexSyncAlert: { type: boolean, description: "The plex_sync alert is emailed: two-way Plex sync is failing (Plex rejects the token, or hasn't been reachable for several runs). Not emailed by default. (Not in AlertType; notifications carry type plex_sync.)" }
        optimizeFailedAlert: { type: boolean, description: "The optimize_failed alert is emailed: a Library Health → Large files conversion failed (not one skipped for saving too little). Emailed by default. (Not in AlertType; notifications carry type optimize_failed.)" }
        fileDamagedAlert: { type: boolean, description: "The file_damaged alert is emailed: a newly added file failed its playback check (see Library Health → Unplayable files). Not emailed by default. (Not in AlertType; notifications carry type file_damaged.)" }
        libraryUnreadableAlert: { type: boolean, description: "The library_unreadable alert is emailed: a scan couldn't read one of a library's folders (offline drive, permissions), so its titles were kept as they were. Emailed by default. (Not in AlertType; notifications carry type library_unreadable.)" }
        recipientsAllAdmins: { type: boolean, description: Mail alerts to every administrator with an email address. }
        recipients:
          type: array
          description: Administrators (user ids) who get alert mail when recipientsAllAdmins is off.
          items: { type: integer, format: int64 }
        diskThresholdPercent: { type: integer, minimum: 1, maximum: 50, description: Alert when a volume has less free space than this. }

    NotificationSettingsUpdate:
      type: object
      description: The SMTP password is write-only; send an empty string to clear it.
      properties:
        smtpHost: { type: string }
        smtpPort: { type: integer, minimum: 0, maximum: 65535 }
        smtpSecurity: { type: string, enum: [none, starttls, tls] }
        smtpUsername: { type: string }
        smtpPassword: { type: string }
        fromAddress: { type: string }
        fromName: { type: string }
        linkUrl: { type: string }
        alerts:
          type: array
          description: "Replaces the list; the dvr_quota, plex_sync and optimize_failed alerts are kept as they were unless dvrQuotaAlert, plexSyncAlert or optimizeFailedAlert is sent."
          items: { $ref: "#/components/schemas/AlertType" }
        dvrQuotaAlert: { type: boolean }
        plexSyncAlert: { type: boolean }
        optimizeFailedAlert: { type: boolean }
        libraryUnreadableAlert: { type: boolean }
        fileDamagedAlert: { type: boolean }
        recipientsAllAdmins: { type: boolean }
        recipients:
          type: array
          items: { type: integer, format: int64 }
        diskThresholdPercent: { type: integer, minimum: 1, maximum: 50 }

    AdminNotification:
      type: object
      required: [id, type, title, message, createdAt, read]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, description: "An AlertType." }
        subject: { type: string, description: "What it is about (a task, a volume, a service)." }
        title: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    AdminNotificationList:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminNotification" }
        unread: { type: integer }

    ForgotRequest:
      type: object
      required: [login, kind]
      properties:
        login: { type: string, maxLength: 254, description: Username or email address. }
        kind: { type: string, enum: [password, pin] }

    ResetInfo:
      type: object
      required: [kind, displayName]
      properties:
        kind: { type: string, enum: [password, pin] }
        displayName: { type: string }

    ResetRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 256, description: For a password link. }
        pin: { type: string, pattern: "^[0-9]{4}$", description: For a PIN link. }

    Webhook:
      type: object
      required: [name, url, events, enabled]
      properties:
        id: { type: string, description: Assigned by the server. }
        name: { type: string, maxLength: 100 }
        url: { type: string, format: uri, description: "http(s) URL that receives a JSON POST per event." }
        secret: { type: string, description: "When set, payloads are signed: X-Marquee-Signature: sha256=<HMAC-SHA256 of the body>." }
        events:
          type: array
          items: { type: string, enum: [playback.started, playback.paused, playback.resumed, playback.stopped, playback.watched, library.added, alert] }
        enabled: { type: boolean }

    CinemaSettings:
      type: object
      description: Cinema trailers (PLAY-18) before movies that are started from the beginning.
      properties:
        trailers: { type: integer, minimum: 0, maximum: 5, description: "Trailers of other movies in the library to play first; 0 = off." }
        prerollItemId: { type: integer, format: int64, nullable: true, description: "A video (e.g. a cinema intro) played after the trailers, before the movie." }

    AiSettings:
      type: object
      description: >-
        Optional AI from a local Ollama, for smarter Muse and recommendations. Off by default; with it off,
        or Ollama unreachable, everything works as without it.
      properties:
        enabled: { type: boolean, description: "Use AI (Ollama). Default off." }
        url: { type: string, description: "Ollama's address. Default http://127.0.0.1:11434." }
        chatModel: { type: string, description: "Model that reads prompts, re-ranks and writes reasons. Default qwen3:8b." }
        embedModel: { type: string, description: "Embedding model for movies, shows and lyrics. Default mxbai-embed-large. Changing it re-indexes in the background." }
        unloadMinutes: { type: integer, minimum: 0, maximum: 1440, description: "Sent as keep_alive on every request: Ollama unloads the models after this many idle minutes, freeing the GPU. Default 5." }
        understandPrompts: { type: boolean, description: "Understand Muse prompts (music and movies) with the chat model. Default on." }
        rerankMovies: { type: boolean, description: "Re-rank the top movie Muse results with the chat model. Default on." }
        lyricsThemes: { type: boolean, description: "Index lyrics so music Muse can match themes (\"songs about the sea\"). Default on." }
        reasons: { type: boolean, description: "Write a one-line reason for recommendations. Default on." }
        learnFromBehaviour: { type: boolean, description: "Learn from quick skips, abandoned titles and ratings. Needs no model, so it works with AI off. Default on." }

    AiStatus:
      type: object
      required: [enabled, reachable, models, loaded]
      properties:
        enabled: { type: boolean }
        reachable: { type: boolean, description: Ollama answered. }
        version: { type: string, description: "Ollama's version." }
        models: { type: array, description: Installed models (from /api/tags)., items: { type: string } }
        chatModelInstalled: { type: boolean }
        embedModelInstalled: { type: boolean }
        loaded:
          type: array
          description: Models in memory now (from /api/ps); empty means the GPU is free.
          items: { $ref: "#/components/schemas/AiLoadedModel" }
        paused: { type: boolean, description: "True while Marquee isn't calling Ollama after repeated failures (it retries shortly)." }
        lastError: { type: string }
        lastErrorAt: { type: string, format: date-time }
        error: { type: string, description: "Why the check failed (status and test)." }
        videos: { $ref: "#/components/schemas/AiVideoIndex" }
        lyrics: { $ref: "#/components/schemas/AiLyricIndex" }

    AiLoadedModel:
      type: object
      required: [name]
      properties:
        name: { type: string }
        vramBytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }

    AiVideoIndex:
      type: object
      required: [indexed, total]
      description: Movies and shows embedded for Muse and recommendations.
      properties:
        indexed: { type: integer }
        total: { type: integer }
        model: { type: string, description: "The model the index is from (\"ollama/<model>\" with AI on)." }

    AiLyricIndex:
      type: object
      required: [indexed, withLyrics, tracks, running]
      description: Lyric theme index.
      properties:
        indexed: { type: integer, description: Tracks whose lyrics are indexed with the current model. }
        withLyrics: { type: integer, description: Tracks with lyrics. }
        tracks: { type: integer, description: All tracks. }
        running: { type: boolean }

    RecommendationReason:
      type: object
      required: [itemId, reason]
      properties:
        itemId: { type: integer, format: int64 }
        reason: { type: string }

    MusicSettings:
      type: object
      properties:
        soundprintAnalysis: { type: boolean, description: "Soundprint: analyse how tracks sound (on this server's GPU) for radios, similar music and Muse." }
        onlineLyrics: { type: boolean, description: Look up lyrics on LRCLIB when a track has none (sends artist and title). }
        artistDetails: { type: boolean, description: "Look up artists and albums on MusicBrainz (about one request a second) and artist bios on Wikipedia: styles, solo artist or band, country, active years, album types and labels, for artist pages and Muse." }
        loudnessAnalysis: { type: boolean, deprecated: true, description: "Ignored: volume levelling is always on, so tracks without ReplayGain tags are always measured." }

    SecuritySettings:
      type: object
      properties:
        pinSignIn:
          type: string
          enum: [off, local, everywhere]
          description: Where profiles can sign in with a 4-digit PIN. "local" = home network only (recommended).

    GeneralSettings:
      type: object
      properties:
        serverName: { type: string, minLength: 1, maxLength: 64 }
        metadataLanguage: { type: string, example: en-US }
        ratingPrompt: { type: boolean, description: "Ask people to rate a movie or episode when they finish it (USER-19). Default off." }

    NetworkSettings:
      type: object
      properties:
        lanSubnets:
          type: array
          description: CIDRs treated as the local network. Everything else (including Tailscale) is remote.
          items: { type: string, example: 192.168.1.0/24 }
        lanUrl:
          type: string
          description: Address advertised to local clients.
          example: http://192.168.1.20:32500
        bonjourEnabled: { type: boolean }

    RemoteAccessSettings:
      type: object
      properties:
        enabled: { type: boolean }
        remoteUrl:
          type: string
          description: Address advertised to remote clients (e.g. the Tailscale serve URL).
          example: https://tower.example-tailnet.ts.net
        uploadSpeedKbps:
          type: integer
          minimum: 0
          description: Server's internet upload speed. Divided fairly across remote streams. 0 = unknown.
        totalRemoteLimitKbps: { type: integer, minimum: 0, description: 0 = unlimited. }
        perStreamRemoteLimitKbps: { type: integer, minimum: 0, description: 0 = unlimited. }
        minStreamKbps: { type: integer, minimum: 0, description: Floor when sharing the upload budget. }

    EncoderKind:
      type: string
      enum: [nvenc, qsv, vaapi, software]

    QualityRung:
      type: object
      required: [label, maxHeight, videoKbps]
      properties:
        label: { type: string, example: 1080p 8 Mbps }
        maxHeight: { type: integer, example: 1080 }
        videoKbps: { type: integer, example: 8000 }

    TranscoderSettings:
      type: object
      properties:
        encoderOrder:
          type: array
          items: { $ref: "#/components/schemas/EncoderKind" }
        maxConcurrentTranscodes: { type: integer, minimum: 1 }
        preset: { type: string, enum: [speed, balanced, quality] }
        preferHevcRemote: { type: boolean }
        toneMapping: { type: boolean }
        throttleSegmentsAhead: { type: integer, minimum: 2 }
        nvencSessions: { type: integer, minimum: 0, maximum: 64, description: "Concurrent NVENC encodes before new jobs go to Quick Sync or the CPU (consumer NVIDIA drivers cap this). 0 = no cap." }
        remoteLadder:
          type: array
          items: { $ref: "#/components/schemas/QualityRung" }

    LibraryGlobalSettings:
      type: object
      properties:
        watchFilesystem: { type: boolean }
        scanOnStartup: { type: boolean }
        ignorePatterns:
          type: array
          items: { type: string, example: "*_staging.*" }
        browseRoots:
          type: array
          description: Directories the folder picker may browse.
          items: { type: string, example: /media }
        watchedThresholdPercent: { type: integer, minimum: 50, maximum: 100 }
        detectIntros: { type: boolean, description: "Find intros and end credits in TV episodes by comparing their audio, for Skip Intro and Skip Credits (PLAY-12). Markers from Plex or the files take precedence." }
        trickplay: { type: boolean, description: "Make seek-bar preview thumbnails for videos in the maintenance window (PLAY-13). Uses roughly 3–7 MB per movie." }
        allowMediaDeletion: { type: boolean, default: false, description: "Lets admins delete media: files from Library Health, and titles from their pages. Deleted files are moved to a .marquee-trash folder in their library folder and removed for good by the daily Empty media trash task." }

    WatchGroup:
      type: object
      required: [id, itemId, title, hostId, members, version, playing, positionMs, at, serverTime]
      properties:
        id: { type: string }
        itemId: { type: integer, format: int64 }
        title: { type: string, description: What's playing. }
        hostId: { type: integer, format: int64, description: Who started the group. }
        members:
          type: array
          items:
            type: object
            required: [userId, name, buffering]
            properties:
              userId: { type: integer, format: int64 }
              name: { type: string }
              avatarUrl: { type: string }
              buffering: { type: boolean }
        version: { type: integer, format: int64, description: Bumped on every change. }
        playing: { type: boolean, description: "False while paused, or while a member is still loading." }
        positionMs: { type: integer, format: int64, description: Position at `at`. }
        at: { type: string, format: date-time, description: "When positionMs was true. While playing, now = positionMs + (serverTime - at)." }
        serverTime: { type: string, format: date-time, description: "The server's clock, to correct for the client's." }
        lastAction: { type: string }
        lastBy: { type: string, description: Who did the last thing. }

    LiveTvStatus:
      type: object
      required: [enabled, channels, sources]
      properties:
        enabled: { type: boolean, description: "Live TV is usable: a source is set up, it has channels, and this profile may watch them. Clients show Live TV only when true." }
        channels: { type: integer }
        dvrAvailable: { type: boolean, description: "Recordings can be written (LIVE-5)." }
        canRecord: { type: boolean, description: The caller may schedule recordings. }
        canViewRecordings: { type: boolean, description: "The caller may see and play recordings (the Recordings tab). Absent from older servers: then assume canRecord." }
        recordingsActive: { type: integer, description: Recordings in progress. }
        guideUntil: { type: string, format: date-time, description: The end of the loaded guide. }
        sources:
          type: array
          items:
            type: object
            required: [id, name, channels, programmes]
            properties:
              id: { type: string }
              name: { type: string }
              channels: { type: integer }
              programmes: { type: integer }
              refreshedAt: { type: string, format: date-time }
              error: { type: string }
              maxStreams: { type: integer, description: "Connections the source allows at once (0 = unlimited)." }
              inUse: { type: integer, description: "Connections in use now: recordings in progress plus live streams (shared ones count once)." }

    Recording:
      type: object
      required: [id, channelName, start, end, title, status, series]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        channelName: { type: string }
        start: { type: string, format: date-time, description: The programme's start (recording begins a little earlier). }
        end: { type: string, format: date-time }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        episode: { type: string }
        category: { type: string }
        imageUrl: { type: string }
        status: { type: string, enum: [scheduled, recording, completed, failed] }
        series: { type: boolean, description: Scheduled by a series rule. }
        ruleId: { type: integer, format: int64 }
        error: { type: string, description: Why it failed. }
        sizeBytes: { type: integer, format: int64 }
        itemId: { type: integer, format: int64, description: The library item once the recording has been scanned. }
        userId: { type: integer, format: int64, description: Who scheduled it. }
        ownerName: { type: string, description: "Who scheduled it, by name (\"Recorded by Alex\")." }
        canDelete: { type: boolean, description: "The caller may cancel or delete it (whoever scheduled it, or an admin)." }
        rating: { type: string, description: "The guide's content rating for the programme, e.g. TV-14, when it gave one." }
        commercials: { $ref: "#/components/schemas/CommercialScan" }
        viewOffsetMs: { type: integer, format: int64, description: "Finished recordings: where the caller stopped watching (0 = not started or finished), to resume from the Recordings list." }
        durationMs: { type: integer, format: int64, description: "Finished recordings: the recorded item's length." }
        watched: { type: boolean, description: "Finished recordings: the caller has watched it to the end." }
        stoppedEarly: { type: boolean, description: "Someone stopped it before the programme ended (Stop and keep): what was recorded until then was kept as a playable file." }

    RecordingRule:
      type: object
      required: [id, title, upcoming, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        channelId: { type: integer, format: int64, description: Absent = any channel. }
        channelName: { type: string }
        upcoming: { type: integer, description: Airings scheduled now. }
        userId: { type: integer, format: int64 }
        ownerName: { type: string, description: "Who made it, by name." }
        paused: { type: boolean, description: "Its owner may no longer record, so nothing new is scheduled (it resumes if they may again)." }
        canDelete: { type: boolean, description: "The caller may stop it (whoever made it, or an admin)." }
        createdAt: { type: string, format: date-time }

    DvrUsage:
      type: object
      required: [userId, usedBytes, recordings, quotaBytes, quotaSource, overQuota]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        usedBytes: { type: integer, format: int64, description: "Space the user's recordings take now: finished ones' files and in-progress ones' parts, wherever they are." }
        recordings: { type: integer, description: Recordings counted. }
        quotaBytes: { type: integer, format: int64, description: "The quota in bytes; 0 = unlimited." }
        quotaGb: { type: integer, description: "The quota in GB; 0 = unlimited." }
        quotaSource: { type: string, enum: [default, user], description: "default = the server default applies (for an admin without a quota of their own: no limit, so quotaBytes is 0); user = the user's own quota (which may be 0, unlimited)." }
        overQuota: { type: boolean, description: At or over the quota. }
        quotaAction: { type: string, enum: [block, deleteOldest], description: What happens to new recordings over quota. }
        canRecord: { type: boolean }
        canView: { type: boolean }

    LiveChannel:
      type: object
      required: [id, name, favorite]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string, description: "The channel number as the source gives it (e.g. 4 or 4.1)." }
        name: { type: string }
        group: { type: string }
        logoUrl: { type: string, description: Server-relative; no token needed. }
        favorite: { type: boolean }
        hidden: { type: boolean, description: The caller hid it (listed only with hidden=true). }
        now: { $ref: "#/components/schemas/LiveProgramme" }
        next: { $ref: "#/components/schemas/LiveProgramme" }
        available: { type: boolean, description: "False while every connection its source allows is in use (recordings and viewers) and this channel isn't one of those being received; tuning it would answer 409 no_tuner. Absent = available (older servers). Channel up/down should skip unavailable channels." }
        unavailableReason: { type: string, description: "Why it isn't available, e.g. \"All connections are in use: recording Gold Rush\"." }

    LiveProgramme:
      type: object
      required: [id, start, end, title]
      properties:
        id: { type: integer, format: int64 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        title: { type: string }
        subtitle: { type: string, description: The episode's name. }
        description: { type: string }
        category: { type: string }
        episode: { type: string, description: "As the guide gives it, e.g. S2 E5." }
        imageUrl: { type: string }
        recording: { type: string, enum: [scheduled, recording], description: The DVR will record or is recording it. }
        series: { type: boolean, description: A series recording covers this title. }

    LiveSession:
      type: object
      required: [id, url, channelId, method]
      properties:
        id: { type: string }
        url: { type: string, description: "The live HLS playlist (server-relative; the session id is its credential). Once the stream has ended the playlist answers 410 with a plain-text reason. A reason starting with \"Stopped:\" (e.g. \"Stopped: a recording needed the connection\") should be shown to the viewer; any other (the recording it shared ended, or it moved to a recording's stream) means tuning the channel again will work." }
        channelId: { type: integer, format: int64 }
        method: { type: string, enum: [copy, transcode] }
        videoCodec: { type: string }
        audioCodec: { type: string }

    LiveTvSource:
      type: object
      required: [name, kind, url]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [m3u, dispatcharr]
          description: "dispatcharr: url is Dispatcharr's address and its /output/m3u and /output/epg are used."
        url: { type: string, description: The M3U playlist (m3u) or Dispatcharr's address. }
        epgUrl: { type: string, description: "XMLTV guide (m3u sources; optional, else the playlist's url-tvg)." }
        userAgent: { type: string }
        enabled: { type: boolean }
        maxStreams: { type: integer, minimum: 0, description: "Connections the provider allows at once (0 or absent = unlimited). At the limit other channels of this source are unavailable, a channel being recorded is watched from the recording's own connection, and a recording that needs a connection stops live streams on other channels of the source." }

    VodSource:
      type: object
      required: [name, url]
      description: "A source of films (LIVE-6): an M3U playlist, e.g. Pluto TV's on-demand movies (each entry's group-title is its category), or an Xtream Codes server such as Dispatcharr (its VOD categories and movies)."
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [m3u, xtream]
          default: m3u
          description: "m3u: url is the playlist. xtream: url is the server's address (e.g. Dispatcharr's), with a username and password (Dispatcharr: a user's XC password)."
        url: { type: string }
        username: { type: string, description: Xtream Codes username. }
        password: { type: string, writeOnly: true, description: "Xtream Codes password. Write-only; omit to keep the saved one." }
        passwordSet: { type: boolean, readOnly: true }
        userAgent: { type: string }
        enabled: { type: boolean }

    VodStatus:
      type: object
      required: [enabled, movies, series, matched, unmatched, matching, sources]
      properties:
        enabled: { type: boolean, description: "Movies on demand are turned on, a source has films or series, and this profile may watch Live TV. Clients show them only when true." }
        movies: { type: integer }
        series: { type: integer, description: Series (Xtream Codes sources). }
        matched: { type: integer, description: Films matched to TMDB. }
        unmatched: { type: integer, description: Films TMDB had no confident match for. }
        matching: { type: boolean, description: Details and TMDB matches are being fetched now. }
        tmdbConfigured: { type: boolean, description: A TMDB API key is set (admins only). }
        sources:
          type: array
          items:
            type: object
            required: [id, name, movies, series]
            properties:
              id: { type: string }
              name: { type: string }
              movies: { type: integer }
              series: { type: integer, description: Series the source lists (Xtream Codes; 0 for playlists). }
              refreshedAt: { type: string, format: date-time }
              error: { type: string }

    VodCategory:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    VodMovie:
      type: object
      required: [id, title, watched]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }
        category: { type: string }
        contentRating: { type: string, description: "e.g. PG-13." }
        rating: { type: number, description: TMDB's average vote out of 10. }
        runtimeMs: { type: integer, format: int64 }
        posterUrl: { type: string, description: Server-relative; no token needed. }
        positionMs: { type: integer, format: int64, description: The caller's resume point. }
        watched: { type: boolean }
        inLibrary: { type: boolean, description: "The library already has this film (matched by TMDB id, else by title and year) in a library the caller can see." }

    VodMovieDetail:
      allOf:
        - $ref: "#/components/schemas/VodMovie"
        - type: object
          required: [genres, cast, matched]
          properties:
            overview: { type: string }
            tagline: { type: string }
            genres: { type: array, items: { type: string } }
            director: { type: string }
            cast:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  character: { type: string }
            backdropUrl: { type: string, description: Server-relative; no token needed. }
            tmdbId: { type: integer }
            imdbId: { type: string }
            matched: { type: boolean, description: The details are TMDB's. }
            canSave: { type: boolean, description: "The caller (an admin) can save it into the library: an Xtream Codes film with a movies folder or a movies save folder (saveDestinations) set." }
            saveDefault: { type: boolean, description: "Admins: saving without a destination works (vodSave.moviesFolder is set)." }
            saveDestinations:
              type: array
              description: "Admins: the extra save folders a film can go to (vodSave.destinations of kind movies or both)."
              items: { $ref: "#/components/schemas/VodSaveDestinationRef" }
            save: { $ref: "#/components/schemas/VodSaveState" }
            library: { $ref: "#/components/schemas/VodLibraryMatch" }
            watchlisted: { type: boolean, description: "On the caller's watchlist (USER-8): PUT/DELETE /livetv/vod/movies/{id}/watchlist." }

    VodMoviePage:
      type: object
      required: [total, movies]
      properties:
        total: { type: integer }
        movies:
          type: array
          items: { $ref: "#/components/schemas/VodMovie" }

    VodSession:
      type: object
      required: [id, url, movieId]
      properties:
        id: { type: string }
        url: { type: string, description: The HLS playlist (server-relative; the session id is its credential). }
        movieId: { type: integer, format: int64, description: "The film (0 for an episode)." }
        episodeId: { type: integer, format: int64, description: "The episode, when watching a series." }
        startMs: { type: integer, format: int64, description: Where to start (the caller's resume point). }

    VodSeries:
      type: object
      required: [id, title, watched, episodeCount, watchedCount, seasonCount]
      properties:
        following: { type: boolean, description: "The caller follows this series (new episodes are saved automatically)." }
        id: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }
        category: { type: string }
        contentRating: { type: string, description: "e.g. TV-14 (TMDB's, when matched)." }
        rating: { type: number, description: "Average vote out of 10 (TMDB's when matched, else the source's)." }
        posterUrl: { type: string, description: Server-relative; no token needed. }
        seasonCount: { type: integer, description: "Seasons known (0 until the series is first opened)." }
        episodeCount: { type: integer, description: "Episodes known (0 until the series is first opened)." }
        watchedCount: { type: integer, description: Episodes the caller has watched. }
        watched: { type: boolean, description: The caller has watched every known episode. }
        inLibrary: { type: boolean, description: "The library already has this show (any of its episodes; matched by TMDB id, else by title and year) in a library the caller can see." }
        nextEpisode:
          allOf:
            - $ref: "#/components/schemas/VodEpisode"
          description: "The episode the caller would watch next (Continue Watching and the series detail)."

    VodRecommendationRow:
      type: object
      required: [id, title, entries]
      properties:
        id: { type: string, description: "top, because:<n>, genre:<name>, acclaimed or popular (new kinds may be added)." }
        title: { type: string, description: "e.g. Because you love Heat." }
        entries: { type: array, items: { $ref: "#/components/schemas/VodSuggestion" } }

    VodSuggestion:
      type: object
      description: "A film or series on demand suggested for the caller from their taste (Watch on VOD, Also on VOD, Muse, the on-demand pages' Recommended for you)."
      required: [kind, key]
      properties:
        kind: { type: string, enum: [movie, series] }
        key: { type: string, description: "Unique within a list, e.g. movie:5, series:7." }
        movie: { $ref: "#/components/schemas/VodMovie" }
        series: { $ref: "#/components/schemas/VodSeries" }
        reason: { type: string, description: "Why it's suggested, e.g. \"Because you love Heat\" or \"Similar to Arrival\"." }
        score: { type: number, description: "How well it fits, higher is better (for ordering only; not comparable between requests)." }

    VodRef:
      type: object
      description: A film or series on demand.
      required: [kind, id]
      properties:
        kind: { type: string, enum: [movie, series] }
        id: { type: integer, format: int64, description: "The film's or series' id (GET /livetv/vod/movies/{id} or /livetv/vod/series/{id})." }

    VodSeriesDetail:
      allOf:
        - $ref: "#/components/schemas/VodSeries"
        - type: object
          required: [genres, cast, matched, seasons, episodes]
          properties:
            overview: { type: string }
            genres: { type: array, items: { type: string } }
            director: { type: string }
            cast:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  character: { type: string }
            backdropUrl: { type: string, description: Server-relative; no token needed. }
            tmdbId: { type: integer }
            matched: { type: boolean, description: The details are TMDB's. }
            seasons:
              type: array
              description: In viewing order (specials, season 0, last).
              items: { $ref: "#/components/schemas/VodSeason" }
            episodes:
              type: array
              description: Every episode in viewing order (seasons in turn, specials last); filter by season for a season's list.
              items: { $ref: "#/components/schemas/VodEpisode" }
            episodesError: { type: string, description: "The source didn't give the episodes (and none were kept from before)." }
            canSave: { type: boolean, description: "The caller (an admin) can save its episodes into the library (shows folder or a shows save folder set). Each episode's save is in episodes[].save." }
            saveDefault: { type: boolean, description: "Admins: saving without a destination works (vodSave.showsFolder is set)." }
            saveDestinations:
              type: array
              description: "Admins: the extra save folders episodes can go to (vodSave.destinations of kind shows or both)."
              items: { $ref: "#/components/schemas/VodSaveDestinationRef" }
            library: { $ref: "#/components/schemas/VodLibraryRollup" }
            watchlisted: { type: boolean, description: "On the caller's watchlist (USER-8): PUT/DELETE /livetv/vod/series/{id}/watchlist." }

    VodSeason:
      type: object
      required: [season, name, episodeCount, watchedCount]
      properties:
        season: { type: integer, description: The season number (0 = specials). }
        name: { type: string, description: "e.g. Season 1." }
        overview: { type: string }
        airDate: { type: string, description: "YYYY-MM-DD as the source gives it." }
        posterUrl: { type: string, description: Server-relative; no token needed. }
        episodeCount: { type: integer }
        watchedCount: { type: integer, description: Episodes the caller has watched. }
        library: { $ref: "#/components/schemas/VodLibraryRollup" }

    VodQuality:
      type: object
      description: What a video file is.
      required: [summary]
      properties:
        width: { type: integer }
        height: { type: integer }
        resolution: { type: integer, description: "The standard resolution: 2160, 1080, 720, 576 or 480 (absent when unknown)." }
        codec: { type: string, description: "ffprobe's name, e.g. h264, hevc, av1." }
        hdr: { type: string, description: "Absent for SDR; e.g. HDR10, hdr10plus, HLG, dolby_vision." }
        bitrateKbps: { type: integer, description: The whole file's bitrate. }
        summary: { type: string, description: "e.g. 1080p HEVC HDR10 8.0 Mb/s (empty when nothing is known)." }

    VodLibraryMatch:
      type: object
      description: "How a film or episode on demand compares with the library's copy (admins only). Found by TMDB id (films; shows plus season and episode), else by the same title and year. Compared by resolution, then HDR over SDR, then a codec-adjusted bitrate at least 1.5× higher (HEVC and AV1 count 1.5× H.264); else the same. none: not in the library (Save). better: this copy is better (Upgrade, replacing the library's). same, worse: saving isn't possible."
      required: [verdict, reason]
      properties:
        verdict: { type: string, enum: [none, better, same, worse] }
        reason: { type: string, description: "Why, e.g. Higher resolution (1080p; the library's is 720p)." }
        quality: { $ref: "#/components/schemas/VodQuality" }
        libraryQuality: { $ref: "#/components/schemas/VodQuality" }
        libraryItemId: { type: integer, format: int64, description: The library's film or episode. }
        pending: { type: boolean, description: "This copy's quality is being checked (the verdict is same until then); fetch again in a few seconds." }

    VodLibraryRollup:
      type: object
      description: "A season's or show's episodes by VodLibraryMatch verdict (admins only): Save missing saves none, Upgrade saves better."
      required: [none, better, same, worse]
      properties:
        none: { type: integer, description: Episodes not in the library. }
        better: { type: integer, description: Episodes better than the library's copies. }
        same: { type: integer }
        worse: { type: integer }
        pending: { type: integer, description: Episodes whose quality is being checked (counted as same meanwhile). }

    VodEpisode:
      type: object
      required: [id, seriesId, seriesTitle, season, episode, title, watched]
      properties:
        id: { type: integer, format: int64 }
        seriesId: { type: integer, format: int64 }
        seriesTitle: { type: string }
        season: { type: integer }
        episode: { type: integer, description: The episode number within its season. }
        title: { type: string }
        overview: { type: string }
        airDate: { type: string, description: "YYYY-MM-DD as the source gives it." }
        runtimeMs: { type: integer, format: int64 }
        rating: { type: number }
        stillUrl: { type: string, description: Server-relative; no token needed. }
        positionMs: { type: integer, format: int64, description: The caller's resume point. }
        watched: { type: boolean }
        save: { $ref: "#/components/schemas/VodSaveState" }
        library: { $ref: "#/components/schemas/VodLibraryMatch" }

    VodSaveSettings:
      type: object
      description: "Saving films and episodes on demand (Xtream Codes sources) into the library (admins only). Partial sends keep the other fields."
      properties:
        followEnabled: { type: boolean, description: "Let people follow series on demand (new episodes saved automatically, counted in their DVR quota). Default false." }
        followDefaultMaxGb: { type: number, minimum: 0, description: "Size limit a new follow starts with, in GB (10^9 bytes); 0 = none (only the DVR quota limits it). Default 0." }
        moviesFolder: { type: string, description: "Where films are saved, as the server sees it (must exist and be writable). Empty turns saving films off." }
        showsFolder: { type: string, description: "Where episodes are saved. Empty turns saving episodes off." }
        quality: { type: string, enum: [original, remux, transcode], description: "original: the file as it is (MPEG-TS, FLV and other unusual containers are remuxed to MKV). remux: to MKV, every stream copied. transcode: the settings below." }
        maxHeight: { type: integer, enum: [2160, 1080, 720, 480], description: "Transcode: resolution cap (never upscaled)." }
        videoCodec: { type: string, enum: [hevc, h264] }
        videoQuality: { type: string, enum: [high, balanced, small], description: "Transcode: constant quality (CRF/CQ), used unless videoKbps is set." }
        videoKbps: { type: integer, minimum: 0, maximum: 200000, description: "Transcode: target video bitrate; 0 = use videoQuality." }
        audio: { type: string, enum: [copy, aac_stereo, aac_51], description: "Transcode: audio copied, or AAC stereo, or AAC up to 5.1." }
        concurrentPerSource: { type: integer, minimum: 1, maximum: 5, description: Saves at once per source. Default 1. }
        scanAfterSave: { type: boolean, description: Scan the library whose folder holds a saved file. Default on. }
        skipExisting: { type: boolean, description: "Skip a title whose file is already in its folder. Default on. (A title the library already has is never saved again, unless as an upgrade: see VodLibraryMatch.)" }
        pauseWhileWatching: { type: boolean, description: "Pause saves while someone watches (see pauseScope), resuming 15 s after. Default on." }
        pauseScope: { type: string, enum: [source, any], description: "source: something from the same source, or Live TV from the same host (Dispatcharr). any: any playback on the server." }
        retryFailed: { type: boolean, description: "Queue failed saves again every few hours. Default on." }
        windowOnly: { type: boolean, description: "Download only during the maintenance window (Scheduled Tasks); outside it running saves stop and keep what they downloaded. Default off: any time." }
        destinations:
          type: array
          description: "More save folders besides moviesFolder and showsFolder (e.g. Anime), offered as \"Save to {name}\". Sending the list replaces it; an item without an id is new."
          items: { $ref: "#/components/schemas/VodSaveDestination" }

    VodSaveDestination:
      type: object
      description: "A save folder besides the default Movies and Shows ones (admins only)."
      required: [name, folder, kind]
      properties:
        id: { type: string, description: "Given by the server; send it back to keep the destination." }
        name: { type: string, description: "Shown in buttons (\"Save to Anime\"); unique, ignoring case." }
        folder: { type: string, description: "As the server sees it; must exist and be writable." }
        kind: { type: string, enum: [movies, shows, both], description: "What can be saved there: films, episodes, or both." }
        inLibrary: { type: boolean, readOnly: true, description: "A library includes the folder (saved titles are scanned into it). When false, saved titles won't appear until the folder is added to a library." }

    VodSaveDestinationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    VodSaveState:
      type: object
      description: The latest save of a film or episode (admins only).
      required: [id, state, progress, verified]
      properties:
        id: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/VodSaveStateName" }
        progress: { type: number, description: "0–1: downloaded share, or the conversion's progress while processing." }
        verified: { type: boolean }
        error: { type: string }

    VodSaveStateName:
      type: string
      description: "queued (waiting; see pauseReason), downloading, processing (remux or transcode), verifying, paused (by an admin), done, failed, cancelled, skipped (already in the library)."
      enum: [queued, downloading, processing, verifying, paused, done, failed, cancelled, skipped]

    VodSave:
      type: object
      required: [id, sourceId, kind, title, targetPath, quality, state, bytesDone, bytesTotal, progress, attempts, verified, createdAt]
      properties:
        id: { type: integer, format: int64 }
        sourceId: { type: string }
        sourceName: { type: string }
        kind: { type: string, enum: [movie, episode] }
        movieId: { type: integer, format: int64, description: The film (kind movie). }
        episodeId: { type: integer, format: int64, description: The episode (kind episode). }
        seriesId: { type: integer, format: int64, description: The episode's series. }
        title: { type: string, description: "e.g. Archer - S01E01 - Mole Hunt." }
        targetPath: { type: string, description: "Where it goes (the final name, with its quality tag, once done)." }
        quality: { type: string, enum: [original, remux, transcode] }
        state: { $ref: "#/components/schemas/VodSaveStateName" }
        bytesDone: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64, description: 0 = unknown. }
        progress: { type: number, description: "0–1 of the current step: download, or conversion while processing." }
        speedBps: { type: number, description: Download speed in bytes a second (while downloading). }
        etaSeconds: { type: integer, format: int64, description: Time left for the download. }
        connections: { type: integer, description: "Connections the download uses now (while downloading; more than 1 when a large file is fetched over the free connections of the source's Maximum streams)." }
        pauseReason: { type: string, description: "Why a queued save isn't running: the queue is paused, something is being watched, connections are in use by viewers, or the source is unreachable." }
        attempts: { type: integer, description: Network failures in a row. }
        nextAttemptAt: { type: string, format: date-time, description: When a save waiting after a network error tries again. }
        error: { type: string }
        verified: { type: boolean, description: "The file passed verification (size, ffprobe, length, start and end decode)." }
        verifyNote: { type: string }
        sha256: { type: string, description: The saved file's SHA-256. }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        upgrade: { type: boolean, description: "It replaces the library's copy (moved to the media trash once this one is verified)." }
        replacedPath: { type: string, description: "An upgrade, once done: where the library's copy it replaced was (shown as Upgraded)." }
        destinationName: { type: string, description: "The save folder chosen (vodSave.destinations' name, e.g. Anime); absent for the default folder and for upgrades (which replace the library's copy in place)." }
        destinationFolder: { type: string, description: The chosen save folder's path. }
        noLibrary: { type: boolean, description: "No library includes the folder it's saved into, so it won't appear in Marquee until that folder is added to a library." }

    VodSaveQueue:
      type: object
      required: [saves, active, paused, moviesFolderSet, showsFolderSet]
      properties:
        saves:
          type: array
          items: { $ref: "#/components/schemas/VodSave" }
        active: { type: boolean, description: Something is queued or running (poll while true). }
        paused: { type: boolean, description: The whole queue is paused. }
        moviesFolderSet: { type: boolean }
        showsFolderSet: { type: boolean }

    VodSaveResult:
      type: object
      required: [queued, already, skipped, saves]
      properties:
        queued: { type: integer, description: Saves added (or failed ones queued again). }
        already: { type: integer, description: Already queued or saved. }
        skipped: { type: integer, description: "Already in the library (as well or better, or better without includeUpgrades)." }
        upgrades: { type: integer, description: "Of queued, upgrades replacing the library's copies." }
        saves:
          type: array
          items: { $ref: "#/components/schemas/VodSave" }

    VodSeriesPage:
      type: object
      required: [total, series]
      properties:
        total: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/VodSeries" }

    VodUpNext:
      type: object
      properties:
        episode: { $ref: "#/components/schemas/VodEpisode" }

    RequestsStatus:
      type: object
      required: [enabled, canRequest, pendingApprovals]
      properties:
        enabled: { type: boolean, description: Seerr is configured. }
        canRequest: { type: boolean, description: The caller may make requests (admins always; others when granted). }
        pendingApprovals: { type: integer, description: Requests waiting for approval (admins; 0 for others). }

    Availability:
      type: string
      description: Where a title stands. available/partial come from the library or Seerr; requested = sent to Seerr; pending = waiting for an admin in Marquee.
      enum: [none, pending, requested, processing, partial, available]

    DiscoverItem:
      type: object
      required: [tmdbId, mediaType, title, availability]
      properties:
        tmdbId: { type: integer, format: int64 }
        mediaType: { type: string, enum: [movie, tv] }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterUrl: { type: string }
        backdropUrl: { type: string }
        tmdbRating: { type: number, description: "TMDB's user score, 0–10 (absent with too few votes)." }
        availability: { $ref: "#/components/schemas/Availability" }
        itemId: { type: integer, format: int64, description: "The title in this library, when it's here." }
        requestId: { type: integer, format: int64, description: The caller's open Marquee request for it. }
        vod:
          allOf:
            - $ref: "#/components/schemas/VodRef"
          description: "The same title (TMDB id and type) on demand, when the caller may watch it there: show Watch now on VOD."

    ScrobbleStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        available: { type: boolean, description: "Last.fm: the server has Last.fm's API keys, so people can connect." }
        username: { type: string, description: The account plays go to. }
        error: { type: string, description: The last problem sending a play. }

    NamedId:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    TitleRatings:
      type: object
      description: Public ratings of a title, through Seerr. Each part is absent when unknown.
      properties:
        rottenTomatoes:
          type: object
          properties:
            criticsScore: { type: integer, description: Tomatometer percentage. }
            criticsRating: { type: string, description: "e.g. Certified Fresh, Fresh, Rotten." }
            audienceScore: { type: integer, description: Popcornmeter percentage. }
            audienceRating: { type: string, description: "e.g. Upright, Spilled." }
            url: { type: string }
        imdb:
          type: object
          properties:
            rating: { type: number, description: "IMDb user rating, 0–10." }
            url: { type: string }

    DiscoverPage:
      type: object
      required: [results, page, totalPages]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/DiscoverItem" }
        page: { type: integer }
        totalPages: { type: integer }

    RequestableShow:
      type: object
      required: [tmdbId, title, seasons]
      properties:
        tmdbId: { type: integer, format: int64 }
        title: { type: string }
        seasons:
          type: array
          items:
            type: object
            required: [number, availability]
            properties:
              number: { type: integer }
              name: { type: string }
              episodeCount: { type: integer }
              availability: { $ref: "#/components/schemas/Availability" }

    RequestState:
      type: string
      enum: [pending, approved, declined, failed, available]

    MediaRequestCreate:
      type: object
      required: [tmdbId, mediaType]
      properties:
        tmdbId: { type: integer, format: int64 }
        mediaType: { type: string, enum: [movie, tv] }
        seasons:
          type: array
          description: Shows only; absent or empty = every season not already here.
          items: { type: integer }

    MediaRequest:
      type: object
      required: [id, tmdbId, mediaType, title, status, userId, userName, createdAt, seasons]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer, format: int64 }
        mediaType: { type: string, enum: [movie, tv] }
        title: { type: string }
        year: { type: integer }
        posterUrl: { type: string }
        seasons:
          type: array
          items: { type: integer }
        status: { $ref: "#/components/schemas/RequestState" }
        reason: { type: string, description: Why it was declined or failed. }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        seerrRequestId: { type: integer, format: int64 }

    IntegrationSettings:
      type: object
      properties:
        seerrUrl: { type: string, description: "Seerr's address, e.g. http://192.168.1.20:5055. Empty turns requests off." }
        seerrApiKeySet: { type: boolean, readOnly: true }
        lastFmConfigured: { type: boolean, readOnly: true, description: "Last.fm's API key and shared secret are set, so people can connect Last.fm (MUSIC-12)." }
        bazarrUrl: { type: string, description: "Bazarr's address, e.g. http://127.0.0.1:6767. Empty turns the Bazarr integration off (META-12)." }
        bazarrApiKeySet: { type: boolean, readOnly: true }
        dvrPaddingBefore: { type: integer, minimum: 0, maximum: 60, description: Minutes recordings start early. }
        dvrPaddingAfter: { type: integer, minimum: 0, maximum: 120, description: Minutes recordings run late. }
        dvrDefaultQuotaGb: { type: integer, minimum: 0, description: "Every user's DVR quota in GB unless their own overrides it. 0 = unlimited (the default)." }
        dvrQuotaAction:
          type: string
          enum: [block, deleteOldest]
          description: "When a recording is due and its owner is at or over quota: block = it isn't recorded (default); deleteOldest = their oldest recordings they've watched (never one being watched or recorded) go to the media trash to make room."
        dvrFolder: { type: string, description: "Where new recordings go: an absolute folder that exists and the server can write in. Empty = the server's configured recordings folder (dvrFolderDefault). Recordings made earlier stay where they are." }
        dvrFolderDefault: { type: string, readOnly: true, description: The server's configured recordings folder. }
        dvrFolderInLibrary: { type: boolean, readOnly: true, description: "A library covers the recordings folder's TV and Movies folders (recordings appear in the library)." }
        commercials:
          type: string
          enum: ["off", detect, remove]
          description: "What happens to finished recordings and, nightly, older ones: off; detect = find the commercial breaks with Comskip but leave the files alone; remove = find them and cut them out (the original goes to the media trash and can be restored while it's there). Default off."
        comskipAvailable: { type: boolean, readOnly: true, description: "This server's build includes Comskip, so commercials can be found." }
        liveTvSources:
          type: array
          items: { $ref: "#/components/schemas/LiveTvSource" }
        vodEnabled: { type: boolean, description: "Movies on demand appear under Live TV (LIVE-6)." }
        vodAutoRefresh: { type: boolean, description: "The movie sources' lists reload every vodRefreshHours after the last successful refresh (default on). Off: they reload only when an admin presses Refresh (and at start for a source that has never loaded)." }
        vodRefreshHours: { type: integer, minimum: 1, maximum: 48, description: "Hours between automatic syncs of the movie sources (default 6)." }
        vodSources:
          type: array
          items: { $ref: "#/components/schemas/VodSource" }

    IntegrationSettingsUpdate:
      type: object
      properties:
        seerrUrl: { type: string }
        seerrApiKey: { type: string, description: Write-only. }
        lastFmApiKey: { type: string, description: "Last.fm API key. Write-only; empty turns Last.fm off." }
        lastFmSecret: { type: string, description: Last.fm shared secret. Write-only. }
        bazarrUrl: { type: string }
        bazarrApiKey: { type: string, description: "Bazarr's API key (Settings → General in Bazarr). Write-only." }
        dvrPaddingBefore: { type: integer, minimum: 0, maximum: 60 }
        dvrPaddingAfter: { type: integer, minimum: 0, maximum: 120 }
        commercials: { type: string, enum: ["off", detect, remove] }
        dvrDefaultQuotaGb: { type: integer, minimum: 0 }
        dvrQuotaAction: { type: string, enum: [block, deleteOldest] }
        dvrFolder: { type: string, description: "Checked when it changes: it must exist and be writable." }
        liveTvSources:
          type: array
          description: Replaces the whole list when sent.
          items: { $ref: "#/components/schemas/LiveTvSource" }
        vodEnabled: { type: boolean }
        vodAutoRefresh: { type: boolean }
        vodRefreshHours: { type: integer, minimum: 1, maximum: 48 }
        vodSources:
          type: array
          description: Replaces the whole list when sent.
          items: { $ref: "#/components/schemas/VodSource" }

    MetadataSettings:
      type: object
      properties:
        tmdbApiKeySet: { type: boolean, readOnly: true }
        fanartApiKeySet: { type: boolean, readOnly: true }
        openSubtitlesApiKeySet: { type: boolean, readOnly: true }
        openSubtitlesUsername: { type: string, description: Optional OpenSubtitles account; logging in raises the daily download limit. }
        openSubtitlesPasswordSet: { type: boolean, readOnly: true }
        omdbApiKeySet: { type: boolean, readOnly: true }
        omdbDailyLimit: { type: integer, minimum: 1, description: Requests per day (free OMDb keys allow 1000). }
        animeEpisodeOrdering: { type: string, enum: [seasonal, absolute] }

    MetadataSettingsUpdate:
      type: object
      description: Secret keys are write-only. Send an empty string to clear one.
      properties:
        tmdbApiKey: { type: string }
        fanartApiKey: { type: string }
        openSubtitlesApiKey: { type: string }
        openSubtitlesUsername: { type: string }
        openSubtitlesPassword: { type: string }
        omdbApiKey: { type: string }
        omdbDailyLimit: { type: integer, minimum: 1 }
        animeEpisodeOrdering: { type: string, enum: [seasonal, absolute] }

    TaskSettings:
      type: object
      properties:
        maintenanceWindowStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "03:00" }
        maintenanceWindowHours: { type: integer, minimum: 1, maximum: 12 }
        backupRetention: { type: integer, minimum: 1, maximum: 365, description: "Days to keep nightly backups before they're deleted (the newest is always kept)." }
        disabled: { type: array, items: { type: string }, description: "Ids of the tasks turned off (they don't run on their schedule or automatically; Run now still works). Unknown ids are ignored." }

    # ---------- Libraries ----------
    LibraryType:
      type: string
      enum: [movies, shows, anime, music, videos, photos]

    LibraryOptions:
      type: object
      properties:
        language: { type: string, example: en-US }
        episodeOrdering: { type: string, enum: [aired, absolute, dvd], description: TV/anime only. }
        ignorePatterns:
          type: array
          items: { type: string }
        includeInHome: { type: boolean }
        includeInSearch: { type: boolean }
        scanIntervalHours: { type: integer, minimum: 0, description: 0 = rely on file watching only. }

    Library:
      type: object
      required: [id, name, type, paths, options, itemCount, createdAt, updatedAt, scanStatus]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/LibraryType" }
        paths:
          type: array
          items: { type: string }
        options: { $ref: "#/components/schemas/LibraryOptions" }
        itemCount: { type: integer }
        scanStatus: { type: string, enum: [idle, queued, scanning] }
        scanProgress: { $ref: "#/components/schemas/ScanProgress" }
        lastScanResult: { type: string, description: "Summary of the last scan, e.g. 6596 files: 12 added…" }
        lastScanError: { type: string }
        lastScannedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        missingCount: { type: integer, description: "Admins listing with manage=true: how many titles have no available file and would be removed by POST /libraries/{libraryId}/remove-missing (only files in folders that can be reached count)." }
        unreadablePaths: { type: array, items: { type: string }, description: "Admins listing with manage=true: the library's folders that can't be read right now (offline drive, permissions). Their titles are kept until they can be read again." }
        recordings: { type: boolean, description: "A Live TV recordings library (Recorded TV / Recorded Movies). Only listed to admins with manage=true; its items are shown only under Live TV → Recordings, and browsing it returns 404." }

    LibraryCreate:
      type: object
      required: [name, type, paths]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        type: { $ref: "#/components/schemas/LibraryType" }
        paths:
          type: array
          minItems: 1
          items: { type: string }
        options: { $ref: "#/components/schemas/LibraryOptions" }

    LibraryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        paths:
          type: array
          minItems: 1
          items: { type: string }
        options: { $ref: "#/components/schemas/LibraryOptions" }

    ScanProgress:
      type: object
      required: [phase, done, total]
      properties:
        phase: { type: string, enum: [walking, probing, cleanup, metadata] }
        done: { type: integer }
        total: { type: integer }
        current: { type: string, description: File currently being processed (relative path). }

    # ---------- Activity ----------
    Activity:
      type: object
      required: [tasks, serverVersion]
      properties:
        serverVersion: { type: string, description: Lets clients notice a server upgrade and reload. }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ActivityTask" }

    ActivityTask:
      type: object
      required: [id, kind, title, state]
      properties:
        id: { type: string, description: "Stable id, e.g. scan:3" }
        kind: { type: string, enum: [scan, import, stream, task, download, optimize], description: "download: a VOD title being saved to the library (admins). optimize: a library file being re-encoded by the optimizer (admins)." }
        title: { type: string, example: Scanning Movies }
        state: { type: string, enum: [queued, running] }
        libraryId: { type: integer, format: int64 }
        progress: { $ref: "#/components/schemas/ScanProgress" }
        link: { type: string, description: "Web app path that shows this task, e.g. /livetv?tab=recordings for a recording in progress (id recording:<recordingId>, kind task, progress done/total = seconds elapsed/scheduled length)." }

    LogEntry:
      type: object
      required: [time, level, message]
      properties:
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
        attrs:
          type: object
          additionalProperties: { type: string }

    # ---------- Plex import ----------
    PlexPathMapping:
      type: object
      required: [plexPath, marqueePath]
      properties:
        plexPath: { type: string, example: /movies }
        marqueePath: { type: string, example: /media/video/Movies }

    PlexSectionPreview:
      type: object
      required: [id, name, type, roots, files, matchedFiles]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [movies, shows, music, other] }
        roots: { type: array, items: { type: string } }
        libraryId: { type: integer, format: int64, description: Marquee library it pairs with. }
        files: { type: integer }
        matchedFiles: { type: integer }

    PlexAccountPreview:
      type: object
      required: [id, name, isOwner, watched, inProgress, ratings, history, playlists, suggestedAction]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        isOwner: { type: boolean }
        watched: { type: integer }
        inProgress: { type: integer }
        ratings: { type: integer }
        history: { type: integer }
        playlists: { type: integer }
        suggestedAction: { type: string, enum: [create, link, skip] }
        suggestedUserId: { type: integer, format: int64 }
        suggestedUsername: { type: string }

    PlexImportPreview:
      type: object
      required: [sections, accounts, pathMappings, files, matchedFiles, unmatchedSample]
      properties:
        sections: { type: array, items: { $ref: "#/components/schemas/PlexSectionPreview" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/PlexAccountPreview" } }
        pathMappings: { type: array, items: { $ref: "#/components/schemas/PlexPathMapping" } }
        files: { type: integer }
        matchedFiles: { type: integer }
        unmatchedSample: { type: array, items: { type: string } }

    PlexAccountChoice:
      type: object
      required: [plexId, action]
      properties:
        plexId: { type: integer, format: int64 }
        action: { type: string, enum: [create, link, merge, skip], description: "merge: combine with another Plex account in this import (one person with several Plex accounts)." }
        userId: { type: integer, format: int64, description: Marquee user to link to. }
        username: { type: string, description: Username for a new user. }
        mergeInto: { type: integer, format: int64, description: Plex account id whose Marquee user this account joins. }

    PlexImportRequest:
      type: object
      required: [pathMappings, accounts]
      properties:
        pathMappings: { type: array, items: { $ref: "#/components/schemas/PlexPathMapping" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/PlexAccountChoice" } }
        include: { $ref: "#/components/schemas/PlexImportInclude" }

    PlexImportInclude:
      type: object
      description: What to import. Everything defaults to true.
      properties:
        matches: { type: boolean }
        watchState: { type: boolean }
        history: { type: boolean }
        playlists: { type: boolean }
        markers: { type: boolean }
        artwork: { type: boolean }

    PlexImportReport:
      type: object
      required: [startedAt, finishedAt, files, matchedFiles, unmatchedSample, usersCreated, usersLinked, matchesAgreed, matchesApplied,
        matchesKept, matchFailures, artwork, artworkMissing, watchStateItems, ratings, historyImported, historySkipped, markers,
        playlists, playlistItems, playlistItemsMissing, warnings]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        files: { type: integer }
        matchedFiles: { type: integer }
        unmatchedSample: { type: array, items: { type: string } }
        usersCreated: { type: integer }
        usersLinked: { type: integer }
        matchesAgreed: { type: integer }
        matchesApplied: { type: integer }
        matchesKept: { type: array, items: { type: string }, description: Disagreements where Marquee's match was kept; review with Fix Match. }
        matchFailures: { type: array, items: { type: string } }
        artwork: { type: integer }
        artworkMissing: { type: integer }
        watchStateItems: { type: integer }
        ratings: { type: integer }
        historyImported: { type: integer }
        historySkipped: { type: integer }
        markers: { type: integer }
        playlists: { type: integer }
        playlistItems: { type: integer }
        playlistItemsMissing: { type: integer }
        warnings: { type: array, items: { type: string } }

    PlexImportStatus:
      type: object
      required: [available, running]
      properties:
        available: { type: boolean, description: A Plex database was found at the Plex data mount (/plex). }
        databasePath: { type: string }
        running: { type: boolean }
        progress:
          type: object
          required: [step, done, total]
          properties:
            step: { type: string }
            done: { type: integer }
            total: { type: integer }
        lastError: { type: string }
        lastReport: { $ref: "#/components/schemas/PlexImportReport" }

    # ---------- Plex sync ----------
    PlexSyncSettings:
      type: object
      required: ["on", url, tokenSet, enabled, intervalMinutes, watchState, ratings, resumePositions, playHistory, pathMappings]
      properties:
        "on": { type: boolean, description: "Plex sync is on. Off stops every run, automatic or manual, and the Plex settings page hides its options (the import too). On unless an admin turned it off." }
        url: { type: string, description: "The Plex server's address, e.g. http://192.168.1.10:32400." }
        tokenSet: { type: boolean, description: A Plex token is saved (it is never returned). }
        enabled: { type: boolean, description: "Automatic sync every intervalMinutes. Off by default; Sync now works either way." }
        intervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        watchState: { type: boolean, description: "Watched and unwatched, play counts and last played." }
        ratings: { type: boolean }
        resumePositions: { type: boolean }
        playHistory: { type: boolean, description: "Plays recorded in Plex come into Marquee's history. Plays made in Marquee reach Plex as a play at sync time." }
        pathMappings:
          type: array
          description: "Plex folders and the Marquee folders they correspond to (from the Plex import); empty uses suggested ones."
          items: { $ref: "#/components/schemas/PlexPathMapping" }

    PlexSyncSettingsUpdate:
      type: object
      properties:
        "on": { type: boolean }
        url: { type: string }
        token: { type: string, writeOnly: true, description: "The server owner's Plex token. An empty string removes it." }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        watchState: { type: boolean }
        ratings: { type: boolean }
        resumePositions: { type: boolean }
        playHistory: { type: boolean }
        pathMappings: { type: array, items: { $ref: "#/components/schemas/PlexPathMapping" } }

    PlexSyncUser:
      type: object
      required: [plexAccountId, name, kind, canSync]
      properties:
        plexAccountId: { type: integer, format: int64, description: "Plex's account id (1 is the server owner)." }
        name: { type: string }
        kind: { type: string, enum: [owner, home, managed, shared, unknown], description: "home and managed are Plex Home users; shared are friends the server is shared with." }
        userId: { type: integer, format: int64, description: Marquee user it syncs with. }
        canSync: { type: boolean, description: As of the last sync or preview. }
        reason: { type: string, description: "Why it can't sync, e.g. a friend the owner's token can't act for." }

    PlexSyncChange:
      type: object
      required: [direction, user, title, kind]
      properties:
        direction: { type: string, enum: [toPlex, toMarquee] }
        user: { type: string, description: Plex account name. }
        title: { type: string }
        kind: { type: string, enum: [watched, unwatched, plays, lastPlayed, position, rating, history] }
        from: { type: string }
        to: { type: string }
        conflict: { type: boolean, description: "Changed on both sides since the last sync; the newer change won (ties go to Marquee)." }

    PlexSyncReport:
      type: object
      required: [startedAt, finishedAt, dryRun, waiting, toPlex, toMarquee, historyPulled, conflicts, skipped, failed, unchanged,
        notInMarquee, usersSynced, changes, changesTruncated, errors]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        dryRun: { type: boolean, description: A preview; nothing was changed. }
        waiting: { type: boolean, description: "Plex wasn't reachable, so nothing changed; the sync tries again at the next run." }
        toPlex: { type: integer }
        toMarquee: { type: integer }
        historyPulled: { type: integer }
        conflicts: { type: integer }
        skipped: { type: integer, description: "Changes that can't be made in Plex, e.g. a resume position past 90%." }
        failed: { type: integer }
        unchanged: { type: integer }
        notInMarquee: { type: integer, description: Plex items whose files Marquee doesn't have. }
        usersSynced: { type: integer }
        changes: { type: array, items: { $ref: "#/components/schemas/PlexSyncChange" } }
        changesTruncated: { type: boolean }
        errors: { type: array, items: { type: string } }

    PlexSyncStatus:
      type: object
      required: [settings, running, users]
      properties:
        settings: { $ref: "#/components/schemas/PlexSyncSettings" }
        running: { type: boolean, description: A sync or preview is running. }
        progress:
          type: object
          required: [step, done, total]
          properties:
            step: { type: string }
            done: { type: integer }
            total: { type: integer }
        reachable: { type: boolean, description: "Plex answers with the token (checked at most once a minute); absent until a server and token are set." }
        lastError: { type: string, description: "Why the last sync failed, e.g. Plex rejected the token." }
        lastRun: { $ref: "#/components/schemas/PlexSyncReport" }
        nextRunAt: { type: string, format: date-time, description: When automatic sync runs next; absent while it's off. }
        users: { type: array, items: { $ref: "#/components/schemas/PlexSyncUser" } }

    PlexSignIn:
      type: object
      required: [id, code, authUrl]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        authUrl: { type: string }

    # ---------- Playback ----------
    DeviceProfile:
      type: object
      description: What the client can play. Codec names follow ffprobe (h264, hevc, av1, vp9, aac, ac3, eac3, opus, flac, mp3…).
      required: [containers, videoCodecs, audioCodecs, hls, hlsVideoCodecs, hlsAudioCodecs]
      properties:
        containers: { type: array, items: { type: string }, description: "Containers playable from a file URL (mp4, webm, mkv…)." }
        videoCodecs: { type: array, items: { type: string } }
        audioCodecs: { type: array, items: { type: string } }
        maxAudioChannels: { type: integer }
        maxHeight: { type: integer }
        tenBit: { type: boolean }
        hdr: { type: array, items: { type: string, enum: [hdr10, hdr10plus, hlg, dolby_vision] } }
        hls: { type: boolean }
        hlsVideoCodecs: { type: array, items: { type: string } }
        hlsAudioCodecs: { type: array, items: { type: string } }
        textSubtitles: { type: boolean, description: Can show WebVTT sidecar subtitles. }
        assSubtitles: { type: boolean, description: "Can render styled ASS/SSA subtitles itself (e.g. JASSUB); they're then sent as .ass with the file's fonts." }
        hlsSubtitles: { type: boolean, description: "Text subtitles must come inside the HLS stream (AVPlayer). Every text track is listed as a WebVTT rendition, and a file with a subtitle selected is repackaged rather than played directly." }

    PlaybackRequest:
      type: object
      required: [itemId, profile]
      properties:
        itemId: { type: integer, format: int64 }
        fileId: { type: integer, format: int64, description: A specific version/file. Default is the best available. }
        audioStreamId: { type: integer, format: int64 }
        subtitleStreamId: { type: integer, format: int64, description: "-1 turns subtitles off; omit for automatic (the user's subtitle preference)." }
        startMs: { type: integer, format: int64, description: Omit to resume where the user left off. }
        nightMode: { type: boolean, description: "Night mode (dialogue boost): the server converts the audio with dynamic-range compression and lifts the centre (dialogue) channel, so loud scenes are quieter and speech clearer. The video is still copied when it can be (a direct play becomes a direct stream). Omitted = the user's nightMode preference." }
        maxBitrateKbps: { type: integer, description: "The app's quality setting; 0/omitted = original (home) or automatic (remote)." }
        measuredKbps: { type: integer, description: Measured download speed from /playback/bandwidth-test. }
        preload:
          type: boolean
          description: Prepare the next item (gapless music) without ending this device's current session. It takes over when it first reports "playing".
        subtitleOffsetMs:
          type: integer
          minimum: -30000
          maximum: 30000
          description: "Subtitle timing (PLAY-17), ms; positive shows subtitles later. Omit both offsets to use what this user last chose for this file; values sent are remembered."
        audioOffsetMs:
          type: integer
          minimum: -30000
          maximum: 30000
          description: "Audio timing (PLAY-17), ms; positive plays the audio later. Nonzero repackages the stream (no direct play)."
        profile: { $ref: "#/components/schemas/DeviceProfile" }

    PlaybackDecision:
      type: object
      required: [method, summary, reasons, videoCopy, audioCopy, burnSubtitle, toneMap]
      properties:
        method: { type: string, enum: [direct_play, direct_stream, transcode] }
        summary: { type: string, example: Transcode h264 720p 3800 kbps }
        reasons: { type: array, items: { type: string } }
        videoCopy: { type: boolean }
        videoCodec: { type: string }
        height: { type: integer }
        videoKbps: { type: integer }
        audioCopy: { type: boolean }
        audioCodec: { type: string }
        audioChannels: { type: integer }
        audioKbps: { type: integer, description: "Bitrate of the converted audio (MUSIC-23); absent when the audio is sent as it is." }
        burnSubtitle: { type: boolean }
        toneMap: { type: boolean }

    Marker:
      type: object
      required: [kind, startMs, endMs]
      properties:
        kind: { type: string, enum: [intro, credits] }
        startMs: { type: integer, format: int64 }
        endMs: { type: integer, format: int64 }

    CommercialBreak:
      type: object
      description: "A commercial break in a Live TV recording, in milliseconds from the start of the original recording. Once cut, what was actually removed (aligned to keyframes)."
      required: [startMs, endMs]
      properties:
        startMs: { type: integer, format: int64 }
        endMs: { type: integer, format: int64 }

    CommercialScan:
      type: object
      description: "Admins only: commercials in a recording. pending = not checked yet; queued/running = being checked or cut; detected = found (breaks may be empty), file unchanged; waiting = to be cut once nobody is watching it; cut = removed from the file (removedMs); restored = the original was put back; failed = see error."
      required: [status, breaks]
      properties:
        status: { type: string, enum: [pending, queued, running, detected, waiting, cut, restored, failed] }
        breaks: { type: array, items: { $ref: "#/components/schemas/CommercialBreak" } }
        removedMs: { type: integer, format: int64, description: "With cut: how much was removed in all." }
        error: { type: string, description: "With failed, why." }
        scannedAt: { type: string, format: date-time, description: When it was last checked or cut. }
        canRestore: { type: boolean, description: "The original is still in the media trash, so it can be put back." }
        available: { type: boolean, description: "Comskip is in this server's build, so commercials can be removed." }

    PlaybackSession:
      type: object
      required: [id, itemId, url, protocol, startMs, durationMs, decision, networkClass, markers]
      properties:
        nightMode: { type: boolean, description: "Night mode is applied to this session's audio." }
        id: { type: string }
        itemId: { type: integer, format: int64 }
        fileId: { type: integer, format: int64 }
        url: { type: string, description: "Path to play: a file (direct play), progressive audio, or an HLS master playlist." }
        protocol: { type: string, enum: [file, hls, progressive] }
        contentType: { type: string, description: "The media type url is served with (e.g. video/mp4, audio/flac, application/vnd.apple.mpegurl), for players such as Chromecast that need it." }
        startMs: { type: integer, format: int64, description: Where to start (the resume position unless startMs was given). }
        durationMs: { type: integer, format: int64 }
        decision: { $ref: "#/components/schemas/PlaybackDecision" }
        limitKbps: { type: integer, description: Bitrate ceiling applied; absent = none. }
        limitReason: { type: string }
        networkClass: { $ref: "#/components/schemas/NetworkClass" }
        audioStreamId: { type: integer, format: int64 }
        subtitleStreamId: { type: integer, format: int64 }
        subtitleUrl: { type: string, description: The selected text subtitle as WebVTT or ASS (absent when burned in or off). }
        subtitleFormat: { type: string, enum: [vtt, ass] }
        fontsUrl: { type: string, description: "With ASS subtitles: JSON list of fonts embedded in the file ({name, url}[])." }
        markers: { type: array, items: { $ref: "#/components/schemas/Marker" } }
        trackGainDb: { type: number, description: "Music: gain to apply for volume levelling (ReplayGain track gain)." }
        albumGainDb: { type: number, description: "Music: album gain, for playing whole albums." }
        peak: { type: number, description: "Music: peak sample level (1.0 = full scale), to avoid clipping when boosting." }
        subtitleOffsetMs: { type: integer, description: "Subtitle offset applied (PLAY-17). subtitleUrl also takes ?offsetMs= to try another without restarting." }
        audioOffsetMs: { type: integer, description: Audio offset applied (PLAY-17). }

    PlaybackProgress:
      type: object
      required: [positionMs, state]
      properties:
        positionMs: { type: integer, format: int64 }
        state: { type: string, enum: [playing, paused, buffering, error] }
        error: { type: string, description: "With state error: what the player reported (logged on the server for diagnosis)." }

    PlaybackSessionInfo:
      type: object
      required: [id, userId, userName, deviceName, itemId, itemType, title, method, summary, networkClass, positionMs, durationMs, state, bitrateKbps, startedAt]
      properties:
        id: { type: string }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        deviceName: { type: string }
        clientIp: { type: string }
        itemId: { type: integer, format: int64 }
        itemType: { $ref: "#/components/schemas/ItemType" }
        title: { type: string }
        method: { type: string, enum: [direct_play, direct_stream, transcode] }
        summary: { type: string }
        reasons: { type: array, items: { type: string } }
        encoder: { type: string }
        networkClass: { $ref: "#/components/schemas/NetworkClass" }
        positionMs: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        state: { type: string }
        bitrateKbps: { type: integer }
        startedAt: { type: string, format: date-time }
        imageId: { type: integer, format: int64, description: "Artwork id for a thumbnail (episode still, backdrop or poster)." }
        subtitle: { type: string, description: "Episode or album line, e.g. S2 · E5 · Title" }

    HistoryEntry:
      type: object
      required: [id, title, startedAt, source]
      properties:
        id: { type: integer, format: int64 }
        userName: { type: string }
        deviceName: { type: string }
        itemId: { type: integer, format: int64 }
        title: { type: string }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time }
        positionMs: { type: integer, format: int64 }
        method: { type: string }
        networkClass: { type: string }
        encoder: { type: string }
        bitrateKbps: { type: integer }
        source: { type: string, enum: [marquee, plex] }

    SystemStatus:
      type: object
      required: [version, startedAt, encoders, activeStreams, activeTranscodes, maxTranscodes, localKbps, remoteKbps, libraries]
      properties:
        version: { type: string }
        startedAt: { type: string, format: date-time }
        encoders:
          type: array
          description: Encoders that work on this server, in the configured order.
          items: { type: string }
        activeStreams: { type: integer }
        activeTranscodes: { type: integer }
        maxTranscodes: { type: integer }
        localKbps: { type: integer }
        remoteKbps: { type: integer }
        uploadSpeedKbps: { type: integer }
        bandwidthHistory:
          type: array
          description: The last hour, one sample a minute, oldest first.
          items: { $ref: "#/components/schemas/BandwidthSample" }
        host: { $ref: "#/components/schemas/HostInfo" }
        resources:
          type: array
          description: "The last hour of CPU, memory and GPU readings, one every 10 seconds, oldest first (empty after a restart or where the server can't read them)."
          items: { $ref: "#/components/schemas/ResourceSample" }
        libraries:
          type: array
          items:
            type: object
            required: [id, name, type, items]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              type: { $ref: "#/components/schemas/LibraryType" }
              items: { type: integer }

    StorageReport:
      type: object
      required: [libraries, largest, volumes]
      properties:
        libraries: { type: array, items: { $ref: "#/components/schemas/StorageLibrary" } }
        largest: { type: array, description: "The biggest movies and shows (a show counts all its episodes), biggest first.", items: { $ref: "#/components/schemas/StorageTitle" } }
        volumes: { type: array, items: { $ref: "#/components/schemas/StorageVolume" } }

    StorageLibrary:
      type: object
      required: [id, name, type, bytes, files, history]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/LibraryType" }
        bytes: { type: integer, format: int64, description: Size of the library's available files. }
        files: { type: integer }
        history: { type: array, description: "One sample a day, oldest first (starts the day the server first recorded one).", items: { $ref: "#/components/schemas/StorageSample" } }

    StorageSample:
      type: object
      required: [date, bytes]
      properties:
        date: { type: string, format: date }
        bytes: { type: integer, format: int64 }

    StorageTitle:
      type: object
      required: [itemId, title, type, bytes, libraryId]
      properties:
        itemId: { type: integer, format: int64 }
        title: { type: string }
        type: { type: string, description: "movie or show (also video, for home videos)." }
        year: { type: integer }
        libraryId: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        files: { type: integer }

    StorageVolume:
      type: object
      required: [path, totalBytes, freeBytes]
      properties:
        path: { type: string, description: "A folder on the volume: config, transcode, recordings or a library folder." }
        label: { type: string, description: "What it holds, e.g. Config, Transcode, Movies." }
        totalBytes: { type: integer, format: int64 }
        freeBytes: { type: integer, format: int64 }

    TimeLimitStatus:
      type: object
      required: [limited, allowedNow]
      properties:
        limited: { type: boolean, description: "The caller has a time limit or viewing hours." }
        allowedNow: { type: boolean, description: "Video may play now." }
        minutesLeft: { type: integer, description: "Minutes of video left today (only with a daily limit)." }
        limitMinutes: { type: integer, description: "Today's limit." }
        usedMinutes: { type: integer, description: "Minutes watched today." }
        allowedFrom: { type: string, description: "Viewing hours (HH:MM), when set." }
        allowedUntil: { type: string }
        reason: { type: string, description: "Why video can't play now, to show as is (e.g. \"Time's up for today\", \"Viewing hours are 07:00–20:00\")." }
        resetsAt: { type: string, format: date-time, description: "When video may play again, if not now." }

    VodFollowRequest:
      type: object
      properties:
        maxGb: { type: number, minimum: 0, description: "This follow's own size limit in GB (10^9 bytes): once its saved episodes reach it, new ones aren't saved. 0 = none (only the DVR quota). Omitted = the server's followDefaultMaxGb (on a new follow) or unchanged." }
        includeExisting: { type: boolean, description: "Also save the episodes already there (from the start), not only new ones. Only on a new follow. Default false." }
        destination: { type: string, description: "A save folder name (VodSaveSettings.destinations) instead of the shows folder." }

    VodFollow:
      type: object
      required: [seriesId, title, userId, usedBytes, episodesSaved, status, createdAt]
      properties:
        seriesId: { type: integer, format: int64 }
        title: { type: string }
        posterUrl: { type: string }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        maxGb: { type: number, description: "0 = no own limit." }
        usedBytes: { type: integer, format: int64, description: "Size of the episodes this follow saved that are still in the library." }
        episodesSaved: { type: integer }
        episodesQueued: { type: integer }
        status: { type: string, description: "following, full (its size limit is reached), quota (the owner's DVR quota is full) or paused (following is off or the owner may not record). New statuses may be added." }
        statusText: { type: string, description: "The status for people, e.g. \"Paused: your recording space is full\"." }
        createdAt: { type: string, format: date-time }
        lastNewAt: { type: string, format: date-time, description: "When it last queued a new episode." }

    HostInfo:
      type: object
      required: [cpuCores, memTotalBytes]
      properties:
        cpuCores: { type: integer }
        memTotalBytes: { type: integer, format: int64 }
        gpuName: { type: string, description: "NVIDIA GPU, when there is one." }
        gpuMemTotalBytes: { type: integer, format: int64 }

    ResourceSample:
      type: object
      required: [at, hostCpu, serverCpu, hostMemBytes, serverMemBytes]
      properties:
        at: { type: string, format: date-time }
        hostCpu: { type: number, description: "The whole machine's CPU use, percent of all cores." }
        serverCpu: { type: number, description: "Marquee's CPU use (the server and the FFmpeg processes it runs), percent of all cores." }
        hostMemBytes: { type: integer, format: int64, description: The machine's memory in use. }
        serverMemBytes: { type: integer, format: int64, description: "Marquee's memory (the server and its FFmpeg processes)." }
        gpu: { type: number, description: "NVIDIA GPU use, percent; omitted when not known." }
        gpuEncoder: { type: number }
        gpuDecoder: { type: number }

    SpeedTestResult:
      type: object
      required: [downloadMbps, uploadMbps, latencyMs, testedAt]
      properties:
        downloadMbps: { type: number }
        uploadMbps: { type: number }
        latencyMs: { type: number, description: Median round trip to the test server. }
        testedAt: { type: string, format: date-time }
        server: { type: string, example: Cloudflare }

    SubtitleStyle:
      type: object
      description: "How text subtitles look (PLAY-20), for this person on every app and in burned-in subtitles. Styled ASS subtitles keep their own look. Absent fields use the defaults."
      properties:
        size: { type: string, enum: [small, medium, large, huge], description: Default medium. }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", description: "Text colour, default #FFFFFF." }
        background: { type: string, enum: [none, outline, translucent, opaque], description: "none = drop shadow only; outline = black edge (default); translucent / opaque = a box behind the text." }
        position: { type: string, enum: [bottom, raised], description: "raised lifts subtitles above the player's controls and lower-third captions." }

    BazarrSubtitleLanguage:
      type: object
      required: [code2, name, forced, hi, have]
      properties:
        code2: { type: string, description: "ISO 639-1, e.g. en" }
        code3: { type: string }
        name: { type: string }
        forced: { type: boolean }
        hi: { type: boolean, description: Hearing impaired. }
        have: { type: boolean, description: A subtitle for this language exists (false = wanted by the item's Bazarr language profile). }

    BazarrStatus:
      type: object
      required: [configured, managed, languages]
      properties:
        configured: { type: boolean, description: Bazarr is set up on this server. }
        managed: { type: boolean, description: Bazarr knows this movie or episode. }
        languages:
          type: array
          description: Subtitles it has and the ones its language profile still wants.
          items: { $ref: "#/components/schemas/BazarrSubtitleLanguage" }
        error: { type: string, description: Why Bazarr couldn't be asked (e.g. unreachable). }

    BazarrDownloadRequest:
      type: object
      required: [language]
      properties:
        language: { type: string, description: "ISO 639-1 code, e.g. en" }
        forced: { type: boolean }
        hi: { type: boolean }

    BazarrCandidate:
      type: object
      required: [provider, subtitle, language, score]
      properties:
        provider: { type: string }
        subtitle: { type: string, description: "Bazarr's opaque handle for this result; send it back to download it." }
        language: { type: string }
        release: { type: string, description: The release names it was made for. }
        score: { type: integer, description: "Bazarr's match score (higher is better; hash matches are best)." }
        hi: { type: boolean }
        forced: { type: boolean }
        uploader: { type: string }
        originalFormat: { type: boolean }

    BazarrPick:
      type: object
      required: [provider, subtitle]
      properties:
        provider: { type: string }
        subtitle: { type: string }
        hi: { type: boolean }
        forced: { type: boolean }
        originalFormat: { type: boolean }

    RemoteCapability:
      type: string
      enum: [video, music]

    RemotePlayerState:
      type: object
      required: [state, positionMs]
      description: What a device is playing, as it reports it (USER-14).
      properties:
        state: { type: string, enum: [idle, playing, paused, buffering, stopped] }
        itemId: { type: integer, format: int64 }
        itemType: { $ref: "#/components/schemas/ItemType" }
        title: { type: string }
        subtitle: { type: string, description: "Artist, or show and episode." }
        artItemId: { type: integer, format: int64, description: The item whose poster/cover to show. }
        positionMs: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        queueIndex: { type: integer }
        queueLength: { type: integer }
        volume: { type: number, minimum: 0, maximum: 1, description: The app's own volume when it has one. }
        audioStreamId: { type: integer, format: int64 }
        subtitleStreamId: { type: integer, format: int64 }
        shuffle: { type: boolean }

    RemotePlayer:
      type: object
      required: [deviceId, name, platform, userId, userName, capabilities, version]
      properties:
        deviceId: { type: integer, format: int64 }
        name: { type: string }
        platform: { type: string }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/RemoteCapability" }
        state: { $ref: "#/components/schemas/RemotePlayerState" }
        version: { type: integer, format: int64, description: "Changes whenever the state does; pass it as ?since= to wait for the next change." }

    RemoteCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [play, pause, resume, seek, stop, next, previous, setAudio, setSubtitle, setVolume] }
        itemIds:
          type: array
          description: "play: what to play. One item plays it (an album, show, playlist item or track: the device expands it the way its own Play button would); several tracks are played as a queue."
          items: { type: integer, format: int64 }
        index: { type: integer, description: "play: start at this entry of itemIds." }
        startMs: { type: integer, format: int64, description: "play: start here (omit to resume)." }
        shuffle: { type: boolean }
        positionMs: { type: integer, format: int64, description: seek target. }
        streamId: { type: integer, format: int64, description: "setAudio / setSubtitle (-1 = subtitles off)." }
        volume: { type: number, minimum: 0, maximum: 1 }
        from: { type: string, readOnly: true, description: The controlling device's name. }

    RemoteInboxRequest:
      type: object
      required: [capabilities]
      properties:
        cursor: { type: integer, format: int64, description: The cursor from the last answer; 0 the first time. }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/RemoteCapability" }
        state: { $ref: "#/components/schemas/RemotePlayerState" }

    RemoteInbox:
      type: object
      required: [cursor, commands]
      properties:
        cursor: { type: integer, format: int64 }
        commands:
          type: array
          items: { $ref: "#/components/schemas/RemoteCommand" }

    RecapEntry:
      type: object
      required: [item, plays, minutes]
      properties:
        item: { $ref: "#/components/schemas/ItemSummary" }
        plays: { type: integer }
        minutes: { type: integer }

    ListeningRecap:
      type: object
      required: [year, minutes, plays, tracks, artists, newArtists, topArtists, topAlbums, topTracks, topGenres, byMonth, byHour, longestStreakDays]
      description: A person's year in music (MUSIC-22), from their play history.
      properties:
        year: { type: integer }
        minutes: { type: integer }
        plays: { type: integer }
        tracks: { type: integer, description: Different tracks played. }
        artists: { type: integer, description: Different artists played. }
        newArtists: { type: integer, description: Artists first played this year. }
        topArtists: { type: array, items: { $ref: "#/components/schemas/RecapEntry" } }
        topAlbums: { type: array, items: { $ref: "#/components/schemas/RecapEntry" } }
        topTracks: { type: array, items: { $ref: "#/components/schemas/RecapEntry" } }
        topGenres:
          type: array
          items:
            type: object
            required: [name, plays]
            properties:
              name: { type: string }
              plays: { type: integer }
        byMonth: { type: array, description: "Minutes listened in each month, January first.", items: { type: integer } }
        byHour: { type: array, description: "Plays started in each hour of the day (server time), 0–23.", items: { type: integer } }
        topDay:
          type: object
          required: [date, minutes]
          properties:
            date: { type: string, format: date }
            minutes: { type: integer }
        longestStreakDays: { type: integer, description: Most days in a row with music. }
        firstTrack: { $ref: "#/components/schemas/ItemSummary" }
        videoHours: { type: number, description: Hours of movies and TV watched the same year. }

    MuseVideoRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 2, maxLength: 300, example: "90s sci-fi with time travel" }
        libraryId: { type: integer, format: int64, description: Only this library. }
        types:
          type: array
          description: Default movies and shows.
          items: { type: string, enum: [movie, show] }
        limit: { type: integer, minimum: 1, maximum: 100, description: Default 40. }
        includeVod: { type: boolean, default: false, description: "Also suggest films and series on demand that fit (in vod; the caller must be allowed on demand)." }

    MuseVideoResult:
      type: object
      required: [items, understood]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        understood: { type: string, description: "How the prompt was read, e.g. \"Movies · 1990s · Science Fiction · like 'time travel'\"." }
        analysed: { type: number, description: Share of the library ready for Muse (0–1); below 1 while it's still being indexed. }
        title: { type: string, description: "A short title for the results (AI), or the prompt." }
        reasons:
          type: array
          description: "One-line reasons for the top results, when AI re-ranked them."
          items: { $ref: "#/components/schemas/RecommendationReason" }
        vod:
          type: array
          description: "With includeVod: films and series on demand that fit, best first (not in the caller's libraries)."
          items: { $ref: "#/components/schemas/VodSuggestion" }

    HealthCheck:
      type: object
      required: [id, title, description, count, severity]
      properties:
        id: { type: string, enum: [duplicates, unmatched, unavailable, unplayable, upgrades, playbackErrors, missingArtwork, missingSubtitles] }
        title: { type: string }
        description: { type: string }
        count: { type: integer }
        severity: { type: string, enum: [info, warning, error] }
        available: { type: boolean, description: "False when the check can't run (e.g. missingSubtitles without Bazarr)." }

    HealthIssue:
      type: object
      required: [item, detail]
      properties:
        item: { $ref: "#/components/schemas/ItemSummary" }
        fileId: { type: integer, format: int64 }
        path: { type: string }
        detail: { type: string, example: "720p · 2.1 Mbps" }
        related:
          type: array
          description: "duplicates: the other copies."
          items: { $ref: "#/components/schemas/ItemSummary" }
        files:
          type: array
          description: "The files involved, to compare. duplicates: every file of every copy (this item and the related ones)."
          items: { $ref: "#/components/schemas/IssueFile" }

    IssueFile:
      type: object
      required: [itemId, itemTitle, file, addedAt]
      properties:
        itemId: { type: integer, format: int64 }
        itemTitle: { type: string }
        versionLabel: { type: string }
        file: { $ref: "#/components/schemas/MediaFile" }
        addedAt: { type: string, format: date-time }

    HealthIssuePage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HealthIssue" } }
        total: { type: integer }
        offset: { type: integer }

    SmartCollectionRules:
      type: object
      description: "A smart collection's rules (META-7): its members are the library's movies or shows matching these, kept current. Only on collections that are smart."
      required: [itemType]
      properties:
        itemType: { type: string, enum: [movie, show] }
        sort: { type: string, description: A library sort (see the sort parameter). Default title. }
        limit: { type: integer, minimum: 0, maximum: 1000, description: At most this many; 0 = all. }
        watch: { type: string, enum: [unwatched, watched, in_progress] }
        genre: { type: string }
        decade: { type: integer }
        contentRating: { type: string }
        resolution: { type: string, enum: ["4k", "1080", "720", sd] }
        hdr: { type: boolean }
        yearFrom: { type: integer }
        yearTo: { type: integer }
        addedDays: { type: integer, minimum: 0, description: Added in the last this many days. }
        studio: { type: string, description: Studio or network. }
        personId: { type: integer, format: int64, description: In the cast or crew. }
        minRating: { type: number, minimum: 0, maximum: 10, description: "Audience, IMDb or critic rating of at least this (0–10)." }

    SmartCollectionSave:
      type: object
      required: [rules]
      properties:
        title: { type: string, maxLength: 200, description: Required when creating. }
        rules: { $ref: "#/components/schemas/SmartCollectionRules" }

    HomeLayout:
      type: object
      required: [rows]
      description: "The person's Home rows (USER-12), in order. Built-in rows have ids like continue-watching, watchlist, recommended, because-you-watched (shown as up to two \"Because you watched X\" rows with hub ids because-<itemId>, \"Because you love X\" when X is a favourite; USER-16), favorites (your favourite movies and shows, newest first; hidden until shown), holiday (in the 30 days up to and including Halloween, Thanksgiving and Christmas, a row of each one's films and shows, hub ids holiday-halloween, holiday-thanksgiving, holiday-christmas), top-rated (acclaimed titles you haven't watched), trending (most watched in the household lately), genres (up to three rows from genres you watch, hub ids genre-<name>, changing daily), new-releases, acclaimed (critics' favourites), binge-worthy (long-running shows), short-films (under 95 minutes), decades (the best of one decade, hub ids decade-<year>, changing daily), classics (before 1980), family (family films and shows), international (not originally in English), watch-again (films you loved a while ago), recent-<libraryId> and played-<libraryId>; pinned collections and playlists are collection-<id> and playlist-<id>. Rows not listed (e.g. a new library's) appear after the listed ones."
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/HomeLayoutRow" }

    HomeLayoutRow:
      type: object
      required: [id]
      properties:
        id: { type: string }
        title: { type: string, readOnly: true, description: Filled in by the server. }
        hidden: { type: boolean }
        pinned: { type: boolean, readOnly: true, description: A pinned collection or playlist (remove it from the list to unpin). }

    Invite:
      type: object
      required: [id, createdAt, restrictions]
      properties:
        id: { type: integer, format: int64 }
        note: { type: string, description: "Who it's for, e.g. Mum." }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time }
        usedBy: { type: string, description: The display name of who joined with it. }
        restrictions: { $ref: "#/components/schemas/UserRestrictions" }

    InviteCreate:
      type: object
      properties:
        note: { type: string, maxLength: 100 }
        expiresDays: { type: integer, minimum: 1, maximum: 90, description: Default 7. }
        restrictions: { $ref: "#/components/schemas/UserRestrictions" }

    InviteCreated:
      type: object
      required: [invite, token, path]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        token: { type: string, description: Shown once. }
        path: { type: string, description: "The web page to send, relative to the server's address: /join/<token>." }

    InviteInfo:
      type: object
      required: [serverName, expiresAt]
      properties:
        serverName: { type: string }
        invitedBy: { type: string }
        note: { type: string }
        expiresAt: { type: string, format: date-time }

    InviteAccept:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    Hub:
      type: object
      required: [id, title, items]
      properties:
        id: { type: string, example: continue-watching }
        title: { type: string }
        libraryId: { type: integer, format: int64 }
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        entries:
          type: array
          description: "Continue Watching only: the row's entries, library items and films and episodes on demand together, newest first (up to 20; items stays library-only for older apps). When it's present show it instead of items. The row is sent when either has something."
          items: { $ref: "#/components/schemas/ContinueEntry" }
        total: { type: integer, description: "Continue Watching only: how many entries there are in all (GET /hubs/continue-watching); more than entries holds means a View more link." }
        vodEntries:
          type: array
          description: "Watch on VOD (id vod-suggestions) only, sent when the request asks with vod=true: films and series on demand picked for the caller, best first (items is empty)."
          items: { $ref: "#/components/schemas/VodSuggestion" }
        mixedEntries:
          type: array
          description: "Sent when the request asks with mixed=true, on suggestion rows and the watchlist: library items and films and series on demand together, best first (the watchlist: most recently added first). When it's present show it instead of items (mark the on-demand ones as VOD)."
          items: { $ref: "#/components/schemas/HomeEntry" }

    HomeEntry:
      type: object
      description: "One title in a mixed Home row: a library movie or show, or a film or series on demand."
      required: [kind, key]
      properties:
        kind: { type: string, enum: [item, vod] }
        key: { type: string, description: "Unique within the row, e.g. item:12, vod:movie:5, vod:series:7." }
        item: { $ref: "#/components/schemas/ItemSummary" }
        vod: { $ref: "#/components/schemas/VodSuggestion" }

    ContinueEntry:
      type: object
      description: "A Continue Watching entry: a library item (an in-progress movie, episode or video, or a show's next episode) or a film or episode on demand stopped part-way through."
      required: [kind, key, positionMs, durationMs, lastWatchedAt]
      properties:
        kind: { type: string, enum: [item, vodMovie, vodEpisode] }
        key: { type: string, description: "Unique within the list, e.g. item:12, vodMovie:5, vodEpisode:7." }
        item: { $ref: "#/components/schemas/ItemSummary" }
        vodMovie: { $ref: "#/components/schemas/VodMovie" }
        vodEpisode: { $ref: "#/components/schemas/VodEpisode" }
        seriesPosterUrl: { type: string, description: "A vodEpisode's series poster (server-relative; no token needed)." }
        positionMs: { type: integer, format: int64, description: "The resume point (0 for a show's next episode)." }
        durationMs: { type: integer, format: int64, description: 0 = unknown. }
        lastWatchedAt: { type: string, format: date-time }

    ContinueWatchingPage:
      type: object
      required: [total, entries]
      properties:
        total: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ContinueEntry" }

    # ---------- Items ----------
    ItemType:
      type: string
      enum: [movie, show, season, episode, artist, album, track, video, collection]

    LibraryFilters:
      type: object
      required: [genres, decades, contentRatings, letters]
      properties:
        genres: { type: array, items: { $ref: "#/components/schemas/Facet" } }
        decades: { type: array, items: { $ref: "#/components/schemas/Facet" } }
        contentRatings: { type: array, items: { $ref: "#/components/schemas/Facet" } }
        letters: { type: array, items: { $ref: "#/components/schemas/LetterOffset" } }

    LetterOffset:
      type: object
      required: [letter, offset]
      properties:
        letter: { type: string }
        offset: { type: integer, description: Position of the first item with this letter in the title-sorted listing. }

    Facet:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    PersonDetail:
      type: object
      required: [id, name, hasPhoto, credits]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hasPhoto: { type: boolean }
        credits: { type: array, items: { $ref: "#/components/schemas/PersonCredit" } }

    PersonCredit:
      type: object
      required: [item, role]
      properties:
        item: { $ref: "#/components/schemas/ItemSummary" }
        role: { type: string }
        character: { type: string }

    QuickConnectStart:
      type: object
      required: [code, secret, expiresAt, pollIntervalMs]
      properties:
        code: { type: string, description: Six characters to show on screen. }
        secret: { type: string, description: Kept by the device to poll for the result. }
        expiresAt: { type: string, format: date-time }
        pollIntervalMs: { type: integer }

    QuickConnectState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, expired] }
        auth: { $ref: "#/components/schemas/AuthResult" }

    PlaylistKind:
      type: string
      enum: [video, audio]

    Playlist:
      type: object
      required: [id, title, kind, itemCount, durationMs, imageIds, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        kind: { $ref: "#/components/schemas/PlaylistKind" }
        itemCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        imageIds:
          type: array
          description: Posters/covers of up to four items, for the playlist's mosaic.
          items: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        rules: { $ref: "#/components/schemas/SmartRules" }

    PlaylistCreate:
      type: object
      required: [title, kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/PlaylistKind" }
        itemIds:
          type: array
          maxItems: 500
          items: { type: integer, format: int64 }
        rules: { $ref: "#/components/schemas/SmartRules" }

    PlaylistItemPage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlaylistEntry" } }
        total: { type: integer }
        offset: { type: integer }

    PlaylistEntry:
      type: object
      required: [entryId, item]
      properties:
        entryId: { type: integer, format: int64 }
        item: { $ref: "#/components/schemas/ItemSummary" }

    TaskInfo:
      type: object
      required: [id, name, description, schedule, running]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        schedule: { type: string, description: "Human-readable, e.g. \"Daily in the maintenance window\"." }
        running: { type: boolean }
        lastRun: { $ref: "#/components/schemas/TaskRun" }
        enabled: { type: boolean, description: "Off: the task never runs on its schedule or automatically (after scans, recordings and the like); Run now still works. Default on." }

    TaskRun:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        message: { type: string }

    Backup:
      type: object
      required: [name, size, createdAt, kind]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [scheduled, manual, pre-migration, pre-restore] }

    BandwidthSample:
      type: object
      required: [at, localKbps, remoteKbps, streams, transcodes]
      properties:
        at: { type: string, format: date-time }
        localKbps: { type: integer }
        remoteKbps: { type: integer }
        streams: { type: integer }
        transcodes: { type: integer }

    MusicStatus:
      type: object
      required: [enabled, available, running, analyzed, total]
      properties:
        enabled: { type: boolean }
        available: { type: boolean, description: The analysis service is running. }
        running: { type: boolean }
        model: { type: string }
        device: { type: string }
        analyzed: { type: integer }
        total: { type: integer }
        failed: { type: integer }
        progress: { type: integer }
        runTotal: { type: integer }

    RadioRequest:
      type: object
      required: [seed]
      properties:
        seed: { type: string, enum: [item, genre, decade, mood, favourites, library], description: "favourites: from your favourite songs, albums and artists (the heart) and what you play and rate highly." }
        itemId: { type: integer, format: int64, description: "With seed item: a track, album or artist." }
        value: { type: string, description: "With genre: the genre; decade: e.g. 1990; mood: a word or phrase." }
        libraryId: { type: integer, format: int64 }
        limit: { type: integer, minimum: 5, maximum: 100, default: 50 }
        exclude:
          type: array
          description: Tracks already queued (to continue a station).
          items: { type: integer, format: int64 }

    Station:
      type: object
      required: [title, items]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemSummary" }

    Download:
      type: object
      required: [id, itemId, quality, status, progress]
      properties:
        id: { type: string, description: '"original-<item>" for originals.' }
        itemId: { type: integer, format: int64 }
        quality: { type: string, enum: [original, high, medium, low] }
        status: { type: string, enum: [queued, converting, ready, failed] }
        progress: { type: number, description: "Conversion progress, 0–1." }
        size: { type: integer, format: int64, description: "Bytes, once ready." }
        url: { type: string, description: "Where to fetch the file once ready (supports HTTP ranges; send the token as for streams)." }
        fileName: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }

    SubtitleResult:
      type: object
      required: [fileId, language, release, downloads, hearingImpaired, hashMatch, aiTranslated]
      properties:
        fileId: { type: integer, format: int64 }
        language: { type: string, description: "ISO 639-1 (e.g. en, pt-BR)." }
        release: { type: string }
        fileName: { type: string }
        downloads: { type: integer }
        hearingImpaired: { type: boolean }
        foreignPartsOnly: { type: boolean }
        aiTranslated: { type: boolean, description: Machine or AI translated. }
        hashMatch: { type: boolean, description: Made for this exact file. }

    Stats:
      type: object
      required: [plays, hours, videoHours, musicHours, users, days, movies, shows, artists, albums, tracks, people, platforms, methods, local, remote]
      properties:
        since: { type: string, format: date-time }
        plays: { type: integer }
        hours: { type: number }
        videoHours: { type: number }
        musicHours: { type: number }
        users: { type: integer, description: People who played something. }
        days:
          type: array
          items:
            type: object
            required: [date, video, music, hours]
            properties:
              date: { type: string, format: date }
              video: { type: integer }
              music: { type: integer }
              hours: { type: number }
        movies: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        shows: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        artists: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        albums: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        tracks: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        people: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        platforms: { type: array, items: { $ref: "#/components/schemas/StatsCount" } }
        methods:
          type: object
          required: [directPlay, directStream, transcode]
          properties:
            directPlay: { type: integer }
            directStream: { type: integer }
            transcode: { type: integer }
        local: { type: integer }
        remote: { type: integer }

    StatsCount:
      type: object
      required: [title, plays, hours]
      properties:
        id: { type: integer, format: int64, description: "The item or user, when there is one." }
        title: { type: string }
        subtitle: { type: string }
        plays: { type: integer }
        hours: { type: number }

    Trickplay:
      type: object
      required: [intervalMs, width, height, columns, rows, count, sheets]
      properties:
        intervalMs: { type: integer, format: int64, description: Thumbnail n shows the video at n × intervalMs. }
        width: { type: integer, description: One thumbnail's width in pixels. }
        height: { type: integer }
        columns: { type: integer }
        rows: { type: integer }
        count: { type: integer, description: Thumbnails in total. }
        sheets: { type: integer }

    Lyrics:
      type: object
      required: [synced, lines, source]
      properties:
        synced: { type: boolean }
        source: { type: string, enum: [embedded, sidecar, lrclib] }
        lines: { type: array, items: { $ref: "#/components/schemas/LyricLine" } }

    LyricLine:
      type: object
      required: [text]
      properties:
        timeMs: { type: integer, format: int64, description: When the line is sung (synced lyrics only). }
        text: { type: string }

    SmartRules:
      type: object
      description: A smart playlist's rules (MUSIC-8); its contents are worked out each time it's opened.
      required: [match, conditions]
      properties:
        match: { type: string, enum: [all, any] }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [field, op, value]
            properties:
              field:
                type: string
                enum: [genre, artist, album, title, year, rating, playCount, lastPlayedDays, addedDays, bpm, energy, key, durationSeconds]
                description: "energy is a percentile of the analysed library: 0 = the calmest tracks, 0.8 = more intense than 80% of them."
              op: { type: string, enum: [is, isNot, contains, notContains, gt, lt] }
              value: { type: string }
        sort: { type: string, enum: [random, title, artist, year, -year, added, -added, rating, -rating, playCount, -playCount, lastPlayed, -lastPlayed] }
        limit: { type: integer, minimum: 1, maximum: 2000 }

    ItemSummary:
      type: object
      required: [id, libraryId, type, title, childCount, leafCount, available, matchState, addedAt]
      properties:
        id: { type: integer, format: int64 }
        libraryId: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ItemType" }
        title: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        index: { type: integer, description: "Season, episode or track number." }
        absoluteIndex: { type: integer, description: Absolute episode number (anime). }
        disc: { type: integer }
        parentId: { type: integer, format: int64 }
        grandparentId: { type: integer, format: int64 }
        parentTitle: { type: string }
        grandparentTitle: { type: string }
        artistCredit: { type: string, description: Track or album artist as credited. }
        childCount: { type: integer }
        leafCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        originallyAvailableAt: { type: string, format: date }
        available: { type: boolean, description: False when all of the item's files are missing (e.g. an offline drive). }
        matchState: { type: string, enum: [unmatched, matched, local, failed] }
        addedAt: { type: string, format: date-time }
        images: { $ref: "#/components/schemas/ItemImages" }
        viewOffsetMs: { type: integer, format: int64, description: Resume position for the current user. }
        viewCount: { type: integer }
        lastViewedAt: { type: string, format: date-time }
        watchedLeafCount: { type: integer, description: "Shows, seasons, artists, albums: how many episodes/tracks the user has watched." }
        userRating: { type: number, description: "The user's rating, 0–10 (10 = loved)." }
        watchlisted: { type: boolean, description: On the user's watchlist (USER-8). }
        favorite: { type: boolean, description: "One of the user's favourites (the heart). Absent or false when it isn't." }
        extraType:
          type: string
          description: Set for extras (LIB-8).
          enum: [trailer, featurette, behind_the_scenes, deleted_scene, interview, scene, short, other]
        releaseType:
          type: string
          description: "Albums: the kind of release, from MusicBrainz (META-3). Absent when unknown."
          enum: [album, ep, single, compilation, live, soundtrack, remix, demo, other]
        audioFormat: { $ref: "#/components/schemas/AudioFormat" }
        communityRating: { $ref: "#/components/schemas/CommunityRating" }

    CommunityRating:
      type: object
      description: "Everyone's ratings of an item combined (USER-17): the average of the accounts that rated it, 0–10. Absent when nobody has."
      required: [average, count]
      properties:
        average: { type: number }
        count: { type: integer, description: How many people rated it. }

    Review:
      type: object
      required: [userId, userName, updatedAt, mine]
      properties:
        userId: { type: integer, format: int64 }
        userName: { type: string }
        avatarUrl: { type: string }
        rating: { type: number, description: "Their rating, 0–10, if they rated it." }
        comment: { type: string }
        updatedAt: { type: string, format: date-time }
        mine: { type: boolean }

    ItemTrailer:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [local, youtube]
          description: "local: play itemId like any video. youtube: open or embed the YouTube video."
        itemId: { type: integer, format: int64, description: "The local trailer item (source local)." }
        youtubeKey: { type: string, description: "YouTube video id (source youtube)." }
        url: { type: string, description: "https://www.youtube.com/watch?v=<key> (source youtube)." }
        name: { type: string, description: "The trailer's title." }
    ItemReviews:
      type: object
      required: [count, reviews]
      properties:
        average: { type: number, description: Community average (absent when nobody rated it). }
        count: { type: integer, description: Number of ratings. }
        reviews:
          type: array
          description: Everyone who rated or commented, people with comments first, newest first.
          items: { $ref: "#/components/schemas/Review" }

    AudioFormat:
      type: object
      description: "Tracks: the file's audio quality (MUSIC-23), for apps that show it, e.g. FLAC 24/96 or MP3 320."
      required: [codec, lossless]
      properties:
        codec: { type: string, example: flac, description: "ffprobe codec name: flac, alac, mp3, aac, opus, vorbis, pcm_s16le…" }
        lossless: { type: boolean }
        bitrateKbps: { type: integer }
        sampleRate: { type: integer, description: "Hz, e.g. 96000" }
        bitDepth: { type: integer, description: "Bits per sample, for lossless formats (16, 24)." }
        channels: { type: integer }

    ItemImages:
      type: object
      description: Artwork ids for /images/{artworkId}. Seasons and episodes fall back to the show's art, tracks to the album's.
      properties:
        poster: { type: integer, format: int64 }
        backdrop: { type: integer, format: int64 }
        thumb: { type: integer, format: int64 }
        logo: { type: integer, format: int64 }

    ItemEdit:
      type: object
      description: Fields to change. Each changed field is locked. List fields in unlock to hand them back to the agents.
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        sortTitle: { type: string, maxLength: 300 }
        originalTitle: { type: string, maxLength: 300 }
        year: { type: integer, minimum: 1800, maximum: 2200 }
        originallyAvailableAt: { type: string, format: date }
        summary: { type: string, maxLength: 10000 }
        tagline: { type: string, maxLength: 500 }
        contentRating: { type: string, maxLength: 20 }
        studio: { type: string, maxLength: 200 }
        unlock:
          type: array
          items: { type: string, enum: [title, sortTitle, originalTitle, year, originallyAvailableAt, summary, tagline, contentRating, studio] }

    MatchCandidate:
      type: object
      required: [provider, id, title]
      properties:
        provider: { type: string, enum: [tmdb] }
        id: { type: string }
        title: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterUrl: { type: string, description: Small poster hosted by the provider. }
        current: { type: boolean, description: The item is currently matched to this entry. }

    MatchRequest:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string, enum: [tmdb] }
        id: { type: string }

    MusicMatchCandidate:
      type: object
      description: A MusicBrainz artist or release group offered by Fix match for music.
      required: [mbid, name]
      properties:
        mbid: { type: string, description: Artist MBID or release group MBID. }
        name: { type: string, description: Artist name or album title. }
        disambiguation: { type: string, description: "MusicBrainz's note telling same-named entries apart (\"US singer\")." }
        type: { type: string, description: "Artists: person, group, orchestra, choir… Albums: album, ep, single, live, compilation, soundtrack, remix, demo, other." }
        country: { type: string, description: Artists; ISO 3166-1 code. }
        year: { type: integer, description: Albums; year first released. }
        beginYear: { type: integer, description: Artists. }
        endYear: { type: integer, description: Artists. }
        artist: { type: string, description: Albums; the artist credit. }
        trackCount: { type: integer }
        score: { type: integer, description: "MusicBrainz search score, 0–100." }
        current: { type: boolean, description: The item is currently matched to this entry. }

    MusicMatchRequest:
      type: object
      required: [mbid]
      properties:
        mbid: { type: string, description: "Artist MBID for an artist; release group (or release) MBID for an album. A musicbrainz.org link works too." }

    TrackPlacementRequest:
      type: object
      description: "Either albumId (an album in the track's library) or albumArtist and album (found or created in the track's library)."
      properties:
        albumId: { type: integer, format: int64 }
        albumArtist: { type: string }
        album: { type: string }
        artist: { type: string, description: "The track's own artist, when it should change too." }

    Ratings:
      type: object
      description: External ratings (OMDb). Absent values are unknown.
      properties:
        imdb: { type: number, description: "0–10" }
        imdbVotes: { type: integer }
        rottenTomatoes: { type: integer, description: Tomatometer critic score 0–100 }
        metacritic: { type: integer, description: "0–100" }
        anilist: { type: integer, description: "AniList average score 0–100 (anime, META-2)." }

    Credit:
      type: object
      required: [personId, name, role]
      properties:
        personId: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [actor, director, writer, creator, producer, composer] }
        character: { type: string }
        hasPhoto: { type: boolean }

    ItemPage:
      type: object
      required: [items, total, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemSummary" }
        total: { type: integer }
        offset: { type: integer }

    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          required: [genres, externalIds, versions, chapters, credits, lockedFields]
          properties:
            lockedFields:
              type: array
              description: Fields edited by an administrator; agents never overwrite them.
              items: { type: string }
            placementOverride:
              type: boolean
              description: Tracks, for admins; moved to another album by hand (see /items/{itemId}/music-placement).
            collections:
              type: array
              description: Collections the item belongs to (META-7).
              items: { $ref: "#/components/schemas/ItemSummary" }
            smartRules: { $ref: "#/components/schemas/SmartCollectionRules" }
            extras:
              type: array
              description: Trailers, featurettes and other extras (LIB-8), trailers first.
              items: { $ref: "#/components/schemas/ItemSummary" }
            summary: { type: string }
            audienceRating: { type: number, description: "TMDB user score, 0–10" }
            ratings: { $ref: "#/components/schemas/Ratings" }
            credits:
              type: array
              items: { $ref: "#/components/schemas/Credit" }
            tagline: { type: string }
            contentRating: { type: string }
            studio: { type: string }
            genres:
              type: array
              items: { type: string }
            externalIds:
              type: object
              additionalProperties: { type: string }
              description: "Provider → ID, e.g. tmdb: 603, imdb: tt0133093."
            versions:
              type: array
              items: { $ref: "#/components/schemas/MediaVersion" }
            chapters:
              type: array
              items: { $ref: "#/components/schemas/Chapter" }

    MediaVersion:
      type: object
      required: [id, label, files]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/MediaFile" }

    MediaFile:
      type: object
      required: [id, size, available, partIndex, streams]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string, description: Absolute path inside the server. Only returned to administrators. }
        size: { type: integer, format: int64 }
        container: { type: string }
        durationMs: { type: integer, format: int64 }
        bitrateKbps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        videoCodec: { type: string }
        audioCodec: { type: string }
        hdrFormat: { type: string, enum: [hdr10, hdr10plus, hlg, dolby_vision] }
        dvProfile: { type: integer }
        partIndex: { type: integer }
        available: { type: boolean }
        streams:
          type: array
          items: { $ref: "#/components/schemas/MediaStream" }

    MediaStream:
      type: object
      required: [id, kind, codec, default, forced, hearingImpaired, external]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [video, audio, subtitle] }
        codec: { type: string }
        profile: { type: string }
        language: { type: string, description: ISO 639-2 code. }
        title: { type: string }
        default: { type: boolean }
        forced: { type: boolean }
        hearingImpaired: { type: boolean }
        external: { type: boolean, description: Sidecar subtitle file. }
        channels: { type: integer }
        channelLayout: { type: string }
        sampleRate: { type: integer }
        bitrateKbps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        frameRate: { type: number }
        bitDepth: { type: integer }

    Chapter:
      type: object
      required: [startMs, endMs]
      properties:
        title: { type: string }
        startMs: { type: integer, format: int64 }
        endMs: { type: integer, format: int64 }

    # ---------- Filesystem ----------
    DirectoryEntry:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }

    DirectoryListing:
      type: object
      required: [entries]
      properties:
        path: { type: string, nullable: true, description: Null when listing the browse roots. }
        parent: { type: string, nullable: true, description: Null at a browse root. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DirectoryEntry" }

    # ---------- Library optimizer ----------
    LargeFile:
      type: object
      description: "A movie or episode file in the Large files list."
      required: [fileId, itemId, title, type, path, size, width, height, videoCodec, hdr, bitrateKbps, durationMs, estimatedSize]
      properties:
        fileId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string, description: "The show and episode number, or the year." }
        type: { type: string, enum: [movie, episode] }
        path: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        width: { type: integer }
        height: { type: integer }
        videoCodec: { type: string, description: "FFprobe's name, e.g. h264, hevc, vc1." }
        hdr: { type: string, description: "HDR format (hdr10, hlg, dolby_vision, …); empty for SDR." }
        bitrateKbps: { type: integer }
        durationMs: { type: integer, format: int64 }
        estimatedSize: { type: integer, format: int64, description: "About how big it would be after the preset asked for." }
        jobId: { type: integer, format: int64, description: "The file's latest optimizer job, if any." }
        jobState: { $ref: "#/components/schemas/OptimizeJobState" }

    LargeFilePage:
      type: object
      required: [items, total, totalSize, estimatedSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LargeFile" }
        total: { type: integer, description: Files matching the filters. }
        totalSize: { type: integer, format: int64, description: "Bytes, all matching files." }
        estimatedSize: { type: integer, format: int64, description: "About how big all matching files would be after the preset." }

    OptimizeJobState:
      type: string
      enum: [queued, running, verifying, done, failed, cancelled, skipped, restored]
      description: "verifying = the new file is being checked (or waits for nobody to be watching before it's swapped in); done = optimized (the original was deleted, or kept in the media trash when keepOriginals is on: see originalDeleted); skipped = not worth it (see error); restored = the original was put back."

    OptimizeJob:
      type: object
      required: [id, title, path, presetId, presetName, state, progress, beforeSize, afterSize, canRestore, createdAt]
      properties:
        id: { type: integer, format: int64 }
        fileId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        title: { type: string }
        path: { type: string }
        presetId: { type: string }
        presetName: { type: string }
        state: { $ref: "#/components/schemas/OptimizeJobState" }
        progress: { type: number, description: "0–1." }
        fps: { type: number }
        speed: { type: number, description: "× real time." }
        etaSeconds: { type: integer, format: int64 }
        encoder: { type: string, description: "nvenc, qsv or software." }
        beforeSize: { type: integer, format: int64 }
        afterSize: { type: integer, format: int64, description: "The new file's size (also for a skipped job, showing why)." }
        error: { type: string, description: "Why it failed or was skipped." }
        paused: { type: string, description: "Why it's waiting (paused while someone is watching, outside the maintenance window, waiting for a viewer to stop before the swap)." }
        canRestore: { type: boolean, description: "The original is still in the media trash." }
        originalDeleted: { type: boolean, description: "The original was deleted once the new file was verified and swapped in (keepOriginals off), so it can't be restored." }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    OptimizeJobPage:
      type: object
      required: [items, total, savedBytes, optimized]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OptimizeJob" }
        total: { type: integer }
        savedBytes: { type: integer, format: int64, description: "Space saved by every optimized file (not restored)." }
        optimized: { type: integer, description: "How many files are optimized." }
        paused: { type: string, description: "Why the queue isn't running now, if it isn't." }
        keptOriginals: { type: integer, description: "Originals of optimized files still kept in the media trash (keepOriginals on, or from before it existed)." }
        keptOriginalsBytes: { type: integer, format: int64, description: "How much space those originals take." }

    OptimizeFilter:
      type: object
      description: "The Large files filters (as the list's query parameters)."
      properties:
        libraryId: { type: integer, format: int64 }
        type: { type: string, enum: [movie, episode] }
        minSizeGb: { type: number, minimum: 0 }
        minBitrateMbps: { type: number, minimum: 0 }
        resolution: { type: integer, enum: [2160, 1080, 720, 480] }
        codecs: { type: array, items: { type: string } }
        hdr: { type: string, enum: ["yes", "no"] }
        optimized: { type: string, enum: ["yes", "no"], description: "Only files already optimized (yes) or still to do (no: not optimized, not queued)." }

    OptimizeQueueRequest:
      type: object
      required: [presetId]
      properties:
        presetId: { type: string }
        fileIds: { type: array, items: { type: integer, format: int64 }, description: "The files to queue; or" }
        filter: { $ref: "#/components/schemas/OptimizeFilter" }

    OptimizeQueueResult:
      type: object
      required: [queued, skipped]
      properties:
        queued: { type: integer }
        skipped: { type: integer, description: "Already queued, or not an available movie or episode." }

    OptimizePreset:
      type: object
      required: [id, name, maxHeight, codec, quality, audio, hdr]
      properties:
        id: { type: string }
        name: { type: string }
        builtIn: { type: boolean, readOnly: true }
        maxHeight: { type: integer, enum: [0, 2160, 1080, 720, 480], description: "Resolution cap (never upscaled; letterboxed films fit the frame by width); 0 keeps it." }
        codec: { type: string, enum: [hevc, h264, av1], description: "AV1 only when the server has an AV1 encoder (av1Available)." }
        quality: { type: string, enum: [high, balanced, small], description: "Constant-quality level, unless videoKbps is set." }
        videoKbps: { type: integer, minimum: 0, maximum: 100000, description: "A target video bitrate instead of a quality; 0 = use the quality." }
        maxGbPerHour: { type: number, minimum: 0, maximum: 100, description: "The largest a result may be per hour of running time, in GB (10^9 bytes): 5 = a 2-hour film at most 10 GB. Each file's video bitrate is capped so that, with its audio and subtitles, it fits (files that need less stay smaller). 0 or omitted = no limit." }
        audio: { type: string, enum: [copy, aac_stereo, aac_51], description: "copy = every track as it is; aac_stereo / aac_51 = every track as AAC (at most 5.1). Every audio track (all languages, commentary) and every subtitle is always kept; an MP4 with picture subtitles becomes MKV." }
        hdr: { type: string, enum: [keep, tonemap], description: "keep = HDR stays HDR (10-bit HEVC or AV1; H.264 always tone-maps); tonemap = converted to SDR." }

    OptimizeSettings:
      type: object
      required: [presets, defaultPreset, concurrency, minSavingsPercent, pauseWhileWatching, windowOnly, paused]
      properties:
        presets:
          type: array
          description: "Custom presets (built-in ones sent back are ignored)."
          items: { $ref: "#/components/schemas/OptimizePreset" }
        defaultPreset: { type: string }
        concurrency: { type: integer, minimum: 1, maximum: 4, description: "Files optimized at once. Default 1." }
        minSavingsPercent: { type: integer, minimum: 5, maximum: 90, description: "A new file replaces the original only when it's at least this much smaller; otherwise it's thrown away and the job skipped. Default 20." }
        pauseWhileWatching: { type: boolean, description: "Pause while anyone is watching anything, resuming about 15 s after. Default on." }
        windowOnly: { type: boolean, description: "Only run inside the maintenance window." }
        paused: { type: boolean, description: "The queue is paused by an admin." }
        keepOriginals: { type: boolean, description: "On: originals go to the media trash (restorable until the daily Empty media trash task runs). Off (default): once the new file is verified and swapped in the original is deleted, freeing the space at once, and originals kept earlier are deleted too (at start-up and when this is saved off). Omitted on update = unchanged." }

    OptimizeConfig:
      type: object
      required: [settings, presets, av1Available]
      properties:
        settings: { $ref: "#/components/schemas/OptimizeSettings" }
        presets:
          type: array
          description: Every preset, built-in first.
          items: { $ref: "#/components/schemas/OptimizePreset" }
        av1Available: { type: boolean }
    # ---------- end library optimizer ----------
