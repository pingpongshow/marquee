# Marquee with Docker Compose. Copy .env.example to .env, set your folders, then:
#   docker compose up -d --build
# Add hardware transcoding with an override file:
#   NVIDIA:        docker compose -f compose.yaml -f compose.nvidia.yaml up -d --build
#   Intel/AMD VA:  docker compose -f compose.yaml -f compose.intel.yaml up -d --build
name: marquee
services:
  marquee:
    image: marquee:${MARQUEE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${MARQUEE_VERSION:-dev}
    container_name: marquee
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # Host networking lets the apps find the server on your network (Bonjour/mDNS).
    # Marquee listens on port 32500.
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      MARQUEE_LOG_LEVEL: ${MARQUEE_LOG_LEVEL:-info}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${VIDEO_DIR:?set VIDEO_DIR in .env}:/media/video${VIDEO_MODE:-:ro}
      - ${MUSIC_DIR:-./empty-music}:/media/music:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings
      - ${PLEX_DIR:-./empty-plex}:/plex:ro   # optional: a Plex data folder to import from
    tmpfs:
      - /transcode:size=${TRANSCODE_SIZE:-8g},uid=${PUID:-1000},gid=${PGID:-1000},mode=0750

  # Soundprint: music analysis and natural-language search (Muse, radios, "sounds like").
  # Runs on the CPU; add compose.nvidia.yaml to use an NVIDIA GPU. Remove this service if
  # you don't want those features. Only Marquee talks to it (127.0.0.1:32501).
  soundprint:
    image: marquee-soundprint:${MARQUEE_VERSION:-latest}
    build:
      context: ../soundprint
    container_name: marquee-soundprint
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: host
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - ${MUSIC_DIR:-./empty-music}:/media/music:ro
