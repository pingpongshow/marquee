# Marquee on the Unraid host. Copy to /mnt/docker/marquee/ with a .env (see .env.example).
name: marquee
services:
  marquee:
    image: marquee:${MARQUEE_VERSION:-latest}
    build:
      context: ./src
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${MARQUEE_VERSION:-dev}
    container_name: marquee
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    group_add:
      - "${RENDER_GID:-18}"   # host group owning /dev/dri/renderD* (Intel Quick Sync)
    runtime: nvidia           # NVIDIA NVENC/NVDEC
    devices:
      - /dev/dri:/dev/dri
    # Host networking so Bonjour reaches the LAN (apps find the server automatically).
    # Marquee listens on 32500 on every host interface, as the published port did.
    network_mode: host
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      MARQUEE_LOG_LEVEL: ${MARQUEE_LOG_LEVEL:-info}
    volumes:
      - ./config:/config
      - /mnt/data/Video:/media/video     # writable: Library Health can move files to .marquee-trash (allowMediaDeletion)
      - /mnt/data/Music:/media/music:ro
      - /mnt/docker/plex:/plex:ro          # Plex import (read-only)
      - ${RECORDINGS_DIR:-./recordings}:/recordings   # Live TV recordings (LIVE-5), writable
    tmpfs:
      - /transcode:size=16g,uid=${PUID:-99},gid=${PGID:-100},mode=0750

  # Soundprint analysis (MUSIC-1, D56): CLAP embeddings, tempo and key for music, on the GPU.
  # Only Marquee talks to it (127.0.0.1:32501). Media is read-only; the model is cached in ./models.
  soundprint:
    image: marquee-soundprint:${MARQUEE_VERSION:-latest}
    build:
      context: ./src/soundprint
    container_name: marquee-soundprint
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/models
      - /mnt/data/Music:/media/music:ro
