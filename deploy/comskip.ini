; Comskip settings Marquee uses to find commercial breaks in Live TV recordings.
; US broadcast defaults. Marquee reads the EDL/txt output: with Commercials set to Remove
; commercials the breaks are cut out of the recording, with Detect only they are marked.
; Keys left out keep Comskip's built-in defaults.

[Main Settings]
; 1 black frames + 2 logo + 8 fuzzy logic + 32 aspect ratio + 64 silence
detect_method=107
verbose=0
max_brightness=60
test_brightness=40
max_avg_brightness=25
maxbright=1
; A break is 25 s to 10 min; a single advert 4 s to 2 min.
max_commercialbreak=600
min_commercialbreak=25
max_commercial_size=125
min_commercial_size=4
min_show_segment_length=250
max_volume=500
non_uniformity=500
min_silence=12
noise_level=5
brightness_jump=200
fps=1
validate_silence=1
validate_uniform=1
validate_scenechange=1
global_threshold=1.05
disable_heuristics=4
cut_on_ac_change=1
cut_on_ar_change=1
; Software decoding, two threads: detection runs in the background at low priority.
thread_count=2
hardware_decode=0
lowres=0
skip_b_frames=0
padding=0
remove_before=0
remove_after=0
always_keep_first_seconds=0
always_keep_last_seconds=0

[Logo Finding]
give_up_logo_search=2000
delay_logo_search=0
logo_max_percentage_of_screen=0.12
ticker_tape=0
ignore_side=0
subtitles=0
logo_at_bottom=0
logo_threshold=0.75
logo_filter=0
aggressive_logo_rejection=0
edge_level_threshold=5
edge_radius=2
edge_weight=10
edge_step=1
num_logo_buffers=50
use_existing_logo_file=0
two_pass_logo=1
connect_blocks_with_logo=1
logo_percentile=0.92
logo_fraction=0.4
shrink_logo=5
shrink_logo_tail=0
min_black_frames_for_break=1

[Live TV]
live_tv=0

[Output Control]
; The .txt (frame numbers) and .edl (seconds) cut lists; nothing else.
output_default=1
output_edl=1
edl_offset=0
edl_skip_field=0
output_chapters=0
output_live=0
output_videoredo=0
output_videoredo3=0
output_zoomplayer_cutlist=0
output_zoomplayer_chapter=0
output_scf=0
output_vcf=0
output_vdr=0
output_projectx=0
output_avisynth=0
output_btv=0
output_edlp=0
output_bsplayer=0
output_edlx=0
output_cuttermaran=0
output_mpeg2schnitt=0
output_womble=0
output_mls=0
output_mpgtx=0
output_dvrmstb=0
output_dvrcut=0
output_ipodchap=0
output_framearray=0
output_debugwindow=0
output_tuning=0
output_training=0
output_false=0
output_aspect=0
output_demux=0
output_data=0
output_srt=0
output_smi=0
output_timing=0
output_incommercial=0
delete_logo_file=1
