# NVIDIA GPU (NVENC/NVDEC transcoding, GPU Soundprint). Needs the NVIDIA Container Toolkit.
services:
  marquee:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  soundprint:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
