# Generates Marquee.xcodeproj (run `xcodegen` in this directory). The project file is
# derived; edit this instead.
name: Marquee
options:
  bundleIdPrefix: app.marquee
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
packages:
  MarqueeKit:
    path: MarqueeKit
settings:
  base:
    MARKETING_VERSION: "0.40.0"
    CURRENT_PROJECT_VERSION: "42"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
    dependencies:
      - package: MarqueeKit
      # Chromecast (D82): Google's Cast SDK, fetched by scripts/fetch-cast-sdk.sh.
      - framework: Vendor/GoogleCast.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.Marquee
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/iOS/Marquee-Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Marquee looks for your Marquee server, and TVs and speakers to cast to, on your home network.
        NSBonjourServices: [_marquee._tcp, _googlecast._tcp, _CC1AD845._googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # self-hosted server over plain HTTP on the LAN and Tailscale (WireGuard-encrypted)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        ITSAppUsesNonExemptEncryption: false
  MarqueeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: Marquee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.Marquee.uitests
        TEST_TARGET_NAME: Marquee
        GENERATE_INFOPLIST_FILE: YES
  MarqueeTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [App/TVUITests]
    dependencies:
      - target: MarqueeTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.Marquee.tv.uitests
        TEST_TARGET_NAME: MarqueeTV
        GENERATE_INFOPLIST_FILE: YES
  MarqueeTV:
    type: application
    platform: tvOS
    sources:
      - App/Shared
      - App/tvOS
      - App/TopShelfShared
    dependencies:
      - package: MarqueeKit
      - target: MarqueeTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.Marquee.tv
        PRODUCT_NAME: Marquee
        CODE_SIGN_ENTITLEMENTS: App/tvOS/MarqueeTV.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/tvOS/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Marquee looks for your Marquee server on your home network.
        NSBonjourServices: [_marquee._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.marquee.links
            CFBundleURLSchemes: [marquee]
        ITSAppUsesNonExemptEncryption: false
  MarqueeTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - App/TopShelf
      - App/TopShelfShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.Marquee.tv.topshelf
        CODE_SIGN_ENTITLEMENTS: App/TopShelf/TopShelf.entitlements
    info:
      path: App/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
schemes:
  Marquee:
    build:
      targets:
        Marquee: all
        MarqueeUITests: [test]
    test:
      targets: [MarqueeUITests]
      environmentVariables:
        MARQUEE_TEST_ADMIN_TOKEN: $(MARQUEE_TEST_ADMIN_TOKEN)
  MarqueeTV:
    build:
      targets:
        MarqueeTV: all
        MarqueeTVUITests: [test]
    test:
      targets: [MarqueeTVUITests]
      environmentVariables:
        MARQUEE_TEST_ADMIN_TOKEN: $(MARQUEE_TEST_ADMIN_TOKEN)
