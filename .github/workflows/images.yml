# Builds the server and Soundprint images and publishes them to GitHub Container Registry
# (ghcr.io/<owner>/marquee and ghcr.io/<owner>/marquee-soundprint) for each release, and on
# demand. The Unraid templates (github.com/pingpongshow/unraid-templates) install these.
name: Container images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: marquee
            context: .
            file: deploy/Dockerfile
          - image: marquee-soundprint
            context: soundprint
            file: soundprint/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Soundprint image (PyTorch and CUDA) is large: make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"; v="${v#v}"
          else
            v="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"; v="${v#v}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # A release, or a manual run (an intentional publish), also moves :latest, which the
          # Unraid templates install.
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/${{ matrix.image }}:latest
